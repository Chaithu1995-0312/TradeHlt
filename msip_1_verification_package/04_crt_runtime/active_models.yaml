# 8. MODEL PHILOSOPHY — Edge-Hypothesis Decomposition
# ───────────────────────────────────────────────────────────────────
# PRESERVED as architectural intent. These are DESIGN questions, NOT
# proven edges — see authority block. (§6.5 Authority Ladder: information
# and intent have NO authority; only demonstrated ΔG001 earns authority.)
philosophy:
  intent:
    description: >
      Each engine represents a distinct hypothesis about where trading edge
      originates. They decompose OHLCV into different questions.
    decomposition:
      crt:        "Is the market structure valid?"
      gaussian:   "Is this historically profitable?"
      zone_gate:  "Is this feature-space neighbourhood good?"
      rr:         "Is the reward-risk economically viable?"
      bitnet:     "Is this market state acceptable?"
      trap:       "Is this a deception pattern?"
    composite_question: >
      "Is this OHLCV configuration structurally valid, historically
      successful, economically attractive, and in a favourable state?"

  authority:
    level: architectural_intent
    validated: false
    findings: [F-019, F-020, F-021, F-025, F-035, F-037, F-040]
    note: >
      The directional edge these hypotheses assume is NOT demonstrated: the
      entry-information null holds across crypto majors and FX (F-019/020/021/025/035)
      and across the candle-state transition frontier (F-040). Binding constraint =
      execution model, not predictability. Intent ≠ evidence.

  status: architectural_intent


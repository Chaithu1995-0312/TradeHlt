# REP shard — producer: feature_pipeline (CANONICAL_FEATURES, schema 9.0, 79 slots).
# A representation never defines meaning; it points to a concept in concept_contracts.yaml (I-2).
# Every slot appears exactly once: in `representations`, `raw_observations`, or the shrink-only
# `unmapped` ratchet (a slot leaves `unmapped` only by gaining a representation).

schema: representation_registry/v1
producer_id: feature_pipeline
schema_version: "9.0"

representations:

  double_sweep:
    slot: 6
    concept_id: MKT-C04
    encoding: bool_int8
    parameterization: {k: "feature_pipeline.swing_window", window: "feature_pipeline.double_sweep_window"}
    absence: "0 also when no swing reference exists yet (divergence, I-7)"
    note: "sweep_semantics latest_unconsumed = FM-060 (rule on the signed slot, recorded MKT-C04 divergence); e01_lifecycle = FM-092 (MKT-C04 v2, per-side MKT-E01 events)"

  trend_bias:
    slot: 10
    concept_id: MKT-C03
    encoding: signed_int {-1,0,1}
    parameterization: {ema_fast_span: "feature_pipeline.ema_fast_span", ema_slow_span: "feature_pipeline.ema_slow_span"}
    absence: "warmup rows dropped by the pipeline"

  sweep_detected:
    slot: 20
    concept_id: MKT-E01
    encoding: bool_int8 (abs of liquidity_sweep)
    parameterization: {founding: swing_pivot, tie: inclusive}
    divergence_ref: "MKT-E01 FM-058 tie"
    absence: "0 also when no swing reference exists yet (divergence, I-7)"
    note: "sweep_semantics latest_unconsumed = FM-059 (latest swing level, never consumed, inclusive tie); e01_lifecycle = FM-091 (any ACTIVE level, consumed, strict tie)"

  liquidity_sweep:
    slot: 21
    concept_id: MKT-E01
    encoding: signed_side_int {-1 LOWER swept, 0, +1 UPPER swept}; UPPER-first projection when both sides are swept on one bar (declared lossy encoding, MKT-E01 divergence "feature_pipeline.liquidity_sweep two-sided bar")
    parameterization: {founding: swing_pivot, tie: inclusive}
    divergence_ref: "MKT-E01 FM-058 tie"
    absence: "0 also when no swing reference exists yet (divergence, I-7)"
    note: "sweep_semantics latest_unconsumed = FM-058 (latest swing level, never consumed, inclusive tie); e01_lifecycle = FM-090 (any ACTIVE level, consumed, strict tie)"

  break_of_structure:
    slot: 22
    concept_id: MKT-C01
    encoding: signed_int {-1 BELOW_LAST_SWING_LOW, 0 INSIDE, +1 ABOVE_LAST_SWING_HIGH}
    parameterization: {k: "feature_pipeline.swing_window"}
    divergence_ref: "MKT-C01 FM-057 slot"
    absence: "0 also when no swing exists (UNDEFINED conflated with INSIDE, I-7)"

  swing_high:
    slot: 23
    concept_id: MKT-L01
    encoding: formation_flag (1 on the bar the UPPER swing level becomes available)
    parameterization: {founding: swing_pivot, k: "feature_pipeline.swing_window"}
    absence: "0 = no level formed this bar"

  swing_low:
    slot: 24
    concept_id: MKT-L01
    encoding: formation_flag (1 on the bar the LOWER swing level becomes available)
    parameterization: {founding: swing_pivot, k: "feature_pipeline.swing_window"}
    absence: "0 = no level formed this bar"

  higher_high:
    slot: 25
    concept_id: MKT-E08
    encoding: bool_int8 (UPPER side)
    parameterization: {founding: swing_pivot}
    absence: "0 also when no swing reference exists yet (divergence, I-7)"

  lower_low:
    slot: 26
    concept_id: MKT-E08
    encoding: bool_int8 (LOWER side)
    parameterization: {founding: swing_pivot}
    absence: "0 also when no swing reference exists yet (divergence, I-7)"

  session:
    slot: 31
    concept_id: MKT-C06
    encoding: session_ordinal
    parameterization: {session_timestamp_basis: "feature_pipeline.session_timestamp_basis"}
    absence: "n/a"

  change_of_character:
    slot: 47
    concept_id: MKT-C07
    encoding: signed_int {-1,0,1}
    parameterization: {}
    divergence_ref: "MKT-C07 name"
    absence: "0 also when an input is undefined (I-7)"

  # Schema 7.0 (2026-10-08, CH-feature-semantic-fixes-v7, F-117): the presence the *_distance
  # slots below in `unmapped` lack (I-7). Each flag is decided by the finder its distance measures to.
  order_block_present:
    slot: 48
    concept_id: MKT-Z03
    encoding: presence_flag {0,1} (1 while an ACTIVE order block exists in the trailing smc_max_window)
    parameterization: {k: "feature_pipeline.swing_window"}
    absence: "n/a — this slot IS the presence for order_block_distance"
  fvg_present:
    slot: 49
    concept_id: MKT-Z02
    encoding: presence_flag {0,1} (1 while an unfilled FVG exists in the trailing smc_max_window)
    parameterization: {}
    absence: "n/a — this slot IS the presence for fvg_distance"
  breaker_present:
    slot: 50
    concept_id: MKT-Z04
    encoding: presence_flag {0,1} (1 while an un-retested breaker exists in the trailing smc_max_window)
    parameterization: {k: "feature_pipeline.swing_window"}
    absence: "n/a — this slot IS the presence for breaker_distance"
  mitigation_block_present:
    slot: 51
    concept_id: MKT-Z05
    encoding: presence_flag {0,1} (1 while a live mitigation block exists in the trailing smc_max_window)
    parameterization: {k: "feature_pipeline.swing_window"}
    absence: "n/a — this slot IS the presence for mitigation_block_distance"
  eqh_present:
    slot: 52
    concept_id: MKT-L01
    encoding: presence_flag {0,1} (1 while an UPPER equal-highs cluster exists)
    parameterization: {founding: equal_cluster, k: "feature_pipeline.swing_window", tolerance_atr: 0.1}
    absence: "n/a — this slot IS the presence for eqh_distance"
  eql_present:
    slot: 53
    concept_id: MKT-L01
    encoding: presence_flag {0,1} (1 while a LOWER equal-lows cluster exists)
    parameterization: {founding: equal_cluster, k: "feature_pipeline.swing_window", tolerance_atr: 0.1}
    absence: "n/a — this slot IS the presence for eql_distance"

  # schema v8.0 (CH-candle-pattern-observations-v8, F-118): candle anatomy + candle patterns, slots 54-70
  upper_wick_ratio:
    slot: 54
    concept_id: GP-08
    encoding: share_of_range float [0,1]
    parameterization: {part: UPPER_WICK}
    absence: "0 on a zero-range bar"
  lower_wick_ratio:
    slot: 55
    concept_id: GP-08
    encoding: share_of_range float [0,1]
    parameterization: {part: LOWER_WICK}
    absence: "0 on a zero-range bar"
  pin_lower:
    slot: 56
    concept_id: GP-09
    encoding: presence_flag {0,1} (lower-wick pin bar)
    parameterization: {pattern: pin, side: LOWER, size_gate_atr_k: "feature_pipeline.candle_patterns.size_gate_atr_k"}
    absence: "0 when the size gate fails"
  pin_upper:
    slot: 57
    concept_id: GP-09
    encoding: presence_flag {0,1} (upper-wick pin bar)
    parameterization: {pattern: pin, side: UPPER, size_gate_atr_k: "feature_pipeline.candle_patterns.size_gate_atr_k"}
    absence: "0 when the size gate fails"
  hammer:
    slot: 58
    concept_id: GP-09
    encoding: presence_flag {0,1} (hammer = lower probe)
    parameterization: {pattern: probe, side: LOWER, size_gate_atr_k: "feature_pipeline.candle_patterns.size_gate_atr_k", swing_lookback: "feature_pipeline.candle_patterns.swing_lookback"}
    absence: "0 before swing_lookback prior bars"
  shooting_star:
    slot: 59
    concept_id: GP-09
    encoding: presence_flag {0,1} (shooting star = upper probe)
    parameterization: {pattern: probe, side: UPPER, size_gate_atr_k: "feature_pipeline.candle_patterns.size_gate_atr_k", swing_lookback: "feature_pipeline.candle_patterns.swing_lookback"}
    absence: "0 before swing_lookback prior bars"
  doji_material:
    slot: 60
    concept_id: GP-09
    encoding: presence_flag {0,1} (balanced doji on a material bar)
    parameterization: {pattern: doji_material, side: NONE, size_gate_atr_k: "feature_pipeline.candle_patterns.size_gate_atr_k"}
    absence: "0 when the size gate fails"
  dragonfly_doji:
    slot: 61
    concept_id: GP-09
    encoding: presence_flag {0,1} (dragonfly doji)
    parameterization: {pattern: doji_dragonfly, side: LOWER, size_gate_atr_k: "feature_pipeline.candle_patterns.size_gate_atr_k"}
    absence: "0 when the size gate fails"
  gravestone_doji:
    slot: 62
    concept_id: GP-09
    encoding: presence_flag {0,1} (gravestone doji)
    parameterization: {pattern: doji_gravestone, side: UPPER, size_gate_atr_k: "feature_pipeline.candle_patterns.size_gate_atr_k"}
    absence: "0 when the size gate fails"
  engulfing_bull:
    slot: 63
    concept_id: GP-09
    encoding: presence_flag {0,1} (bullish engulfing)
    parameterization: {pattern: engulfing, side: LOWER}
    absence: "0 on the first bar or after a gap"
  engulfing_bear:
    slot: 64
    concept_id: GP-09
    encoding: presence_flag {0,1} (bearish engulfing)
    parameterization: {pattern: engulfing, side: UPPER}
    absence: "0 on the first bar or after a gap"
  inside_bar:
    slot: 65
    concept_id: GP-09
    encoding: presence_flag {0,1} (inside bar)
    parameterization: {pattern: inside_bar, side: NONE}
    absence: "0 on the first bar or after a gap"
  compression_ratio:
    slot: 66
    concept_id: GP-11
    encoding: ratio float [0,10]
    parameterization: {quantity: range}
    absence: "1.0 on the first bar, after a gap, or after a zero-range bar"
  rejection_intensity_signed:
    slot: 67
    concept_id: GP-10
    encoding: signed share float [-1,1]
    parameterization: {form: signed, size_gate_atr_k: "feature_pipeline.candle_patterns.size_gate_atr_k"}
    absence: "0 when the size gate fails"
  rejection_intensity_lower:
    slot: 68
    concept_id: GP-10
    encoding: share float [0,1]
    parameterization: {form: lower_excess, size_gate_atr_k: "feature_pipeline.candle_patterns.size_gate_atr_k"}
    absence: "0 when the size gate fails"
  engulfing_strength:
    slot: 69
    concept_id: GP-11
    encoding: ratio float [0,3]
    parameterization: {quantity: engulfing_body}
    absence: "0 when the bar is not engulfing"
  rejection_intensity_upper:
    slot: 70
    concept_id: GP-10
    encoding: share float [0,1]
    parameterization: {form: upper_excess, size_gate_atr_k: "feature_pipeline.candle_patterns.size_gate_atr_k"}
    absence: "0 when the size gate fails"

# L0 raw observations — not concepts of the meaning plane (CANONICAL_LAYER_IDENTITY_CONTRACT L0).
raw_observations: [open, high, low, close, volume]

# Shrink-only against tests/governance/test_representation_registry.py. A schema append with no
# slice-1 concept is added here and to that pin together. A key leaves this list only by gaining
# a representation above.
unmapped:
  volume_ratio: "participation measurement — no slice-1 concept"
  ema_fast: "indicator measurement — no slice-1 concept"
  ema_slow: "indicator measurement — no slice-1 concept"
  ema_spread: "measurement; FM-022 dimensional mix (F-061)"
  trend_strength_z: "measurement"
  momentum_score: "measurement; FM-023 dimensional mix (F-061)"
  atr: "measurement (close-relative, FM-041)"
  volatility_ratio: "measurement"
  rsi_14: "measurement"
  macd_line: "measurement"
  macd_signal: "measurement"
  macd_hist_raw: "measurement"
  macd_hist_z: "measurement"
  body_size: "bar anatomy measurement"
  candle_range: "bar anatomy measurement"
  body_ratio: "bar anatomy measurement"
  volatility_regime: "categorical measurement"
  hour_of_day: "clock measurement"
  disp_strength: "impulse measurement (MKT-E05 family)"
  retest_depth: "measurement; retest semantics PROPOSED (OQ7); identity-bearing on sweep_semantics: latest_unconsumed = FM-021 (gate FM-061), e01_lifecycle = FM-095 (gate FM-094)"
  candles_since_sweep: "count since MKT-E01{swing_pivot} — measurement concept not in slice 1"
  liquidity_distance: "distance to MKT-L01 — measurement concept not in slice 1"
  liquidity_pressure_score: "transform of liquidity_distance"
  volume_spike: "participation measurement (F-065)"
  order_block_distance: "distance to MKT-Z03; presence missing (I-7)"
  fvg_distance: "distance to MKT-Z02; presence missing (I-7)"
  breaker_distance: "distance to MKT-Z04; presence missing (I-7)"
  mitigation_block_distance: "distance to MKT-Z05; presence missing (I-7)"
  pdh_distance: "distance to MKT-L01{prior_day,UPPER}; presence missing (I-7)"
  pdl_distance: "distance to MKT-L01{prior_day,LOWER}; presence missing (I-7)"
  eqh_distance: "distance to MKT-L01{equal_cluster,UPPER}; presence missing (I-7)"
  eql_distance: "distance to MKT-L01{equal_cluster,LOWER}; presence missing (I-7)"
  morning_star: "card candle-geometry flag (FM-120); no slice-1 concept yet"
  higher_low: "swing-sequence state (FM-121); distinct from the higher_high pierce"
  lower_high: "swing-sequence state (FM-122); distinct from the lower_low pierce"
  sideways: "swing-sequence state (FM-123); 0 until both sides are known"
  rejection_bull_present: "live bullish rejection block (FM-124); no slice-1 concept"
  rejection_bear_present: "live bearish rejection block (FM-125); no slice-1 concept"
  rejection_bull_distance: "distance to the live bullish rejection block (FM-126); 0 when absent"
  rejection_bear_distance: "distance to the live bearish rejection block (FM-127); 0 when absent"

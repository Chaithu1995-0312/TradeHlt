    units:               price_scaled
    normalization_basis: atr_relative
    temporal_semantics:  same_bar_delta          # close_delta = close.diff() (one-bar change)
    known_issue: >
      Same dimensional mix as FM-022 (B1/F2, fresh-reproduced 2026-07-12): close_delta (absolute price)
      / dimensionless atr -> SCALES with price level (probe: 100x ratio). Corrected = FM-031.
      DECISION-SURFACE COST MEASURED 2026-07-22 (F-061) — see FM-022's known_issue; momentum_score is
      the sharper case: `tanh(momentum_score)` in heuristic_gaussian_engine.py saturates on 98.8% (BNB)
      / 99.9% (BTC) of bars, and gate_intelligence.py's REVERSAL score `1 - min(1, |mom|)` collapses
      to a constant 0.0 on crypto.
    replacement_identity: FM-031
    migration_class:      FORMULA_CORRECTION_CONFIG_GATED   # was FORMULA_CORRECTION_DEFERRED until 2026-07-22
    config_key:           feature_pipeline.normalization_basis   # "atr_relative" selects THIS identity (default)
    artifact_compatibility: LEGACY_BOUND
    taxonomy:
      category:        Momentum
      knowledge_class: Derived
    semantics:
      description:   "One-bar price change divided by close-relative ATR."
      why_it_exists: "Rate of change normalized for volatility — intended to answer whether the last bar's move was fast relative to prevailing conditions."
      interpretation:
        high: "Sharp upward thrust relative to recent volatility."
        low:  "Sharp downward thrust; near zero means the bar closed where it opened relative to volatility."
        caveat: "READ THIS BEFORE USING THE VALUE: same price-level scaling defect as FM-022, and sharper in consequence — tanh(momentum_score) saturates on 98.8-99.9% of crypto bars (F-061), so downstream consumers see a near-constant."
    states: []
    lineage:
      derivation_depth: 2
      produced_by:      feature_pipeline.compute_canonical_ema_features
      consumed_by:      [UNKNOWN]
      vector_key:       momentum_score
      vector_index:     12

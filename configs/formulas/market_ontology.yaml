        - "UNTESTED: the bridge will name bulk candles in the 20 empty months, which would falsify top-N-over-corpus as the comparison scope and argue for a local/rolling one - a NEW freeze, not a retune of N."
        - "UNTESTED: the two rankings' 16 disagreements are exactly where the concept is genuinely ambiguous, in which case the disagreement set is more informative than either list."
      resolution_metric: "Cohen-style agreement between this proxy's shortlist and the bridge's yes/no labels on the SAME candles, plus the count of bridge-named bulk candles that the shortlist MISSED (recall, which a top-N list cannot measure about itself). Agreement, not profitability."

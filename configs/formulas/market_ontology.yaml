# extra). §6.6 constraint 1 is respected: this is a NON-frozen sibling section; the frozen
# runtime sections (primitives / feature_compositions / derived_metrics) are untouched.
#
# NOT feature-vector slots. Unlike `structural_states` (FM-054+), these emit no vector_key,
# no vector_index, and are not produced by feature_pipeline. They are decision arithmetic.
#
# AUTHORITY: declaration only. Registering a predicate grants NO production or G001
# authority (§6.5) — these describe what the code already does today.

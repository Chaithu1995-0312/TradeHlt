      value is 0.0 on every bar where retest_flag != 1 — which is MOST bars (measured zero_rate
      42.31% on the XAUUSD freeze corpus). Until now that gate lived only in this note while the
      `formula` described the ungated math, so the declaration disagreed with the emitted column on
      the majority of rows. `retest_flag` (FM-061) is now a declared dependency. The scalar
      derived_math.retest_depth is UNCHANGED and remains correct for the gated branch — the pipeline
      applies the gate via np.where at feature_pipeline.py:969.
    taxonomy:
      category:        Retest
      knowledge_class: Derived
    semantics:
      description:   "How far price sits from the fast EMA, in ATR-scaled units, on bars where a retest is active; 0.0 otherwise."
      why_it_exists: "After a liquidity sweep, the question is whether price returned to a fair-value reference. This measures the depth of that return in volatility-normalized terms."
      interpretation:
        high: "Price is far from the reference — a shallow or failed retest."
        low:  "Price has returned tightly to the reference — a deep retest. NOTE 0.0 is ambiguous: it means EITHER a perfect retest OR no retest at all; disambiguate with retest_flag."

    mathematical_definition: "Bars are M15 OHLC with strictly increasing timestamps. Closed calendar parents for each of MN1, W1, D1, H4 are aggregated with features.calendar_periods.period_key; the in-progress bucket is dropped. 6M and 3M are UNMEASURABLE and excluded. Bias(parent)=long if close>open, short if close<open, none otherwise. Veto1: last closed MN1 and W1 share the same non-none bias. Veto2: last closed D1 shares that bias. Veto3: classify_htf_state on (prev,curr) closed W1 and D1; reject if both are EXPANSION. Sweep: SP-001 against a prior closed parent high/low with formed_at_index < bar.index; deepest pierce wins; HIGH sweep => short, LOW sweep => long. Displacement: first later bar within max_sweep_age_bars satisfying SP-002 directional_impulse away from the swept side. Return: first later bar within max_return_age_bars whose range overlaps the displacement bar; entry=that close. Stop: long min(sweep_price, disp.low), short max(sweep_price, disp.high). Target: last closed D1 high (long) or low (short). Location: |entry-level| <= location_tolerance_atr * atr[entry] for some level in {high,low,mid} of last closed MN1/W1/D1/H4 formed before entry. SEM-025: |target-entry|/|entry-stop| >= rr_floor. Admission is the conjunction of all vetoes. SEM-023 score is diagnostic only. H4 may oppose the last H4 impulse (Grade B pullback) and does not join Veto1."

    aliases:                [F-066, broker_local_vs_utc, session_timestamp_basis]
    semantic_category:      ExecutionBehaviour
    knowledge_status:       MATHEMATICALLY_DEFINED
    description:            "session/hour_of_day (FM-052) on MT5-sourced corpora are derived from broker-server time labeled UTC, not true UTC as session_windows_utc's name and session_classifier.py's docstring claim. 53.36% of XAUUSD bars carry the wrong session label under the legacy derivation."
    observed_behaviour:     "src/inout/mt5_candle_fetcher.py:186 calls datetime.fromtimestamp(r['time'], tz=timezone.utc) on MT5 copy_rates' 'time' field, a documented broker-server epoch. Two independent tests confirm: (A) cross-correlating XAUUSD's 15-min realized-range profile against Binance BTCUSDT (true-UTC klines) finds best alignment shift exactly -3h00m Apr-Sep (r=0.675) / -2h00m Nov-Feb (r=0.709) -- on-the-hour, differing by exactly the DST step; (B) NFP release (08:30 America/New_York) lands at the same server time (15:30) in both seasons -- season-invariance an EET/EEST server predicts, true-UTC stamps would alternate 12:30/13:30. The server tracks US (America/New_York) DST transitions, not EU: the daily 01:00->23:45 boundary holds through the 2025-03-10..27 / 2025-10-27..31 / 2024-10-28..11-01 US/EU DST-mismatch weeks."
    mathematical_definition: "ts_utc = ts_broker - offset(date), offset(d) = 3h if America/New_York observes DST at local noon on d else 2h. Implemented in src/features/broker_clock.py::mt5_server_to_utc."
    units:                  hours_offset
    formula:                "offset(d) in {2,3}, selected by America/New_York DST status at noon on calendar date d (never the 2AM transition-ambiguous instant)"
    dependencies:           []
    required_inputs:        [timestamp]
    produced_outputs:       [hour_of_day, session]
    producers:              ["src/features/broker_clock.py::mt5_server_to_utc", "src/features/feature_pipeline.py::compute_context (session_timestamp_basis selector)"]
    consumers:              ["src/features/session_classifier.py (FM-052 session/hour_of_day)", "FM-052 downstream: engine_runner.allowed_sessions, crt_engine.session_windows (FILTER surface -- deliberately NOT re-based, see notes)"]
    transitions:            []
    validation_rules:       ["raw `timestamp` column must never be mutated by either session_timestamp_basis arm -- OHLCV identity/hashing must stay byte-identical", "utc_corrected must only be applied to MT5-sourced frames; it has no provenance detection and would corrupt an already-true-UTC corpus (e.g. Binance) if misapplied -- tests/test_session_timestamp_basis.py pins this as a regression, not just a comment"]
    confidence:             Certain
    evidence:               ["src/inout/mt5_candle_fetcher.py:186", "data/mt5/XAUUSD_M15.csv 516-day boundary census (2026-08-01 session)", "cross-correlation vs data/binance/BTCUSDT_M15.csv", "NFP first-Friday release-bar alignment census", "tests/test_session_timestamp_basis.py"]
    origin:                 "Blind-label descriptive-fidelity investigation (2026-08-01), preparing a chart-comparison prompt"

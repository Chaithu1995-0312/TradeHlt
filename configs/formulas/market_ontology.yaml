      interpretation:
        high: "A pivot high has been confirmed as of this bar."
        low:  "No pivot confirmation on this bar."
        caveat: "PIT SEMANTICS: the pivot occurred k bars ago; this flag is its CONFIRMATION, delayed so no future information is used. The value is knowable at t, the event was at t-k."

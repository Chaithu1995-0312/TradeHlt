  context_feature_attribution_overlay:
    id:                     SEM-036
    canonical_name:         CONTEXT_FEATURE_ATTRIBUTION_OVERLAY
    aliases:                ["the beyond-CRT overlay", "delta_within_stratum"]
    semantic_category:      ValidationRule
    knowledge_status:       OBSERVED
    description:            "The measurement that asks whether any SEM-035 context family carries expectancy information ORTHOGONAL to CRT state. Per family and direction, a mean-preserving size overlay (weight 1 plus or minus k, k = 0.5 frozen) is applied to stratum-CENTERED y inside each crt_state_after stratum and aggregated size-weighted. Sealed as MC-CTXATTR-XAUUSD-M15-V1."
    observed_behaviour:     "UNRUN at registration. The population is inverted rather than detector-driven: the CRT executed-trade ledger holds 3 trades in 47,275 XAUUSD M15 bars, so eleven families against it is not a study. Instead every bar and both directions are labelled at source by multi_tp_walk (SEM-017) under the production two-target geometry, and the CRT state becomes the STRATUM rather than the filter."
    mathematical_definition: "delta_within_stratum = sum over strata of n_s times the centered overlay delta, divided by total n, restricted to strata where the context varies; the stratum mean is subtracted from y first; weight is 1+k on agree and 1-k on disagree with k = 0.5. delta_marginal is the same overlay ignoring strata, and crt_proxy_component is delta_marginal minus delta_within_stratum."
    units:                  "R per unit"
    formula:                UNKNOWN
    dependencies:           [SEM-035, SEM-017, SEM-015, SEM-016, SEM-018]
    required_inputs:        ["SEM-035 snapshot stream", "SEM-018 oracle labels (PRIMARY arm disp_bar and production)", "the frozen MC-ASYM holdout calendar"]
    produced_outputs:       ["docs/research-readiness/context_attribution/mc_ctxattr_xauusd_m15_v1 artifacts"]
    producers:              ["src/research/evidence/context_attribution.py"]
    consumers:              [UNKNOWN]
    transitions:            []
    validation_rules:
        - "PRIMARY is delta_within_stratum on stratum-CENTERED y; delta_marginal is diagnostic only and contains the CRT-proxy term by construction"
        - "strata where the context does not vary (all-agree or all-disagree) contribute nothing: that is a rescale, not a contrast"
        - "a None predicate verdict means NO READING and is excluded from BOTH cells; it is never counted as disagreement"
        - "E greater than 0 is not a gate clause: the base rate on this population is about -0.29R, so beating the base means losing less"
        - "long_only is the binding control, not zero (F-086 saw positive cell counts collapse 65 to 8, 56 to 1, 2 to 0 against passive exposure)"
        - "22 tests are pre-registered; BH-FDR at q=0.10 against a BLOCK permutation null (block 40, 199 permutations), plus train and holdout sign match, plus a pass-count ceiling of 6"
        - "measures the EVERY-BAR population, never production executed trades"
        - "a pass grants Authority-Ladder rung 1 only: no G001, no sizing, no entry into context_attribution.promoted_families"
    confidence:             Possible
    evidence:               ["configs/research/measurement_contracts/instances/MC-CTXATTR-XAUUSD-M15-V1.json", "tests/research/test_context_attribution_contract.py"]
    origin:                 "CH-v3-unified-market-structure-v1 (2026-08-29), user-authorized. Contract sealed and floor-green BEFORE the driver existed (the F-083 lesson)."
    status:                 RESEARCH
    version:                1
    owner:                  claude
    epistemic:
      known_invariants:
        - "The CRT executed-trade ledger is n=3 on this corpus, so per-family attribution against it is structurally impossible, not merely underpowered."
        - "F-086 established that this every-bar population does not mark a profitable entry: 0 of 84 state cells cleared zero."
        - "F-086 MEASURED the label autocorrelation (+0.292 at lag 1, +0.003 by lag 20), giving an effective independent sample near 941 per direction rather than 47,157."
        - "Within a stratum, centering y makes the overlay delta zero exactly when the agree-cell mean equals the stratum mean. This is arithmetic, not an empirical result."
      unknown_mechanism: "Whether ANY declared context family carries expectancy information that survives conditioning on CRT state. Never measured: the vocabulary has never been observed jointly on the same bar until SEM-035 existed."
      candidate_hypotheses:
        - "UNTESTED: no family clears, consistent with F-019 through F-096 and with the entry-information null being the binding constraint."
        - "UNTESTED: the zone families (order block, FVG, breaker, mitigation) carry polarity information the tanh distance scalar discards, and the geometry recovers it."
        - "UNTESTED: any apparent lift is the CRT-proxy component, and delta_marginal minus delta_within_stratum accounts for essentially all of it."
      resolution_metric: "The MC-CTXATTR-XAUUSD-M15-V1 success gate: holdout cells n at least 30 on both sides, train and holdout sign match, BH-FDR survival at q=0.10 against the block-permutation null, and magnitude exceeding both the long_only and shuffled-context controls."
      falsification_conditions:
        - "A family claimed to carry orthogonal information is falsified if its delta_within_stratum sign flips between train and holdout, or if the shuffled-context control reaches the same magnitude."

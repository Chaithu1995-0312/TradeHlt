    description:            "The reasoning question of how statistically or structurally typical the current market state is relative to previously observed or reference states. Bottom-up extracted from docs/architecture/model-design-intent.md Part VII (Authority: NONE, narrative), which observes that four existing models independently frame their output as a form of 'distance from what I know'. Registering this as OBSERVED records the cross-model pattern as worth tracking — it does NOT assert the four are the same capability; see epistemic.unknown_mechanism."
    observed_behaviour:     "Four production models compute a distance-from-known-state quantity under four different mechanisms: a 3-feature global parametric kernel (Gaussian heuristic), a trained density model over the full vector (Gaussian ML, offline/shadow only), a full-vector local geometric similarity kernel used as a hard gate (Zone Gate), and an internal soft-confirmation distance-decay embedded in the CRT state machine (not a standalone output). No shared formula, scale, or declared target exists across the four today."
    mathematical_definition: UNKNOWN
    units:                  UNKNOWN
    formula:                UNKNOWN
    dependencies:           [feature_pipeline]
    required_inputs:        ["ema_fast, ema_slow, momentum_score (Gaussian heuristic subset)", "full 39-dim canonical vector (Zone Gate hard gate; Gaussian ML; CRT internal)"]
    produced_outputs:       ["ordinal familiarity/conformity SCORE (Gaussian heuristic/ML) — never a probability, per MIAR locked vocabulary", "binary pass/fail + score (Zone Gate hard gate)", "soft-confirmation contribution embedded in CRT's internal state (not a standalone exposed output)"]
    producers:              ["HeuristicGaussianEngine.compute (src/engines/heuristic_gaussian_engine.py) — global parametric, 3-feature kernel", "MLGaussianEngine.compute (src/engines/ml_gaussian_engine.py) — trained NB density, full vector, offline/shadow only", "Zone Gate similarity kernel (src/engines/zone_gate_engine.py, run_zone_gate_engine) — local geometric, full 39-dim, hard gate", "CRT internal distance-decay soft-confirmation (src/config_layer/crt_engine_v2.py) — embedded, not a standalone MIAR-registered output"]
    consumers:              ["FusionEngine.compute via the 'gaussian' and 'zone_gate' engine_results slots (src/core/fusion_engine.py)", "crt_engine_v2's own internal approve/soft-confirmation gate (self-consumed, not exposed to fusion)"]
    transitions:            []
    validation_rules:       []      # epistemic content lives in the `epistemic` block below

  volatility_regime:
    id:        FM-050
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "tercile(atr_14.rolling(<feature_pipeline.volatility_percentile_window>, min_periods=1).rank(pct=True)); atr_14 = SMA(14) of true_range (ABSOLUTE); cuts at <feature_pipeline.volatility_tercile_low>/<feature_pipeline.volatility_tercile_high> -> int8 {0,1,2}  # defaults 200, 0.33/0.66"
    config_keys: [feature_pipeline.volatility_percentile_window, feature_pipeline.volatility_tercile_low, feature_pipeline.volatility_tercile_high]
    impl:      feature_pipeline.compute_volatility_regime
    depends_on: [atr_absolute]
    lookback:  200
    # `lookback` mirrors the percentile window (the tercile cuts are thresholds, not lookbacks).
    lookback_config_key: feature_pipeline.volatility_percentile_window
    bounds:    "{0, 1, 2}"
    active:    true
    note: >
      DEPENDENCY IS ABSOLUTE atr_14, NOT the close-relative FM-041 `atr`. compute_volatility_regime
      ranks df["atr_14"] (== atr_14_raw == SMA(14) of true_range, absolute price units); FM-041 `atr`
      is atr_14_raw / close (close-relative, canonical index 13). Different quantities -- hence
      depends_on FM-074 atr_absolute (the registered absolute form), NOT `atr`.
      Corrected 2026-07-19 after an initial entry wrongly declared depends_on [atr]; matches the
      M14B analysis recorded at scripts/analysis/feature_dag_layers.py:123-124.
      RE-POINTED 2026-08-09 (F-072): depends_on previously pointed at true_range (FM-040), the
      absolute form's ancestor, because no first-class id existed for the absolute form itself.
      FM-074 `atr_absolute` now registers that quantity directly; depends_on points at it instead.
      Production bind is ROLLING_CAUSAL (FC1-D, FC-0.5 adjudication). The sibling
      volatility_regime_global_batch (full-frame rank, non-PIT) and _expanding_causal identities
      are research/legacy only and are deliberately NOT registered. CORRECTED 2026-07-19: the
      window and tercile cuts are NO LONGER hardcoded -- they were migrated to config in the
      Phase-A Tier-2 pass (see config_keys above). They are TUNABLE STRUCTURAL: changing any of
      them redefines THIS identity and invalidates artifacts trained against it, so a sweep is a
      semantic change requiring re-certification, not a free knob.
    taxonomy:
      category:        Volatility
      knowledge_class: Statistical
    semantics:
      description:   "Tercile bucket of the current absolute ATR against its own trailing rolling percentile."
      why_it_exists: "Converts continuous volatility into a coarse regime label so downstream logic can condition on 'quiet / normal / volatile' without picking instrument-specific cutoffs."
      interpretation:
        high: "Bucket 2 — currently among the most volatile third of the trailing window."
        low:  "Bucket 0 — among the quietest third."
        caveat: "Local and RELATIVE, not a latent regime state: it ranks ATR against the trailing window only. Depends on ABSOLUTE atr_14, not the close-relative FM-041 `atr`."
    states:
      - name:        LowVolatility
        value:       0
        condition:   "trailing ATR percentile < volatility_tercile_low"
        description: "Compression — quietest third of the trailing window."
      - name:        NormalVolatility
        value:       1
        condition:   "volatility_tercile_low <= percentile < volatility_tercile_high"
        description: "Middle third — typical conditions for this instrument recently."
      - name:        HighVolatility
        value:       2
        condition:   "percentile >= volatility_tercile_high"
        description: "Expansion — most volatile third of the trailing window."
    lineage:
      derivation_depth: 2
      produced_by:      feature_pipeline.compute_volatility_regime
      consumed_by:      [UNKNOWN]
      vector_key:       volatility_regime
      vector_index:     30

  broker_execution_cost_decomposition:
    id: SEM-015
    canonical_name: BROKER_EXECUTION_COST_DECOMPOSITION
    aliases:
      - c_per_side
      - round_trip_cost
    semantic_category: ExecutionBehaviour
    knowledge_status: CHARACTERIZED
    description: "The cost of transacting one unit, decomposed into its four broker-owned components (half-spread, commission, order-type-conditional slippage, overnight swap) rather than collapsed into a single flat basis-point haircut. Cost is a property of the BROKER and the ORDER TYPE, not of market volatility."
    observed_behaviour: "The research harness charges a flat 12 bps round-trip to every trade of every instrument (src/research/costs.py DEFAULT_ROUND_TRIP_BPS). On XAUUSD at ~$3,300/oz that bills $3.96/oz round-trip. The repo's own MEASURED broker calibration (live MT5 terminal, ICMarketsSC-Demo, 2026-08-06) reports c_per_side = $0.175/oz, i.e. $0.35/oz round-trip -- the flat constant over-charges XAUUSD by ~11.3x on a stop exit and ~15.2x on a take-profit exit (the two differ because only the stop leg pays stop slippage). At the configured sl_atr_mult=1.0 and XAUUSD median ATR $7.342 the flat model charges 0.5394R against a measured 0.0477R (stop exit) / 0.0354R (TP exit) -- i.e. ~0.49R of phantom cost per trade, which reproduces F-081's separately-reported 0.56R Arm-A cost to within the difference between its sl_atr_mult and this reference case."
    mathematical_definition: "c_per_side = half_spread + abs(commission) + slippage(order_type); round_trip = 2 * c_per_side, plus swap_per_night * nights_held for positions carried overnight. Stop-order slippage is charged ONLY on stop-order exits; a take-profit limit order does not slip in the holder's favour. Conversion to R units preserves the existing ratio semantics: cost_r = cost_price / risk_distance."
    units: "price units per unit traded per side (USD/oz for XAUUSD)"
    formula: "entry_leg = half_spread + abs(commission) + entry_slippage ; exit_leg = half_spread + abs(commission) + (stop_slippage if stop exit else 0) ; round_trip = entry_leg + exit_leg + (abs(swap) * nights_held if swap is a debit)"
    dependencies: []
    required_inputs:
      - half_spread
      - commission
      - entry_slippage
      - stop_slippage
      - swap_long_per_night
      - swap_short_per_night
    produced_outputs:
      - cost_r
      - net_rr
    producers:
      - src/research/mt5_cost_calibration.py
      - src/research/costs.py
    consumers:
      - src/research/costs.py
      - src/research/measurement/metrics.py
      - src/research/provenance.py
    transitions: []
    validation_rules:
      - "Every component carries an explicit status (MEASURED / INSUFFICIENT_DATA / UNKNOWN); an unmeasured component must never silently default to 0.0."
      - "Only an instrument with a MEASURED calibration may use the component model; crypto_majors and fx_majors remain PENDING_CALIBRATION and must not be given invented values."
      - "Selecting the component model is opt-in; the flat-bps default must remain byte-identical so no registered finding moves without an authorised re-measurement."
    confidence: Likely
    evidence:
      - "results/research/xauusd_mt5_cost_calibration/xauusd_mt5_cost_calibration_manifest_20260806T134255Z.json (sha256 6ce4abf5cd76e37e24102b317588a5ebc188a320b84983c0a176ff52b1bb8e62): statuses all MEASURED; c_per_side_usd 0.175; half_spread_usd 0.045; commission_per_oz_usd 0.040; stop_slippage_usd 0.090."
      - "ZONE-X-COST-NOTE.md sections 2-4: spread median $0.0900, stop-slip median $0.0900 (n=7) with p90 $0.3200, swap long/short -0.5601/+0.3834 USD/oz/night; measured c = 0.0238 ATR/side vs the 0.0700 ATR/side that had been assumed (~2.9x lower on the ATR basis)."
      - "configs/research/measurement_contracts/crypto_majors.v1.json, fx_majors.v1.json and metals_mt5.v1.json: all three declare cost_model_id 'derived_per_instrument.v1' with calibration.status PENDING_CALIBRATION, k null, values null -- the intent was frozen 2026-08-06 and left unimplemented."
      - "F-025 / F-035 / F-081 (docs/current-findings.md): the recorded pattern of cost-dominated magnitude claims that this node explains."
    origin: "Registered 2026-08-19 (CH-cost-model-broker-truth) after the attached feature/state inventory prompted an execution-realism review of the measurement spine. The measurement predates the node by ~2 weeks; the node is the missing semantic identity, not a new observation."
    status: active
    version: 1
    owner: research-measurement
    traceability:
      manifest: docs/governance/build_manifests/CH-cost-model-broker-truth.impact.json
      profile: configs/research/measurement_contracts/metals_mt5.v1.json
    notes: "LEG ASYMMETRY (established during implementation 2026-08-19): the source calibration reports a single c_per_side that bundles stop slippage, and doubling it assumes stops on BOTH legs -- correct for ZONE-X, which commissioned the measurement, but NOT for this architecture, where a trade enters on a market order at the bar close and exits on a stop (SL) or a limit (TP). Costs are therefore applied per-leg, not as 2*c_per_side. ENTRY-SLIPPAGE BASIS: MARKET-order slippage is INSUFFICIENT_DATA in the reference run (n=0 fills), so entry slippage falls back to the measured STOP slippage as a declared CONSERVATIVE PROXY (a stop triggers into momentum and so slips at least as much as a market order); this is recorded as entry_slippage_basis=PROXY_FROM_STOP in every emitted provenance block and is never defaulted to zero. SWAP is read from its sidecar file and stays None when absent; requesting overnight carry against an unmeasured swap raises rather than treating carry as free. A positive (credit) swap is deliberately NOT netted off a directional trade -- that is the carry-HARVEST payoff, falsified separately as F-034. CAVEAT (carried from the source calibration, not softened): stop-slippage rests on n=7 near-market demo STOP fills and likely UNDERSTATES true gap-driven barrier slip; p90 is $0.32 against a $0.09 median. Registering this node grants NO economic authority and NO promotion authority (CLAUDE.md section 6.5) -- it records what the broker charges, not that any strategy clears it. The sibling placeholder formula 'k * median(bar_range_pct)' in the three profiles derives cost from VOLATILITY; it is retained rather than deleted (section 6.2 rule 4) and its adjudication is tracked as UNK-COST-02 in the change manifest."
    epistemic:
      known_invariants:
        - "All five components were returned MEASURED by the calibration run; none is imputed."
        - "The 11.3x over-charge ratio is arithmetic, not an estimate: $3.96 round-trip flat vs $0.35 round-trip measured."
        - "Correcting the cost model cannot by itself create an edge -- F-081 Arm A was +0.0080R GROSS with a confidence interval crossing zero, so its REJECT stands independent of any cost assumption."
      unknown_mechanism: "Whether the measured demo-account cost transfers to a live funded account at the same broker, and how far stop-slippage widens on genuinely gapping bars (weekend opens, scheduled releases) versus the near-market conditions under which the n=7 sample was seeded."
      candidate_hypotheses:
        - "Live-account spread and commission match the demo within noise; only slippage degrades."
        - "Gap-driven stop slip is materially worse than p90 $0.32 on release bars, making the honest fill model (SEM-016) the larger of the two corrections on those bars."
      resolution_metric: "Re-run scripts/research/xauusd_mt5_cost_calibration.py against a funded account with at least 100 STOP fills, stratified by whether the fill bar gapped, and compare the resulting slippage distribution to the n=7 baseline."
      falsification_conditions:
        - "A larger STOP-fill sample shows median slippage at or above ~$1.80/oz, which would make the flat 12bps defensible for XAUUSD after all."
        - "Commission or spread on a funded account differs from the demo by more than 2x, invalidating the demo-sourced components."

  adverse_stop_fill_excursion:
    id: SEM-016
    canonical_name: ADVERSE_STOP_FILL_EXCURSION
    aliases:
      - stop_gap_fill
      - adverse_fill
    semantic_category: ExecutionBehaviour
    knowledge_status: CHARACTERIZED
    description: "A stop-loss is an order, not a price guarantee: it fills at the next available price once triggered. When a bar opens beyond the stop level, the realised exit is that open, not the stop level -- so a stop exit can lose materially more than the 1R it nominally risked."
    observed_behaviour: "src/research/measurement/forward_walk.py returns rr = (trail_stop - entry) / risk_distance on every SL_HIT, which is exactly -1.000R for a fixed stop, regardless of how far the triggering bar gapped through the level. The measurement spine therefore models a perfect stop fill on every losing trade. Because ~30 modules consume forward_walk, this optimism is inherited by every outcome-bearing research result in the repository."
    mathematical_definition: "fill = bar.open when the bar opens beyond the stop (long: bar.open <= sl; short: bar.open >= sl); otherwise fill = sl minus stop_slippage for a long and sl plus stop_slippage for a short. rr = (fill - entry) / risk_distance for a long, (entry - fill) / risk_distance for a short. The take-profit side is deliberately NOT symmetric: a resting limit order does not fill better than its level, so TP stays at the level."
    units: R (multiples of the entry-to-stop risk distance)
    formula: "rr_sl_long = (min(bar.open, sl) - entry) / risk_distance ; mirrored for short"
    dependencies:
      - SEM-015
    required_inputs:
      - bar.open
      - stop_level
      - stop_slippage
      - direction
    produced_outputs:
      - rr_achieved
    producers:
      - src/research/measurement/forward_walk.py
    consumers:
      - src/research/measurement/metrics.py
      - src/research/exit_grid.py
      - src/research/forensics.py
    transitions: []
    validation_rules:
      - "The default path (adverse_fill absent) must remain bit-identical to the pre-change forward_walk over the XAUUSD M15 corpus."
      - "Take-profit fills must never improve on the TP level; favourable slippage is not modelled."
      - "The no-lookahead guard and the SL-before-TP tie-break are invariant under this change."
    confidence: Certain
    evidence:
      - "src/research/measurement/forward_walk.py SL_HIT branch: rr computed from trail_stop, never from bar.open -- source-verified 2026-08-19."
      - "results/research/xauusd_mt5_cost_calibration/ slippage_by_order_type CSV: STOP-order slippage median $0.09, p90 $0.32 (n=7), i.e. non-zero even in near-market conditions."
      - "F-035 (docs/current-findings.md): XAUUSD was excluded from the FX cross-asset program specifically because holiday gaps tripped the FX gap gate -- independent evidence that gapping is material on this instrument."
    origin: "Registered 2026-08-19 (CH-cost-model-broker-truth) alongside SEM-015. Identified while auditing what the measurement spine assumes about execution, prompted by the feature/state inventory review."
    status: active
    version: 1
    owner: research-measurement
    traceability:
      manifest: docs/governance/build_manifests/CH-cost-model-broker-truth.impact.json
      implements: src/research/measurement/forward_walk.py
    notes: "This correction moves results in the OPPOSITE direction to SEM-015: SEM-015 removes phantom cost (results improve), SEM-016 charges honest gap loss (results worsen). They must not be described as a single 'costs were too high' correction. Opt-in and default-inert in this change; grants NO economic authority. forward_walk_oco is deliberately untouched in this pass."
    epistemic:
      known_invariants:
        - "A stop order cannot fill better than its trigger level; the -1.000R floor currently modelled is an upper bound on stop-exit outcomes, never a conservative one."
        - "Gap magnitude is directly observable in the existing OHLCV corpus and needs no broker calibration to apply."
      unknown_mechanism: "PARTIALLY RESOLVED 2026-08-19 by build verification (below). What remains unmeasured is the effect on the SPINE's real signal set: the probe below uses a synthetic fixed-geometry grid, not CRT-generated entries, so it characterises the INSTRUMENT, not any registered result."
      candidate_hypotheses:
        - "CONFIRMED 2026-08-19: gap-open stop exits are a small minority of SL_HITs on M15 (3 of 649, 0.5%), so the aggregate effect is second-order relative to SEM-015 -- the mean correction is dominated by ordinary slippage, not by gaps."
        - "UNTESTED: gap exits cluster on session boundaries and scheduled releases, so the effect is concentrated rather than diffuse. The 3 observed gaps are too few to characterise clustering."
      resolution_metric: "Count SL_HIT exits whose triggering bar opened beyond the stop, and report the mean and p90 of (fill - sl) in R. EXECUTED 2026-08-19 on a synthetic probe grid (full 47,275-bar XAUUSD M15 corpus, stride-97 sampling, 1.0/2.0 ATR fixed geometry, both directions, 970 signals -> 649 SL_HIT). A spine-signal-set version still requires a separately authorised measurement turn."
      falsification_conditions:
        - "REFUTED 2026-08-19: the condition was 'zero SL_HIT exits occur on a gap-open bar, which would make the gap branch inert on M15 data.' Measured 3 of 649 -- rare but non-zero, and severe when it fires (gap excess median $2.00, max $11.84 ~ 3.4 ATR; worst single fill -2.5345R vs the -1.000R the perfect-fill model would have recorded). The gap branch is NOT inert."
      build_verification_2026_08_19:
        note: "Instrument characterisation from the change that introduced this node. NOT an economic result and NOT a re-measurement of any finding: the signal grid is synthetic, so these numbers describe forward_walk's fill behaviour, not any strategy's profitability."
        perfect_fill_defect_confirmed: "649 of 649 SL_HIT outcomes return exactly -1.000000R under the default (adverse_fill=None) path -- the defect this node describes, measured rather than argued."
        mean_extra_loss_per_stop_R: -0.026086
        gap_through_rate: "3 / 649 = 0.5%"
        gap_excess_usd: "median 2.000, p90 11.836, max 11.836"
        worst_single_fill_R: -2.5345
        correction_note: "An initial in-session estimate of ~53% gap-through was an inference bug in a scratch probe (it compared realised R against a slippage floor rather than testing bar.open against the stop). Direct measurement gives 0.5%. Recorded here per CLAUDE.md 6.2 / E-001: fix the source, not just the chat."

  multi_target_partial_exit:
    id: SEM-017
    canonical_name: MULTI_TARGET_PARTIAL_EXIT
    aliases:
      - tp1_tp2_partial
      - partial_tp_breakeven
      - runner_exit
    semantic_category: ExecutionBehaviour
    knowledge_status: MATHEMATICALLY_DEFINED
    description: "The production CRT trade does not have one take-profit. It has two, and the first one only closes part of the position: at TP1 a configured fraction is realised, the stop is moved, and the remainder runs to TP2. The realised R of a trade is therefore a BLEND of two exit prices, not a single level, and the possible outcomes form a discrete ladder rather than the single pair a one-target model produces."
    observed_behaviour: "src/config_layer/crt_engine_v2.py ExecutionEngine.update_trade declares a TP2 > SL > TP1 branch order, but it is fed a single scalar trigger price by _intrabar_trigger_price, which itself checks the stop before any target -- so the EFFECTIVE same-bar precedence on the backtest path is SL-first. On TP1 from OPEN it books partial_pnl = partial_fraction * dir * (tp1 - entry) and then MUTATES trade.sl_price to entry + 0.5 * (tp1 - entry) -- a half-way trail, NOT breakeven, despite the config key being named partial_tp_breakeven_enabled. src/runtime/backtest_v2.py then blends the reported exit price at three sites with f = execution_planner.partial_tp_fraction: TP1_BE_STOP and TP1_BE_RESET use f*tp1 + (1-f)*sl_trail, TP1_TP2 uses f*tp1 + (1-f)*tp2. At tp1_mult 1.0 this yields +1.5R for TP1_TP2, +0.75R for TP1_BE_STOP, and -1.0R for a clean stop. src/research/measurement/forward_walk.py cannot express any of this: it models a single TP, no partial, and no trail, so outcome-bearing research results have been measured on a DIFFERENT exit object than the one production trades."
    mathematical_definition: "Given entry e, direction d in {+1,-1}, stop s, targets t1 t2, partial fraction f, and risk_dist = abs(e - s): while status is OPEN, a bar closes the trade at s (R = d*(s-e)/risk_dist) if the stop is touched, or transitions to status TP1 if t1 is touched. On that transition partial_pnl = f*d*(t1-e) and the stop becomes s2 = e + 0.5*(t1-e). While status is TP1, touching t2 gives R = (partial_pnl + (1-f)*d*(t2-e))/risk_dist and touching s2 gives R = partial_pnl/risk_dist. CORRECTED 2026-08-20 (E-001): same-bar precedence in the production BACKTEST path is SL-FIRST, not TP2 > SL > TP1. crt_engine_v2._intrabar_trigger_price collapses each bar to ONE scalar trigger price, checking sl_touch before any target, and update_trade then evaluates its TP2 > SL > TP1 branch order against that already-resolved scalar -- so the branch order almost never binds and the effective behaviour is conservative. The optimistic TP2 > SL > TP1 precedence over raw high/low exists only in src/analytics/sl_tp_comparator.py simulate_exit, an analytics sidecar that the backtest never calls. The two conventions differ only on bars that span both a target and the stop."
    units: R (multiples of the entry-to-stop risk distance)
    formula: "R_tp1_tp2 = f*tp1_mult + (1-f)*tp2_mult ; R_tp1_be_stop = f*tp1_mult + (1-f)*0.5*tp1_mult ; R_stop = -1"
    dependencies:
      - SEM-015
      - SEM-016
    required_inputs:
      - entry
      - stop_level
      - tp1_level
      - tp2_level
      - partial_tp_fraction
      - direction
    produced_outputs:
      - rr_achieved
      - exit_reason
    producers:
      - src/config_layer/crt_engine_v2.py
      - src/runtime/backtest_v2.py
    consumers:
      - src/research/oracle/multi_tp_walk.py
    transitions:
      - "OPEN -> TP1 (partial realised, stop trails to half-way)"
      - "OPEN -> STOPPED (clean stop, R = -1)"
      - "TP1 -> TP2 (runner reaches full target)"
      - "TP1 -> STOPPED (runner stopped at the trail, R = partial only)"
    validation_rules:
      - "With partial_fraction 0, tp1 equal to tp2 and no trail, the kernel must reduce to a single-TP fixed walk. Divergence from forward_walk intrabar_fixed under that degenerate configuration is a defect in one of the two implementations and must be resolved, not averaged."
      - "The half-way trail must be reproduced as written, not silently corrected to breakeven; the config key name and the code disagree and the code is authority."
      - "The two same-bar tie-breaks (production/SL-first and optimistic/target-first) must be selectable and must produce identical results on every bar that does not span both a target and the stop."
      - "The engine internal trade.pnl and the backtest ledger blended exit price DISAGREE on a runner stopped at the trail: the engine credits the runner nothing (partial only) while the ledger prices it at the trail level. The ledger basis is what every recorded backtest R was computed from and is the default; the disagreement must be measured and reported, never silently resolved."
    confidence: Certain
    evidence:
      - "src/config_layer/crt_engine_v2.py _intrabar_trigger_price: sl_touch is tested before tp1_touch and before tp2_touch, with the inline comment 'conservative: SL before TP1 on a spanning bar' -- source-verified 2026-08-20. This is what makes the backtest path conservative despite update_trade's TP2 > SL > TP1 branch order, which operates on the already-resolved scalar."
      - "src/config_layer/crt_engine_v2.py TP1-from-OPEN branch: trade.sl_price reassigned to entry + 0.5*(tp1-entry), a half-way trail rather than breakeven -- source-verified 2026-08-20."
      - "src/runtime/backtest_v2.py: three distinct exit-price blend sites keyed on execution_planner.partial_tp_fraction, two of which consume the MUTATED trail stop rather than the original stop."
      - "Ledger fixture: XAUUSD TRADE_OPENED CRT-0001 (entry 2318.21, atr_abs 2.16714286) reproduces risk_dist 0.7534285714, tp1 2319.3401428571 at tp1_mult 1.5 breakout intent, tp2 2319.7168571429 at tp2_mult 2.0 -- arithmetic confirmed against the on-disk events.jsonl row."
    origin: "Registered 2026-08-20 (profitable-entry oracle program) BEFORE the kernel that implements it, per CLAUDE.md 6.6. Discovered while establishing what the Entry/SL/TP1/TP2 logic in the codebase actually is: the two-target partial-exit behaviour is load-bearing in production and was entirely unregistered, and the research measurement kernel cannot represent it."
    status: active
    version: 1
    owner: research-measurement
    traceability:
      manifest: UNKNOWN
      implements: src/research/oracle/multi_tp_walk.py
    notes: "Registering this node makes explicit a gap that was previously invisible: production trades a two-target partial-exit object while research measures a single-target one. This node grants NO authority and asserts nothing about which object is better -- it only names the difference so a measurement can declare which one it used. The half-way trail is reproduced as-is under the program explicit assume-happy-flow scope; whether it SHOULD be breakeven is a separate adjudication, not this node claim."
    epistemic:
      known_invariants:
        - "A trade that reaches TP1 and then stops out is profitable, not flat: the realised blend is strictly above the entry for any partial_fraction above 0 and any positive tp1_mult."
        - "The two same-bar tie-breaks can only disagree on bars whose range spans both a target and the stop; on all other bars they are identical by construction."
      unknown_mechanism: "RESOLVED 2026-08-20 on the XAUUSD M15 corpus (47,157 bars, 188,628 paired comparisons): the two tie-breaks produce a different outcome on 6.81 pct of units, worth a mean +0.0866R across all units and +1.2704R across the units that differ. The remaining open question is narrower: whether that 6.81 pct concentrates in identifiable conditions (volatility regime, session, bar range) rather than being diffuse, which would make the ordering assumption a conditional rather than a uniform uncertainty."
      candidate_hypotheses:
        - "CONFIRMED 2026-08-20: same-bar span events are rare enough (6.81 pct, single-digit) that the tie-break choice shifts aggregate expectancy by less than the cost model does. Measured tie-break gap +0.0866R against a measured SEM-015 cost of 0.0839R to 0.1759R depending on stop geometry, so cost is the LARGER basis effect on every arm. An earlier synthetic estimate on Gaussian random-walk paths (5.92 pct, +0.0635R) pointed the other way only because it was compared against the F-082 reference-case cost rather than the cost this geometry actually incurs; the corpus measurement supersedes it."
        - "UNTESTED: span events concentrate in high-volatility bars, so the tie-break gap is larger in the EXPANSION volatility tercile than in COMPRESSION."
      resolution_metric: "Label the full corpus under both tie-breaks and report the count and R-gap of outcomes that differ, stratified by volatility regime. The oracle labeler produces exactly this as a by-product."
      falsification_conditions:
        - "NOT FIRED 2026-08-20: the condition was that zero outcomes differ, which would make the distinction inert on M15. Measured 12,851 of 188,628 units differing, so the band is real and both arms must be carried."
        - "NOT FIRED 2026-08-20: the condition was that the tie-break gap exceed the cost correction, which would make intrabar ordering the dominant measurement-basis uncertainty. Measured +0.0866R against 0.0839R to 0.1759R of cost, so cost remains dominant on every arm and is what must be declared first. The condition stands for other instruments and geometries; it was evaluated on XAUUSD M15 under this program only."

  profitable_entry_oracle_label:
    id: SEM-018
    canonical_name: PROFITABLE_ENTRY_ORACLE_LABEL
    aliases:
      - oracle_label
      - dense_bar_label
      - outcome_first_label
    semantic_category: ValidationRule
    knowledge_status: CHARACTERIZED
    description: "A per-bar, per-direction label stating what a hypothetical trade opened at that bar would have realised under a declared exit geometry. It is defined for EVERY bar, not only bars a detector selected, which detaches the measurement from detection throughput entirely. Because the label is a function of the future, it is a description of the past and never, by itself, an edge."
    observed_behaviour: "Research programs in this repository to date have been entry-first: a detector proposes candidate bars and only those bars receive an outcome. That construction couples statistical power to detector throughput, and repeatedly produced sample sizes too small to conclude anything (single-digit to low-double-digit n on the CRT spine for XAUUSD). No artifact currently carries an outcome for an unselected bar under the production two-target geometry: scripts/research/opportunity_scanner.py labels every bar but under a single-TP trailing walk, and scripts/research/build_trace_corpus.py labels only detected signals."
    mathematical_definition: "For each bar index t and direction d, entry = close(t); the stop is placed by a declared sl_geom; tp1 and tp2 follow SEM-017 from risk_dist; the outcome is the SEM-017 walk over bars strictly after t bounded by a declared horizon; y_R_net is that gross R less the SEM-015 component cost for the realised exit kind; y_win is 1 if y_R_net is above 0. The label set is the cartesian product of bars, directions, stop geometries and tie-breaks, each combination declared before measurement."
    units: R (net), and a binary win indicator
    formula: "y_R_net(t, d, sl_geom, tie_break) = multi_tp_walk(...) - cost_r(exit_kind, d)"
    dependencies:
      - SEM-015
      - SEM-016
      - SEM-017
    required_inputs:
      - ohlcv_series
      - atr_absolute
      - trade_intent
      - cost_model
    produced_outputs:
      - y_R_gross
      - y_R_net
      - y_win
      - exit_reason
    producers:
      - src/research/oracle/labeler.py
    consumers:
      - scripts/research/oracle_pattern_scan.py
    transitions: []
    validation_rules:
      - "Labels must be derived by forward simulation at source. Reading an outcome or rr field from opportunities.jsonl or from a trade ledger is forbidden: that stream is a detection stream and is not self-consistent."
      - "Adjacent labels overlap almost completely because their forward horizons overlap. Effective independent sample size is approximately the bar count divided by the horizon, and any significance statement must be computed on that basis, never on the raw row count."
      - "A label set is a description, not evidence of an edge. Any forward claim must be evaluated on a non-overlapping partition that was not used to select the pattern."
      - "The harness that consumes these labels must first demonstrate it can recover a planted signal of known magnitude; otherwise a null result is indistinguishable from a blind miner."
    confidence: Certain
    evidence:
      - "docs/analysis/feature-identity-state-inventory-2026-08-19.xlsx: the declared measurement surface this label is joined against -- 48 decision-vector slots, 65 FM identities, 50 ontology discrete feature-states, 37 machine states, 9 CRT resolver states."
      - "scripts/research/opportunity_scanner.py: existing proof that dense per-bar dual-direction labelling is tractable on this corpus, at a different exit geometry."
      - "src/research/measurement/forward_walk.py: the no-lookahead contract this label walk inherits -- bars strictly after the entry index, guarded rather than assumed."
    origin: "Registered 2026-08-20 (profitable-entry oracle program) BEFORE the labeler that implements it, per CLAUDE.md 6.6. Created to name the outcome-first construction explicitly so it cannot be confused with a detector result, and so the lookahead inherent in selecting bars by their future is recorded on the node rather than living only in a report caveats."
    status: active
    version: 1
    owner: research-measurement
    traceability:
      manifest: UNKNOWN
      implements: src/research/oracle/labeler.py
    notes: "This node grants NO authority. It defines a measurement object, not a strategy, and it deliberately encodes its own principal weakness -- selection on the future -- as a validation rule rather than as prose that can be dropped when results are summarised. The program that introduces it treats prior registered findings as unverified rather than as priors, so this label set is independent evidence and neither confirms nor overturns any existing finding."
    epistemic:
      known_invariants:
        - "The label is a deterministic function of the corpus and the declared geometry: given the same bars and the same declared parameters it reproduces exactly, with no seed dependence."
        - "Selecting bars by their realised outcome is lookahead by construction. This cannot be engineered away; it is contained by never evaluating a pattern on the partition that selected it."
        - "The base rate of profitable bars is a property of the geometry and the instrument drift, not of any pattern, and must be reported alongside every conditional result."
      unknown_mechanism: "ANSWERED 2026-08-21 on XAUUSD M15 (47,157 bars, 377,256 units, TRAIN partition only). The vocabulary carries RELATIVE conditional information and no ECONOMIC information. Relative: 12,898 (long) and 13,068 (short) of 68,473 depth-3 conjunctions beat the direction-matched base rate against a MEASURED block-permutation null of 1,694 and 2,102 respectively, a 7.6x and 6.2x excess with tight permutation draws. Economic: 0 of 84 sufficient state cells clear zero on the net basis across all 8 arm-by-direction combinations, and the handful of conjunctions clearing zero (6 long, 5 short) is not distinguishable from the permuted null (1, 3, 0 and 0, 0, 0). The narrower question now open is WHY the relative structure will not cross zero: whether it is bounded by the exit geometry, by cost, or by the information itself."
      candidate_hypotheses:
        - "SPLIT 2026-08-21. REFUTED for relative separation: state families and their conjunctions separate well beyond the base rate at a 6.2x to 7.6x excess over a measured permutation null. CONFIRMED for economic separation: no cell and no credible conjunction clears zero. The constraint is therefore neither the detector nor an absence of structure, but that the structure is not large enough to cross the cost-and-geometry threshold."
        - "SUPPORTED 2026-08-21: continuous features are flat (max absolute AUC lift 0.048, and that on FM-023 which is separately known to saturate; all others 0.51 to 0.53, every top-decile expectancy negative) while the discrete state families and their conjunctions show the 6.2x to 7.6x excess above. Consistent with the states encoding structure the raw values do not, though not proof of that mechanism: discretisation also changes the estimator, and the two were not separated in this run."
        - "CONFIRMED 2026-08-21 where it applied. On the GROSS basis two arms showed many cells clearing zero (65 and 56), but only on arms whose base was already positive; controlling against passive same-direction exposure collapsed them to 8, 1 and 0. The drift explanation held for exactly the cases that looked strongest, which is why the passive-exposure control and not zero is the binding benchmark."
      resolution_metric: "Marginal effect sizes per continuous feature and per discrete state cell against the direction-matched base rate, with block bootstrap sized to the label overlap, and with a passive long-exposure control reported beside every cell. A pattern must clear both the base rate and the control on a partition that did not select it."
      falsification_conditions:
        - "NOT FIRED 2026-08-21: signals planted at AUC 0.60, 0.55 and 0.53 were recovered at 0.606, 0.549 and 0.532. The null from this harness is interpretable."
        - "SUPERSEDED 2026-08-21 as written, and the correction matters. A plus-or-minus one bar shift CANNOT collapse to chance: adjacent oracle labels share horizon-minus-one forward bars and are genuinely correlated (measured correlation +0.292 at lag 1, decaying to +0.003 by lag 20), so a residual there is the overlap this node already declares, not a leak. The condition as originally written assumed label independence, which is the very assumption this node exists to reject, and it failed the gate spuriously on first run. Replaced by two conditions that do hold: a label shifted a FULL HORIZON must collapse to chance (measured 0.596 to 0.499 and 0.502), and exact per-bar identities must hold aligned (error 2.8e-14) and BREAK under a one-bar shift (error 176)."
        - "FIRED 2026-08-21 and acted on: see the drift hypothesis above. Every gross-basis cell that cleared zero on an arm with a positive base was re-tested against passive same-direction exposure and the great majority did not survive."

  dynamic_stop_policy:
    id: SEM-019
    canonical_name: DYNAMIC_STOP_POLICY
    aliases:
      - trailing_stop
      - stop_modification
      - ratchet_stop
      - breakeven_stop
    semantic_category: ExecutionBehaviour
    knowledge_status: MATHEMATICALLY_DEFINED
    description: "A rule that MOVES the stop of an open trade as the trade progresses, using only information already available. Distinct from the stop PLACEMENT geometry (SEM-017), which fixes a level once at entry: a dynamic policy makes the stop a function of the path realised so far. The production trade contains exactly one such rule, and the wider class has never been measured against it."
    observed_behaviour: "Production has ONE dynamic stop: on the TP1 transition, src/config_layer/crt_engine_v2.py ExecutionEngine.update_trade reassigns trade.sl_price to entry + 0.5*(tp1-entry), a HALF-WAY trail (SEM-017). There is no ratchet, no breakeven rule, and no time-based tightening anywhere on the production path, despite the config key being named partial_tp_breakeven_enabled. Three unrelated ratchet implementations exist OFF that path and none of them drives a two-target trade: src/research/measurement/forward_walk.py exit_model='trailing' (single TP, opt-in, described in its own docstring as legacy), src/replay/timing_reconstructor.py forward-walks a trailing stop with a trail_mult, and src/research/path/ambiguity_census.py records that in intrabar_fixed 'the trailing stop never ratchets'. So the class of causal stop policies is absent for the object production actually trades."
    mathematical_definition: "A policy P maps (entry, initial stop, tp1, tp2, direction, TP1 status, and the running favourable/adverse extremes over bars with index <= i-1) to the stop level applied to bar i. CAUSALITY CONSTRAINT: the stop applied to bar i may depend only on bars STRICTLY BEFORE i. A policy that consults bar i's own high or low to set the stop that bar i is then tested against is not causal, because the within-bar order of the ratchet and the stop touch is unknowable from OHLC. MONOTONICITY CONSTRAINT: for a long, the stop is non-decreasing over the life of the trade; for a short, non-increasing. A rule that moves a stop AWAY from price is widening risk, not managing it, and is out of this node's scope."
    units: price (the stop level), parameterised in R or in ATR multiples
    formula: "stop_i = max(stop_{i-1}, f(extremes over bars <= i-1)) for a long ; stop_i = min(stop_{i-1}, f(...)) for a short"
    dependencies:
      - SEM-015
      - SEM-016
      - SEM-017
    required_inputs:
      - entry
      - initial_stop
      - direction
      - running_favourable_extreme
      - bar_index
    produced_outputs:
      - stop_level
    producers:
      - src/config_layer/crt_engine_v2.py
    consumers:
      - src/research/oracle/stop_policy.py
      - src/research/oracle/multi_tp_walk.py
    transitions:
      - "stop unchanged (no trigger condition met)"
      - "stop tightened toward price (ratchet, breakeven, or time decay fired)"
    validation_rules:
      - "The stop applied to bar i must be a function of bars strictly before i. A policy that reads bar i's own high or low to set bar i's stop must be rejected by test, not merely discouraged by comment: resolving that ambiguity favourably is silent optimism that recurs on EVERY bar of EVERY trade, unlike the SEM-017 tie-break which can only fire on a spanning bar."
      - "A stop must never move away from price. Monotonicity is asserted per bar, not checked once at the end."
      - "The absence of a policy must be expressible and must reproduce the existing behaviour byte-identically, so that the value of the whole class is measurable against a genuine control rather than against another policy."
      - "A same-bar-update variant may be measured, but only as the second arm of a declared BAND reported beside the causal result, never as the primary basis. CORRECTED 2026-08-21 (E-001): this rule originally called that arm an OPTIMISM BOUND, which is measurably wrong for most of the policy grid. Arming a stop from the current bar own extreme makes it tighter sooner, so the spike that arms a ratchet becomes the bar that exits on it. On 4,000 synthetic paths ratchet_0.5r is worse on 920 and better on 248, breakeven_at_1r is never better (0 vs 34), and only time_decay -- which does not read the favourable extreme at all -- is mostly better (876 vs 66). Neither arm dominates and the sign is policy-dependent, so the SEM-017 band treatment applies rather than a bound."
    confidence: Certain
    evidence:
      - "src/config_layer/crt_engine_v2.py ExecutionEngine.update_trade: the TP1-from-OPEN branch is the only site on the production path that reassigns trade.sl_price during a trade -- source-verified 2026-08-21."
      - "src/research/measurement/forward_walk.py: exit_model='trailing' ratchets trail_stop toward peak, but the same function models a single TP with no partial, so it cannot express a two-target trade."
      - "src/research/path/ambiguity_census.py:58 records that under intrabar_fixed the trailing stop never ratchets, and that a tie-break therefore always resolves to SL at exactly -1.0R -- the fixed-stop case whose ambiguity a ratchet strictly worsens."
      - "src/replay/timing_reconstructor.py: an independent third ratchet implementation, single-TP, used for replay reconstruction only."
    origin: "Registered 2026-08-21 (exit-geometry decomposition program) BEFORE the policy module that implements it, per CLAUDE.md 6.6. Created because the profitable-entry oracle program established that the declared vocabulary carries relative information that never crosses zero, leaving exit geometry as one of three candidate explanations -- and the causal stop-policy class turned out to be entirely absent for the two-target production object."
    status: active
    version: 1
    owner: research-measurement
    traceability:
      manifest: UNKNOWN
      implements: src/research/oracle/stop_policy.py
    notes: "This node grants NO authority. Naming the class does not license adding any policy to production: per CLAUDE.md 6.5 only a measured G001 improvement does, and this program is descriptive. The node exists so that the ONE dynamic stop production already runs can be compared against a control that has none, which is a question about live behaviour that has never been asked. A second structural fact belongs here rather than in a report: a trail wider than the remaining distance to the target is INERT BY CONSTRUCTION, because the target ends the trade before the trail can ever bind. Such cells must be reported as structurally unreachable, never as a measured no-effect -- the two are indistinguishable in a results table and only one of them is evidence."
    epistemic:
      known_invariants:
        - "Production's only dynamic stop fires on the TP1 transition and nowhere else; between entry and TP1 the stop is fixed."
        - "A ratcheting stop cannot be faithfully simulated from OHLC alone: when the ratchet condition and the stop touch fall on the same bar, the within-bar order is not recoverable."
        - "Tightening a stop is not free. It converts some timeouts and some eventual winners into stops, and every stop exit pays stop slippage under SEM-015 while a limit exit does not."
      unknown_mechanism: "ANSWERED 2026-08-21 on XAUUSD M15 (47,157 bars, 390 cells: 5 stop geometries x 13 arms x 3 horizons x 2 directions, entries identical in every cell). NO causal stop policy improves net expectancy, and the axis is inert: the entire spread from the best to the worst of the 12 policies is 0.0198 to 0.0212R depending on horizon, which is 0.33 to 0.49 of ONE cell 95pct block-bootstrap interval, at three horizons independently. The stop WIDTH axis moves net expectancy by 0.25R over the same cells (4 to 6 interval widths), about 12x the whole policy axis, and it does so almost entirely through cost_r = cost_price / risk_distance. On the specific production question: the half-way trail is the worst arm on both TIGHT geometries (disp_bar, which is the construction production actually uses, and fixed_0.5) in all 8 geometry x direction x horizon combinations, by a stable -0.009 to -0.013R, and middling (rank 5 to 10 of 12) on wide stops -- consistent with a trail that sits close to entry when risk is small. The remaining open question is narrower: whether that consistency survives on an instrument without the strong directional drift this corpus carries, since drift is what makes tightening asymmetric between the long and short sides."
      candidate_hypotheses:
        - "SUPPORTED IN SIGN, NOT SIGNIFICANT 2026-08-21. The half-way trail is the worst arm of 12 on both tight geometries in all 8 combinations tested, and worst among the RANKING-LICENSED arms (fixed, production, time_decay) at all three horizons, by -0.0075 to -0.0081R -- stable to three decimals across horizons, which is what a mechanism binding shortly after TP1 rather than accumulating over the hold would produce. But the magnitude is 0.16 of one confidence-interval width, and the combinations share the same bars, so no p-value is computed from their agreement and the trail is NOT distinguishable from leaving the stop alone. Grants no authority to remove it (CLAUDE.md 6.5); the active config was not touched."
        - "REFUTED IN DIRECTION, CONFIRMED IN MAGNITUDE 2026-08-21 (synthetic paths, pending corpus re-measurement). The hypothesis was that ratchets look BETTER than they are because of the same-bar ambiguity. Measured, the same-bar arm is mostly WORSE for extreme-following policies -- it tightens sooner, so the bar that arms the ratchet is the bar that exits on it (ratchet_0.5r worse on 920 of 4,000 paths vs better on 248, mean -0.0976R; breakeven_at_1r never better). The magnitude half of the hypothesis DID hold: the causal-versus-same-bar gap (-0.0976R for ratchet_0.5r) is the same order as the spread between policies themselves, so the ambiguity is not second-order and both arms must be carried."
        - "REFUTED AS AN OUTPERFORMANCE CLAIM, VINDICATED AS A MEASURABILITY ONE 2026-08-21. Time-decay does NOT outperform: time_decay_6_12 and time_decay_18_12 land within 0.001R of the do-nothing control at all three horizons, so the F-024 timing asymmetry is not consumable through a stop schedule. But time-decay turned out to be the ONLY policy in the grid whose same-bar ambiguity band is zero (mean +0.0003R, versus 0.20 to 0.31R for every extreme-following policy), precisely because it reads elapsed bars and never the running favourable extreme. That makes it the only ratchet-alternative whose ranking is licensed from M15 OHLC at all -- an unanticipated and more useful property than the one hypothesised."
      resolution_metric: "Label the full corpus under each policy at fixed entry and fixed target geometry, so the policy is the only thing that varies, and compare net expectancy with a block bootstrap sized to the label overlap. Report the causal and same-bar-update arms side by side so the size of the unresolvable ambiguity is visible."
      falsification_conditions:
        - "FIRED 2026-08-21. The do-nothing control matches every dynamic policy well inside the bootstrap interval -- the full 12-arm spread is 0.33 to 0.49 of one interval width at three horizons independently. The class IS inert on this object at this timeframe and this node is descriptive only. Note the scope: inert relative to the measurement precision available from 47,157 bars, not proven to be exactly zero."
        - "FIRED 2026-08-21, decisively, and the restriction is applied rather than noted. Measured on the real corpus (not the synthetic paths, whose estimate it supersedes by 2 to 3x): the causal-versus-same-bar band is 0.196R mean and 0.308R max, against a total policy spread of 0.0212R -- the ambiguity is 9.2x to 14.5x the quantity it would be used to measure. Ranking among EXTREME-FOLLOWING policies (ratchet_*, breakeven_*) is therefore NOT licensed from M15 OHLC and would require tick data. Ranking among level- and time-triggered arms (fixed, production, time_decay_*) IS licensed, because their band is zero to four decimals. Crucially this does not rescue anything: the causal arm is the OPTIMISTIC end of the band in 14 of 16 cases, every result reported used it, and every policy already fails to clear zero -- so the true values lie at or below what was measured."

  exit_capture_decomposition:
    id: SEM-020
    canonical_name: EXIT_CAPTURE_DECOMPOSITION
    aliases:
      - reality_gap
      - ceiling_utilization
      - capture_ratio
    semantic_category: ValidationRule
    knowledge_status: MATHEMATICALLY_DEFINED
    description: "The accounting that bounds what any exit rule could possibly achieve on a given entry population, and the rule for which of those bounds may be quoted as headroom. Three ceilings are DISTINCT and are routinely conflated: what perfect foresight would capture, what a causal rule could capture, and what the incumbent geometry does capture."
    observed_behaviour: "src/research/exit_grid.py ceilings() already computes structural_upper_bound, perfect_information_upper_bound, reality_gap and ceiling_utilization, and classifies a run as ALPHA or ENGINEERING. Two properties of that implementation bound its reach. First, min_achievable_cost derives from the flat CostModel round_trip_bps, which on XAUUSD is roughly eleven times the measured broker cost (SEM-015), so every ceiling computed through it inherits that scaling. Second, its e_gross comes from forward_walk, a single-TP object, while production trades the two-target object of SEM-017. src/research/path/ambiguity_census.py records the exact coupling that makes this matter: min_achievable_cost cancels, so reality_gap == mfe_capture - e_gross identically, and any pessimism in e_gross inflates the apparent headroom one-for-one."
    mathematical_definition: "Let mfe_capture = E[MFE_r] from an exit-agnostic horizon walk, e_gross = E[realised gross R] under a declared exit object, and min_cost = the lowest achievable cost in R across the geometry grid. Then perfect_information_upper_bound = mfe_capture - min_cost; structural_upper_bound = e_gross - min_cost; reality_gap = perfect - structural = mfe_capture - e_gross; ceiling_utilization = structural / perfect; and capture_ratio per trade = realised R / MFE_r. The CAUSAL ceiling is a fourth, distinct quantity: the best net expectancy attainable by any rule in the declared policy grid using only past bars. It sits between structural and perfect and is the only one of the three upper bounds that a real rule could reach."
    units: R (multiples of the entry-to-stop risk distance), and a dimensionless ratio for utilization and capture
    formula: "reality_gap = mfe_capture - e_gross ; ceiling_utilization = (e_gross - min_cost) / (mfe_capture - min_cost) ; capture_ratio = realised_R / MFE_r"
    dependencies:
      - SEM-015
      - SEM-016
      - SEM-017
      - SEM-019
    required_inputs:
      - max_favorable_excursion_r
      - realised_gross_r
      - cost_r
    produced_outputs:
      - perfect_information_upper_bound
      - causal_upper_bound
      - structural_upper_bound
      - reality_gap
      - ceiling_utilization
      - capture_ratio
    producers:
      - src/research/exit_grid.py
      - src/research/measurement/forward_walk.py
      - src/research/forensics.py
    consumers:
      - scripts/research/exit_geometry_scan.py
    transitions: []
    validation_rules:
      - "E[MFE_r] must be greater than or equal to E[realised gross R] in every cell. A violation is a defect in the walk or the join, never a finding: a trade cannot realise more than the favourable excursion its own path offered."
      - "The perfect-foresight ceiling must NEVER be quoted as attainable headroom. It requires knowing the path in advance and no causal rule reaches it. Reporting it without the causal ceiling beside it overstates what exit work can recover."
      - "A ceiling computed with a cost model that does not match the instrument is not a ceiling for that instrument. The cost basis must be declared with every ceiling."
      - "A ceiling computed on a different exit object than the one being evaluated is not commensurable with it. The exit object must be declared with every ceiling."
      - "Because min_achievable_cost cancels in reality_gap, any directional bias in e_gross transfers to the gap one-for-one. The tie-break convention used to produce e_gross must therefore be declared alongside it."
      - "On an instrument with drift over the corpus, a cell must be benchmarked against passive same-direction exposure, not against zero. An unconditional every-bar expectancy that is positive is a defect signal to be investigated before it is a result to be reported."
    confidence: Certain
    evidence:
      - "src/research/exit_grid.py ceilings(): the four quantities and the ALPHA / ENGINEERING regime classification, source-verified 2026-08-21."
      - "src/research/path/ambiguity_census.py module docstring: the algebraic proof that min_achievable_cost cancels so reality_gap == mfe_capture - e_gross exactly, and that mfe_capture is tie-break immune while e_gross is tie-break exposed."
      - "src/research/forensics.py _opp_bundle: capture_ratio percentiles and MFE reach thresholds already implemented over the same records."
      - "src/research/measurement/forward_walk.py horizon_excursion: the exit-agnostic walk that never exits on SL or TP, which is what makes mfe_capture independent of any exit convention."
    origin: "Registered 2026-08-21 (exit-geometry decomposition program) to separate three ceilings that the existing implementation computes but does not distinguish by attainability, and to attach the cost-basis and exit-object declarations that make a ceiling comparable to the thing it is bounding."
    status: active
    version: 1
    owner: research-measurement
    traceability:
      manifest: UNKNOWN
      implements: scripts/research/exit_geometry_scan.py
    notes: "This node grants NO authority and reverses nothing. It does not re-measure or contradict any registered finding: the ceilings computed under it use a different cost basis and a different exit object than the F-025 lineage did, on a different instrument, so the two are not commensurable and neither confirms the other. Its purpose is to make the incommensurability explicit rather than to adjudicate it."
    epistemic:
      known_invariants:
        - "mfe_capture is exit-agnostic and therefore immune to the same-bar tie-break; e_gross is not."
        - "reality_gap is exactly mfe_capture minus e_gross, because the cost term cancels."
        - "A capture ratio above 1 is arithmetically impossible for a single trade and indicates a join or alignment defect."
      unknown_mechanism: "ANSWERED 2026-08-21 on XAUUSD M15: essentially none, and the reason is structural rather than a tuning shortfall. Gross expectancy over every bar in both directions converges on ZERO as the stop widens (+0.0010R at 3.0 ATR, versus -0.11R at the tightest geometries where a near stop is reached by noise), so net expectancy is simply minus the cost. An exit cannot create expectancy the entry did not contain; it can only decide how much of a zero-mean quantity is converted into cost. The causal ceiling therefore sits essentially AT the incumbent once stop width is held fixed -- the best of 12 policies improves on doing nothing by less than half a confidence-interval width -- while the perfect-foresight bound (2.6 to 12.6R) is unreachable by construction. The narrower question now open is whether the same decomposition holds on an instrument without strong directional drift, since drift is what makes the long and short sides respond asymmetrically to tightening."
      candidate_hypotheses:
        - "CONFIRMED 2026-08-21, and more strongly than stated. The causal ceiling does not merely sit closer to the incumbent than to the perfect-foresight bound; at fixed stop width it is indistinguishable from the incumbent (best-minus-do-nothing under half a confidence-interval width), while reality_gap runs 2.7 to 12.7R. Effectively all of the apparent headroom is foresight, not policy. The median capture ratio is NEGATIVE on 9 of 12 cells (CORRECTED 2026-08-21 from 10 of 12; recounted from ceilings_cells.csv, the 3 positives all fixed_atr long) and the p90 never exceeds 0.55, so the exit converts a favourable excursion into a loss more often than not."
        - "CONFIRMED 2026-08-21 in direction, with the magnitude smaller than implied. The measured min_achievable_cost is 0.0219R at the widest declared stop, where the flat 12bps basis would charge roughly an order of magnitude more in R at that width. Because min_cost enters perfect_information_upper_bound and structural_upper_bound identically it CANCELS in reality_gap, so the correction shifts the ceilings without changing the gap between them -- the headroom story is unaffected by the cost basis, while the level of every bound is not. Recorded because the hypothesis as written could be read as claiming the correction changes the conclusion; it does not."
      resolution_metric: "Compute all four quantities on the same entry population, the same exit object and the same measured cost model, and report them together with the capture-ratio distribution so the incumbent's position between the bounds is visible rather than inferred."
      falsification_conditions:
        - "NOT FIRED 2026-08-21 (12 of 12 cells open, perfect ceiling 2.60 to 12.61R) -- and the condition is NEAR-VACUOUS on a dense every-bar universe, which is itself worth recording. Every bar has favourable excursion in at least one direction, so this gate can essentially never close on an unselected population. It retains discriminating power only on a SELECTED entry population, which is the context the exit_grid lineage used it in. Reported as what it is rather than presented as a positive result."
        - "FIRED 2026-08-21. At fixed stop width the best policy exceeds the incumbent by well under one bootstrap interval (full 12-arm spread 0.33 to 0.49 interval widths), so the incumbent is already at the reachable ceiling on the POLICY axis and further stop-policy work has no remaining value on this object. Scope discipline: this fired for stop POLICY, not for stop WIDTH -- width moves net expectancy by 4 to 6 interval widths and is a real lever, though it operates through cost rather than through expectancy, and widening converges toward holding the position rather than toward a better trade."

  displacement_origin_invalidation:
    id: SEM-021
    canonical_name: DISPLACEMENT_ORIGIN_INVALIDATION
    aliases:
      - displacement_origin_kill
      - structural_invalidation_exit
      - early_structural_failure_exit
    semantic_category: ExecutionBehaviour
    knowledge_status: CHARACTERIZED
    depends_on:
      - SEM-017
      - SEM-019
    description: "A CLOSE-triggered exit that TERMINATES a trade when the displacement candle that founded the setup has been negated. It is neither stop PLACEMENT (SEM-017, which fixes a level once at entry) nor a stop POLICY (SEM-019, which MOVES a stop as the path unfolds): it moves nothing. It ends the trade on a semantic condition -- the structural premise that justified the entry no longer holds -- so the loss is truncated at the close rather than carried to the geometric stop. Registered 2026-08-21 BEFORE the code that implements it, per the ontology-first contract."
    observed_behaviour: "Not yet measured. No ledger, corpus run, expectancy or trade count exists for this node. Motivating observation only: F-025 recorded that 90.55 percent of the crypto loss book exits via plain_stop_loss, i.e. the full risk distance, and F-087 recorded that the incumbent exit converts an in-profit trade into a loss on 9 of 12 ceiling cells. Whether truncating STRUCTURALLY FALSIFIED trades specifically removes more loss than it forgoes is exactly the open question, and it is not answered by either of those observations."
    mathematical_definition: "Let d be the displacement candle that activated the setup, with origin o = open(d). For a LONG the setup is invalidated at the first bar t strictly after the entry bar with close(t) < o; for a SHORT, the first bar t with close(t) > o. The exit is booked at close(t), NEVER at o -- booking at o would assume a fill at a level the bar may never have offered after the trigger was known. Direction is inherited from SEM-012 / F-074, under which displacement is a directional impulse away from the swept side, so 'origin' is unambiguous and unsigned energy alone cannot found the trade."
    units: price (the origin level), and R for any measured effect
    why_this_is_rankable_from_ohlc: "F-087 established that arms reading the RUNNING EXTREME (every ratchet_*, every breakeven_*) carry a same-bar ambiguity band of 0.261R mean over the 12 arms it governs -- 12x to 15x the 0.0198 to 0.0212R spread they would be used to measure -- so those arms cannot be ranked from M15 OHLC at all. This rule reads only the CLOSE, so it inherits the licensed profile of the fixed, production and time_decay arms, whose band is about 0.0005R. It is therefore measurable on the existing corpus without tick data. Of the seven rules in the 2026-08-21 CRT parameter draft it is the only one that is both genuinely new and cleanly rankable; the other six are re-parameterisations of existing active-config knobs."
    precedence_contract: "Declared BEFORE measurement rather than discovered during it, because the interaction with SEM-017 changes results and a silently-chosen convention would be unfalsifiable. Two arms ship as a config choice, and they are NOT equivalent. Under after_resting_fills (default) the order is TP2, then SL, then the TP1 partial, THEN this kill at the close: resting orders fill intrabar and are mechanically prior, and the kill still strictly preempts the SEM-017 half-way trail, so a bar that reaches TP1 and closes through the origin books the partial and exits the runner at the close instead of arming the trail. Under absolute the kill is evaluated before TP2/SL/TP1; this is the literal reading of fires-first and is simpler, but it can cancel a resting order that would already have filled earlier in the same bar, which is a form of lookahead. The absolute arm is therefore a DECLARED MEASUREMENT WEAKNESS, not a neutral alternative, and a positive result on it alone must not be registered."
    epistemic:
      known_invariants:
        - "Close-triggered, so it carries the licensed same-bar ambiguity profile (about 0.0005R) rather than the 0.261R extreme-following band measured in F-087."
        - "On any trade where it fires it exits at or before the geometric stop, so per-trade loss magnitude on that trade is bounded above by the unmodified arm."
        - "It cannot create expectancy the entry did not contain. F-087 measured gross expectancy at the every-bar level as +0.0010R at the widest stop, so an exit rule can only decide how much of a zero-mean quantity becomes cost."
        - "The origin must be captured onto the Trade at build time. EngineState.displacement_candle is cleared by reset_to_range, which moves it into pending_displacement_candle while the trade may still be open, so reading engine state at kill time would silently no-op after any reset."
      unknown_mechanism: "Whether truncating structurally-falsified trades removes more loss than it forgoes in trades that briefly close through the displacement origin and then recover. Unmeasured."
      candidate_hypotheses:
        - "UNTESTED: the truncated population is disproportionately the plain_stop_loss cohort F-025 measured at 90.55 percent of the loss book, so truncation lands mostly on trades that were going to lose the full risk distance anyway."
        - "UNTESTED, and the adverse case: recovery after an origin breach is common enough to make the rule net-negative. This is the same mechanism that made every ratchet arm worse in F-087 -- arming an exit sooner makes it tighter sooner, so the very bar that triggers it becomes the bar that exits on it."
        - "UNTESTED: the two precedence arms differ materially, which would indicate the result is driven by intrabar convention rather than by the structural signal."
      resolution_metric: "Paired per-bar delta against the unmodified arm on the SEM-018 label population, block-bootstrapped at the horizon (blocks, not rows -- adjacent labels share horizon-minus-one forward bars), with the SEM-015 measured cost model and the F-083 controls (random_entry, long_only) attached. Both precedence arms reported separately, never pooled."
      falsification_conditions:
        - "Mean delta versus the do-nothing arm is at or below zero with a bootstrap interval excluding a positive effect."
        - "The arm fails to beat the long_only and random_entry controls on the same bars."
        - "The two precedence arms disagree in sign, which would make the effect an artifact of intrabar convention rather than of the structural condition."
    authority: "NONE. Registration is identity, not activation, and measurable is not the same as valuable (Authority Ladder: information, then economic usefulness, then authority, then architecture). Ships default OFF behind crt_engine.displacement_origin_kill_enabled on a NON-PROMOTED shadow config; the active config and its params hash are untouched. Grants no G001, no promotion, no fusion weight, and does not re-close CRT -- that closure remains OPEN from F-074 and this node ADDS to the pending re-certification scope by explicit user decision 2026-08-21."
    origin: "Registered 2026-08-21 (CH-DISP-ORIGIN-KILL) from a user-supplied quantitative CRT rule draft. Six of the draft's seven rules were found to be re-parameterisations of existing active-config knobs (crt_engine.atr_min_displacement 1.2, crt_engine.confirmation_body_min 0.6, fvg_distance canonical slot 40, session_windows, pending_displacement_ttl_candles 4) or already-measured constructions (the time stop is F-087's time_decay arms, inert). Session gates were tabled on F-066 grounds: 53.36 percent of XAUUSD MT5 session labels derive from broker-server time mislabelled UTC."
    consumers: ["src/config_layer/crt_engine_v2.py (BacktestRunner trade-update call site)"]
    producers: ["src/config_layer/crt_engine_v2.py (Trade.displacement_origin, captured at build_trade)"]
    formula: "long: exit at close(t) for the first t > entry_bar with close(t) < open(d) ; short: first t with close(t) > open(d), where d is the founding displacement candle"
    dependencies:
      - displacement_candle
      - close
    required_inputs:
      - displacement_origin
      - candle_close
      - trade_direction
      - trade_status
    produced_outputs:
      - structural_invalidation_exit
      - exit_price
    transitions:
      - "TRADE_OPEN -> STOPPED_STRUCTURAL (close crosses the displacement origin against the trade)"
    validation_rules:
      - "The exit price is close(t), never open(d) -- booking at the origin would assume a fill the bar may not have offered after the trigger was known."
      - "displacement_origin must be captured on the Trade at build time; reading EngineState.displacement_candle at kill time silently no-ops after reset_to_range."
      - "A wick through the origin that closes back inside must NOT fire -- this node is close-triggered by construction, and an extreme-triggered variant would forfeit its rankability from M15 OHLC (F-087)."
      - "Both precedence arms must be reported separately and never pooled; a positive result on the absolute arm alone is not registrable."
    confidence: Possible
    evidence:
      - "docs/governance/build_manifests/CH-DISP-ORIGIN-KILL.impact.json (design manifest, user-authorised 2026-08-21)"
      - "F-087 same_bar_band.csv: extreme-following arms 0.261R mean band vs time_decay 0.0005R -- the measurement that makes a close-triggered rule rankable and a ratchet not"
      - "F-025: 90.55 percent of the loss book exits via plain_stop_loss (the motivating observation, NOT support for the mechanism)"
    status: registered_inactive
    version: 1
    owner: research-measurement
    traceability:
      - SEM-012
      - SEM-017
      - SEM-018
      - SEM-019
      - F-074
      - F-087
    notes: "Registered BEFORE the implementing code, per the ontology-first contract. Grants NO authority: this is identity, not activation. Ships default OFF on a NON-PROMOTED shadow config, so the active config and its params hash are untouched, and it does not re-close CRT -- that closure stays OPEN from F-074 and this node ADDS to the pending re-certification scope by explicit user decision 2026-08-21. knowledge_status is CHARACTERIZED rather than MATHEMATICALLY_DEFINED because the geometry is exactly specified while the ECONOMIC question is entirely open; confidence Possible reflects that nothing has been measured. The absolute precedence arm is a declared measurement weakness, not a neutral option."


  crt_trade_location_gate:
    id: SEM-024
    canonical_name: CRT_TRADE_LOCATION_GATE
    aliases:
      - never_chase
      - trade_location_filter
      - premium_discount_location
    semantic_category: ExecutionBehaviour
    knowledge_status: MATHEMATICALLY_DEFINED
    description: "A precondition that a candidate entry must occur AT a named structural level rather than anywhere price happens to be. It is a gate on WHERE, evaluated before any gate on WHETHER, and it is the mechanical content of the instruction 'never chase'."
    observed_behaviour: "UNIMPLEMENTED as a gate. The nine SMC primitives the gate needs (order block, fair value gap, breaker, mitigation block, PDH/PDL, EQH/EQL, CHoCH) already exist as CANONICAL FEATURES since schema v5.0 (F-076) but are only ever emitted into the 48-dimensional vector; nothing consumes them as an admission predicate. The parent-range midpoint and boundaries needed for the remaining three admissible locations are available from config_layer.parent_crt.ParentRange."
    mathematical_definition: "Given a candidate entry price e at bar t and a tolerance band w expressed in ATR, the gate admits iff e lies within w of at least one member of the declared admissible location set: {monthly_ob, quarterly_ob, weekly_ob, daily_ob, parent_range_midpoint, parent_range_high, parent_range_low}. Membership is evaluated against levels formed strictly before t. The gate is a pure predicate over price and level geometry; it consults no outcome and no forward bar."
    units: boolean, with the tolerance band w in ATR multiples
    formula: "admitted = any(abs(e - level) <= w * atr for level in admissible_levels(t))"
    dependencies:
      - SEM-022
    required_inputs:
      - candidate_entry_price
      - admissible_level_set
      - location_tolerance_atr
      - atr_at_entry_bar
    produced_outputs:
      - location_admitted
      - matched_location_kind
    producers: []
    consumers: []
    transitions: []
    validation_rules:
      - "Every admissible level must be formed strictly BEFORE the candidate bar. A level derived from the candidate bar itself, or confirmed by bars after it, is lookahead and voids the gate."
      - "The tolerance band is a BEHAVIORAL knob: strict config read, no silent default (CLAUDE.md 6.5). A tolerance wide enough to admit most bars makes the gate vacuous and must be reported as such, not tuned to taste."
      - "The gate must record WHICH location matched. A boolean with no matched_location_kind cannot be audited and cannot support a per-location breakdown."
      - "The SMC levels must be read from the canonical v5.0 feature emission, never re-derived locally, or the gate silently measures a different quantity from the one the vector carries (the F-046 / F-047 re-derivation class)."
      - "Admission is necessary, never sufficient: this gate grants location validity only and confers no trade permission on its own."
    confidence: Certain
    evidence:
      - "SujanTraderCrtExpPart2.txt:1214-1232 PHASE 5 enumerates the admissible location set and closes with 'Never chase.'"
      - "SujanTraderCrtExpPart2.txt:439-457 Rule 4 states the same gate in the earlier protocol draft and prescribes rejection when the CRT forms 'in the middle of nowhere'."
      - "F-076 registered the nine SMC primitives as canonical features at schema v5.0, so the level inputs already exist and do not need deriving."
      - "src/config_layer/parent_crt.py ParentRange supplies h_ref and l_ref, from which the midpoint and boundary locations follow."
    origin: "Registered 2026-08-22 during the SujanTrader corpus trace, BEFORE any implementing code, per CLAUDE.md 6.6."
    status: registered
    version: 1
    owner: research-sujan-crt
    traceability:
      manifest: UNKNOWN
      implements: src/research/sujan_crt/location.py
    notes: "PROVENANCE (F-077 discipline): stated in a dialogue transcript as the AI interlocutor's checklist, not the trader's authored method - the TRIGGER for this node, not its authority. Registering the gate does NOT assert it adds value; whether it does is exactly what the funnel measurement is for. Grants no G001."


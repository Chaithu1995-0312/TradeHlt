    id:                     SEM-026
    canonical_name:         MOTHER_RANGE_INSIDE_CLOSE_TRADE
    aliases:                [mother_range, InsideScore_trade, mrange]
    semantic_category:      Pattern
    knowledge_status:       CHARACTERIZED
    description:            "A t=0 mean-reversion trade after a large calendar mother range is not accepted: the next block's last close finishes back inside the mother, then fade toward the opposite mother extreme. RESEARCH object under src/research/mother_range/. Not CRT, not SEM-011, not identity L5 engine closes."
    observed_behaviour:     "Structure census 2026-08-23 (docs/analysis/mother-range-structure-2026-08-23.md, H-019): XAUUSD M15 47275 bars, calendar x=16, 3094 pairs, inside-close 51.7% (1600). Big-mother P90/100 → 70.6% (n=378); 1.5xATR/20 → 66.9% (n=478, 320 big+inside). InsideScore-when-inside median 0.53. No y. PROMOTION NOT ELIGIBLE. Economic fade candidate is a different hypothesis (H-020 / F-090), frozen after train/holdout sign disagreement."
    mathematical_definition: "Calendar blocks of x=16 M15 bars (4H floor). Mother i: H1=max high, L1=min low, R1=H1-L1. Test i+1: C2=close of last bar. inside = L1<=C2<=H1. InsideScore=(C2-L1)/R1. big = R1 > 1.5 * mean(R of 20 prior mother blocks). LONG iff inside and big and InsideScore<0.5, entry=C2, SL=L1, TP=H1. SHORT iff inside and big and InsideScore>0.5, entry=C2, SL=H1, TP=L1. Skip InsideScore==0.5 or R1<=0 or |entry-SL|<=0. Walk forward_walk.intrabar_fixed horizon 40. One open trade at a time."

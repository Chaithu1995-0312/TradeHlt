  htf_alignment_score:
    id: SEM-023
    canonical_name: HTF_ALIGNMENT_SCORE
    aliases:
      - crt_filter_score
      - alignment_rubric
      - primary_crt_score
    semantic_category: State
    knowledge_status: MATHEMATICALLY_DEFINED
    description: "A fixed-weight additive rubric over eight independently-observable conditions, scored out of exactly 100, with a declared admission threshold of 90. It converts the qualitative question 'do the higher timeframes agree' into a single ordinal that a gate can compare against a number."
    observed_behaviour: "UNIMPLEMENTED. No scoring rubric of this shape exists anywhere in the repository; the nearest relatives are the fusion weighted-completeness gate (a different quantity, over engine scores rather than structural conditions) and the DecisionEngine semantic approvals. The rubric's own arithmetic carries a property the source corpus does not state: the eight declared weights sum to EXACTLY 100, so a threshold of 90 admits at most one missing 10-point component and rejects any two omissions."
    mathematical_definition: "score = 15*monthly_aligned + 15*weekly_aligned + 20*daily_objective_clear + 15*htf_location + 10*liquidity_sweep + 10*rejection_block + 10*displacement + 5*bos_choch, where every term is an indicator in {0,1}. Admission is score >= 90. Since the weights sum to 100, the admissible omission set is exactly {}, {bos_choch}, {any single 10-weight term}, and {bos_choch + any single 5-weight term} - the last being empty because bos_choch is the only 5-weight term. No two 10-weight omissions can ever be admitted."
    units: points out of 100
    formula: "score = sum(w_i * indicator_i) ; admitted = score >= 90"
    dependencies:
      - SEM-008
      - SEM-022
    required_inputs:
      - monthly_alignment_indicator
      - weekly_alignment_indicator
      - daily_objective_indicator
      - htf_location_indicator
      - liquidity_sweep_indicator
      - rejection_block_indicator
      - displacement_indicator
      - bos_choch_indicator
    produced_outputs:
      - alignment_score
      - alignment_admitted
    producers: []
    consumers: []
    transitions: []
    validation_rules:
      - "The eight weights must sum to exactly 100. A weight edit that breaks the sum changes the meaning of the threshold and must be registered as a new version, not applied in place."
      - "Every indicator must be point-in-time and computed from CLOSED bars only."
      - "The threshold is a declared BEHAVIORAL knob and must be read strictly from config with no silent default (CLAUDE.md 6.5)."
      - "The score is an admission filter, never a position size and never a probability. It must not be rescaled into [0,1] and fed to any model as a confidence."
      - "A component that cannot be evaluated (for example an UNMEASURABLE ladder rung, SEM-022) must force the score to UNDEFINED and reject, never contribute 0 silently - a 0 contribution and an unevaluable component are different facts."
    confidence: Certain
    evidence:
      - "SujanTraderCrtExpPart2.txt:569-580 states the eight components, their weights, and the 'Trade only if the score is >= 90' rule verbatim."
      - "Arithmetic verified 2026-08-22: 15+15+20+15+10+10+10+5 = 100 exactly, which is what makes the >=90 threshold equivalent to 'at most one 10-point omission'."
      - "SujanTraderCrtExpPart2.txt:1122 states the design intent that roughly 90 percent of charts should be rejected before an entry is considered."
      - "SujanTraderCrtExpPart2.txt:586-596 defines the 'Primary CRT' as the conjunction the rubric scores."
    origin: "Registered 2026-08-22 during the SujanTrader corpus trace, BEFORE any implementing code, per CLAUDE.md 6.6."
    status: registered

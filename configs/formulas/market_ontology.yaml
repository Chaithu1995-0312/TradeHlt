        condition:   "no centered pivot high confirmed at this bar"
        description: "No structural high has been established here."
      - name:        SwingHighConfirmed
        value:       1
        condition:   "centered rolling-max pivot over width 2k+1, published k bars later"
        description: "A structural high is now confirmed — a liquidity reference above the market."

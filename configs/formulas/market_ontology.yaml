  htf_objective_ladder:
    id: SEM-022
    canonical_name: HTF_OBJECTIVE_LADDER
    aliases:
      - objective_ladder
      - multi_timeframe_objective
      - crt_objective_stack
    semantic_category: Structure
    knowledge_status: MATHEMATICALLY_DEFINED
    description: "SEM-009 resolved INDEPENDENTLY at every parent timeframe in a declared ladder (MN1 -> W1 -> D1 -> H4), plus the agreement relation over them. SEM-009 answers 'does THIS parent still have an open objective'; SEM-022 answers 'do ALL of them want the same thing', which is the question the source corpus treats as the precondition for looking at an entry at all."
    observed_behaviour: "UNIMPLEMENTED as a ladder. src/runtime/parent_crt_feed.py resolves SEM-009 at exactly ONE parent timeframe, so the agreement relation has never been computable. The source corpus specifies a six-rung ladder (6M, 3M, MN1, W1, D1, H4); the two coarsest rungs are NOT MEASURABLE on the available XAUUSD corpus, which spans 2024-05-22 to 2026-05-21 and therefore contains 4 six-month and 8 three-month candles. This node declares the full ladder and separately declares which rungs the corpus can evaluate."
    mathematical_definition: "For each timeframe tf in a declared ordered ladder L, build calendar-true parent candles with features.parent_candle.ParentCandleBuilder(tf), drive one config_layer.parent_crt.ParentCRTTrack per tf, and evaluate objective_tf = config_layer.htf_state.resolve_objective(bias_tf, range_tf, last_close_tf). The ladder is ALIGNED at bar t iff, for every tf in L, objective_tf.status is EXISTS and objective_tf.direction is identical across all tf. Any tf reporting NONE, ACHIEVED or INVALIDATED breaks alignment. Alignment is evaluated only on CLOSED parents, so the relation is point-in-time by construction."
    units: enum per rung; boolean for the agreement relation
    formula: "aligned(t) = all(o.status == EXISTS for o in O) and len({o.direction for o in O}) == 1, where O = [resolve_objective(tf) for tf in L]"
    dependencies:
      - SEM-008
      - SEM-009
    required_inputs:
      - parent_candles_per_timeframe
      - parent_crt_bias_per_timeframe
      - parent_range_per_timeframe
      - last_closed_parent_close_per_timeframe
      - declared_ladder_order
    produced_outputs:
      - objective_status_per_timeframe
      - objective_direction_per_timeframe
      - ladder_aligned
    producers: []
    consumers: []
    transitions: []
    validation_rules:
      - "Each rung must be driven by its OWN ParentCandleBuilder and its OWN ParentCRTTrack. Deriving a coarse rung by resampling a finer rung's state is a different quantity and is forbidden."
      - "A rung whose corpus contains fewer than 12 closed parent candles must be reported as UNMEASURABLE and excluded from the agreement relation, never silently treated as agreeing."
      - "Alignment must be evaluated on closed parents only; a rung that consults the in-progress parent introduces lookahead and invalidates every downstream measurement."
      - "This node is an OBSERVATION over parent state. It grants no trade permission by itself: activation remains SEM-009's ObjectiveStatus gate and any bias veto stays a veto."
    confidence: Likely
    evidence:
      - "SujanTraderCrtExpPart2.txt:1093-1110 enumerates the six-rung ladder (6M, 3M, Monthly, Weekly, Daily) and adds the 'Objective achieved?' question per rung."
      - "SujanTraderCrtExpPart2.txt:1160-1174 PHASE 2 requires all four macro rungs to agree and skips the trade when one disagrees."
      - "SujanTraderCrtExpPart2.txt:383-388 assigns ladder ROLES: Weekly macro objective, Daily execution environment, 4H active candle, 1H timing."
      - "src/config_layer/htf_state.py resolve_objective is the per-rung primitive and already exists; only the stacking is missing."
      - "data/mt5/XAUUSD_M15.csv spans 2024-05-22 01:00:00 to 2026-05-21 23:45:00 (47,275 bars), which bounds the 6M rung at 4 candles and the 3M rung at 8 - measured 2026-08-22, not estimated."
    origin: "Registered 2026-08-22 during the SujanTrader corpus trace, BEFORE the implementing package src/research/sujan_crt/ exists, per CLAUDE.md 6.6. The ladder is the generalisation of the already-shipped single-timeframe SEM-009."
    status: registered
    version: 1
    owner: research-sujan-crt
    traceability:
      manifest: UNKNOWN
      implements: src/research/sujan_crt/ladder.py
    notes: "PROVENANCE (F-077 discipline): the source docs are dialogue transcripts in which the ladder and the agreement rule are proposed by the AI interlocutor, not authored by the trader. They are the TRIGGER for this node, not an authority for it. Grants no G001 and no production authority."
structural_predicates:

  swept_boundary:
    id:                     SP-001
    canonical_name:         STRUCTURAL_PREDICATE__SWEPT_BOUNDARY
    aliases:                ["detect_sweep geometry", "boundary-cross-then-close-back-inside", "liquidity sweep test"]
    semantic_category:      Geometry
    knowledge_status:       FORMULA_DERIVED
    description:            "Did this bar pierce a reference boundary and close back on the origin side? The elementary liquidity-sweep test: price took out a level, then failed to hold beyond it."
    observed_behaviour:     "RESOLVED 2026-08-19 (SK-1): ONE implementation — structure/predicates.py swept_high/swept_low. CORRECTED FROM the 2026-08-18 registration, which said 6 sites and used the word verbatim: the re-audit found NINE executable copies (the first pass matched only h_ref-named references) — crt_engine_v2.py:882 (RangeDetector.detect_sweep, the former authority), crt_engine_v2.py:2944 and :3039 (two telemetry re-derivations in process_candle, MISSED in pass 1), parent_crt.py:154, crt_state_resolver.py:1083, visual_crt/geometry.py:93+101, weekly_range.py:185, weekly_range.py:160, and scripts/research/crt_range_rebuild_probe.py:70 (MISSED in pass 1). All nine now route through the kernel; feature_math_lint policies the name so a tenth cannot be added silently."
    mathematical_definition: "swept_high := high > h_ref AND close < h_ref;  swept_low := low < l_ref AND close > l_ref. Direction convention: a swept HIGH implies SHORT (buy-side liquidity taken), a swept LOW implies LONG. sweep_price is the bar's own piercing extreme (high on a high sweep, low on a low sweep) — never the reference level."
    units:                  "boolean (+ a price-unit sweep_price and a Direction on hit)"
    formula:                "swept_high = high > h_ref and close < h_ref; swept_low = low < l_ref and close > l_ref"
    # ── RC-2 (2026-08-19): the MEANING as inspectable data. `formula` above stays the human
    # string; THIS block is the authority a machine checks. Closed operator vocabulary — no
    # arithmetic, no calls, no literals, no names outside `inputs`. NEVER eval'd: the evaluator
    # (features.registry.predicate_registry) is a generic tree-walk over a frozen operator set.
    # `structure.predicates` is a CONFORMING IMPLEMENTATION of this block, not the authority —
    # tests/test_predicate_definition_binding.py fails if the two ever disagree.
    definition:
      schema: predicate_definition/v1
      inputs: [high, low, close, h_ref, l_ref]
      clauses:
        swept_high:
          op: and
          args:
            - {op: gt, left: high,  right: h_ref}
            - {op: lt, left: close, right: h_ref}
        swept_low:
          op: and
          args:
            - {op: lt, left: low,   right: l_ref}
            - {op: gt, left: close, right: l_ref}
      emit:
        schema: predicate_emit/v1
        hit:
          op: or
          args: [swept_high, swept_low]
        select_enum:
          direction:
            swept_high: SHORT     # buy-side liquidity taken -> SHORT
            swept_low:  LONG      # sell-side taken -> LONG
        select_input:
          sweep_price:
            swept_high: high      # the bar's own piercing extreme, never the reference level
            swept_low:  low
    dependencies:           [high, low, close]
    required_inputs:        ["bar OHLC", "a RangeFounding exposing h_ref / l_ref"]
    produced_outputs:       ["SweepEvent(direction, price, index)"]
    producers:              ["src/structure/predicates.py"]
    consumers_migrated:     ["src/config_layer/crt_engine_v2.py (3 sites)", "src/config_layer/parent_crt.py", "src/features/crt_state_resolver.py", "src/research/visual_crt/geometry.py", "src/research/weekly_sweep/weekly_range.py (2 sites)", "scripts/research/crt_range_rebuild_probe.py"]
    consumers:              [SP-002, "CRTState.SWEEP entry", "CRTState.MANIPULATION_C2 entry"]
    transitions:            ["RANGE -> SWEEP", "RANGE_C1 -> MANIPULATION_C2"]
    validation_rules:
      - "The reference boundary is supplied by a founding; the predicate NEVER founds its own range."
      - "A level is only sweepable once it is already formed (formed_at_index < bar index) — visual_crt/geometry.py:90 enforces this for pools; range-based callers get it structurally."
      - "Thresholds/parameters carry no defaults at the call boundary (F-056 config-illusion class)."
    confidence:             Certain
    evidence:               ["src/config_layer/crt_engine_v2.py:882", "src/config_layer/parent_crt.py:154", "src/research/weekly_sweep/weekly_range.py:185", "src/research/visual_crt/geometry.py:93", "F-074", "docs/governance/crt_object_relations_closure.md (CT-009: detect_sweep reads active_range high/low only)"]
    origin:                 "SK-0 (CH-structural-kernel, 2026-08-18) — census of duplicated CRT geometry."
    status:                 registered
    version:                2
    owner:                  structural-kernel-program
    traceability:           "SK-1 SHIPPED 2026-08-19: src/structure/predicates.py is the single implementation; all 9 sites routed. Proof: tests/test_structure_predicates.py compares the kernel against reference implementations transcribed verbatim from the pre-migration source over the pinned slice (XAUUSD M15 2026-03, 2,020 bars) with a non-vacuity guard (121 high-side / 128 low-side), plus adversarial boundary scalars; and the real RangeDetector.detect_sweep object was differentially verified over 2,006 bars / 246 sweeps with 0 divergences. PRODUCTION_CERTIFIED requires measured G001 (§6.5) and is NOT claimed here."
    notes:                  "Founding independence is preserved on purpose: WHAT boundary counts as liquidity (M15 structural range / parent candle / weekly calendar range / chart-visible pool) stays pluggable — that is what made F-042 and F-081 legitimately new ontologies. Only the arithmetic is unified. DISTINCT QUANTITY WARNING: FM-058 liquidity_sweep / FM-059 sweep_detected / FM-060 double_sweep are NOT this node. They reference a swing pivot (last_swing_high_price.shift(1)) and use an INCLUSIVE boundary (close <= ref) where SP-001 references a founding range and is STRICT (close < ref); they produce int8 feature-vector slots, not SweepEvents. market_crt_states.yaml thresholds.sweep_geometry already exposes the two as selectable alternatives (htf_range | pipeline_swing). Routing the FM-058 family through this kernel would silently redefine a registered feature and move the 48-dim vector — do not."

  directional_impulse:
    id:                     SP-002
    canonical_name:         STRUCTURAL_PREDICATE__DIRECTIONAL_IMPULSE
    aliases:                ["F-074 directional displacement contract", "displacement direction gate", "_directional_impulse_confirmed"]
    semantic_category:      Geometry
    knowledge_status:       FORMULA_DERIVED
    description:            "Did this bar travel AWAY from the swept side with a bodied move that cleared the swept level? The F-074 contract: unsigned energy alone is not displacement."
    observed_behaviour:     "PARTIALLY RESOLVED 2026-08-19 (SK-1): parent_crt.py:162 and visual_crt/geometry.py (gates 3+4) now route through structure/predicates.py:directional_impulse. crt_engine_v2.try_sweep_to_displacement is NOT yet migrated — its direction check is interleaved with magnitude gates and state mutation, so it needs its own parity turn. CLARIFICATION vs the 2026-08-18 registration: the three sites were never IDENTICAL — only the DIRECTION contract is shared; parent_crt applies no magnitude gate at all, and visual_crt applies four. F-074 landed 2026-08-13 and had to be HAND-PROPAGATED to all three; that manual broadcast is the failure mode this node exists to end."
    mathematical_definition: "LONG (a low was swept): close > open AND close > sweep_price.  SHORT (a high was swept): close < open AND close < sweep_price. Direction is INHERITED from the sweep and never re-derived from the impulse bar."
    units:                  "boolean"
    formula:                "long: close > open and close > sweep_price; short: close < open and close < sweep_price"
    # ── RC-2 (2026-08-19): meaning as data (see SP-001 note). `is_long` is a BOOLEAN INPUT
    # inherited from the SP-001 sweep — never re-derived from this bar (that is the F-074 defect).
    # Selecting on a boolean input keeps v1 free of enum literals inside the tree.
    # Magnitude gates (body_ratio_min / atr_min_displacement / atr_multiplier_min /
    # max_sweep_age_candles) are DELIBERATELY ABSENT: they are HOW-policy applied by the caller.
    # Encoding them here would silently unify parent_crt (core only) with visual_crt (four gates).
    definition:
      schema: predicate_definition/v1
      inputs: [open, close, sweep_price, is_long]
      clauses:
        long_impulse:
          op: and
          args:
            - {op: gt, left: close, right: open}
            - {op: gt, left: close, right: sweep_price}
        short_impulse:
          op: and
          args:
            - {op: lt, left: close, right: open}
            - {op: lt, left: close, right: sweep_price}
      emit:
        schema: predicate_emit/v1
        hit:
          op: or
          args:
            - {op: and, args: [is_long, long_impulse]}
            - {op: and, args: [{op: not, arg: is_long}, short_impulse]}
    dependencies:           [SP-001, open, close]
    required_inputs:        ["bar OHLC", "a SweepEvent from SP-001 (direction + sweep_price)"]
    produced_outputs:       ["DisplacementEvent"]
    producers:              ["src/structure/predicates.py"]
    consumers_migrated:     ["src/config_layer/parent_crt.py", "src/research/visual_crt/geometry.py"]
    consumers_pending:      ["src/config_layer/crt_engine_v2.py (try_sweep_to_displacement — direction check interleaved with magnitude gates + state mutation; separate parity turn)"]
    consumers:              ["CRTState.DISPLACEMENT entry", "CRTState.DISTRIBUTION_C3 entry"]
    transitions:            ["SWEEP -> DISPLACEMENT", "MANIPULATION_C2 -> DISTRIBUTION_C3"]
    validation_rules:
      - "Direction is inherited from SP-001, never recomputed — re-deriving it from the impulse bar reintroduces the unsigned-energy defect F-074 closed."
      - "Magnitude gates (body_ratio_min, atr_min_displacement, atr_multiplier_min) are SEPARATE parameters applied by the caller; they are not part of the direction contract."
      - "ATR passed to any magnitude gate MUST be price-unit absolute ATR (FM-074 atr_absolute), never the close-relative canonical atr (FM-041) — passing the relative form silently shrinks every threshold (the F-072 defect class)."
    confidence:             Certain
    evidence:               ["F-074", "src/config_layer/crt_engine_v2.py:1083", "src/config_layer/parent_crt.py:162", "src/research/visual_crt/geometry.py:162", "F-072", "FM-074"]
    origin:                 "SK-0 (CH-structural-kernel, 2026-08-18) — census of duplicated CRT geometry; F-074 user-authorized 2026-08-13."
    status:                 registered
    version:                2
    owner:                  structural-kernel-program
    traceability:           "SK-1 (2026-08-19) shipped the kernel and migrated 2 of 3 sites. The F-072 atr_absolute warning above is REHOMED here from visual_crt/geometry.py docstring — do not delete it from the source without confirming it survives in this node (§6.1: artifacts are recoverable, meaning is not)."

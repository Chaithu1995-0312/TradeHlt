# Deterministic normalized metrics. Canonical formulas transcribed VERBATIM from
# feature_pipeline.py (the training-truth source); the YAML must equal the pipeline math.
# `impl` -> src/features/derived_math.py scalar callable. `source_of_truth` is a temporary
# provenance pointer kept until the pipeline routes through the registry.
derived_metrics:
  disp_strength:
    id:          FM-020
    version:     1
    lifecycle:   parity_verified
    formula:     "clip(body_size / (atr * close), <feature_pipeline.disp_strength_clip_low>, <feature_pipeline.disp_strength_clip_high>) if atr>0 and close>0 else nan  # defaults 0.0, 3.0"
    config_keys: [feature_pipeline.disp_strength_clip_low, feature_pipeline.disp_strength_clip_high]
    impl:        derived_math.disp_strength
    depends_on:  [body_size, atr, close]
    clip:        [0.0, 3.0]
    active:      true
    source_of_truth: feature_pipeline.py:950     # CORRECTED 2026-07-24 (was :565, stale)
    note: >
      Body size normalized by ATR-scaled price. The former naming collision with scoring_engine.py's
      local `disp_strength = move/atr` was adjudicated 2026-07-11 (GD-004 closure): a DISTINCT third
      quantity, registered as FM-029 disp_strength_atr_rescale. This entry is the FEATURE-VECTOR
      definition (CANONICAL_FEATURES).
    taxonomy:
      category:        Volatility
      knowledge_class: Derived
    semantics:
      description:   "Candle body measured in units of ATR-scaled price, clipped to [0, 3]."
      why_it_exists: "Answers whether a move is large FOR CURRENT CONDITIONS. A 50-point body means nothing until it is compared to prevailing volatility; this is the displacement test the CRT state machine gates on."
      interpretation:
        high: "Displacement — the bar moved far beyond what recent volatility would predict."
        low:  "The move is unremarkable for this volatility regime; no displacement."
    states: []
    lineage:
      derivation_depth: 3
      produced_by:      feature_pipeline.compute_canonical_temporal_features
      consumed_by:      [UNKNOWN]
      vector_key:       disp_strength
      vector_index:     33
  retest_depth:
    id:          FM-021
    version:     1
    lifecycle:   parity_verified
    formula:     "clip(abs(close - ema_fast) / (atr * close), <feature_pipeline.retest_depth_clip_low>, <feature_pipeline.retest_depth_clip_high>) if retest_flag==1 and atr>0 and close>0 else 0.0  # defaults 0.0, 1.0"
    config_keys: [feature_pipeline.retest_depth_clip_low, feature_pipeline.retest_depth_clip_high]
    impl:        derived_math.retest_depth
    depends_on:  [close, ema_fast, atr, retest_flag]
    clip:        [0.0, 1.0]
    active:      true
    source_of_truth: feature_pipeline.py:969     # CORRECTED 2026-07-24 (was :579, stale)
    note: >
      Distance from close to the fast EMA (ATR-scaled). GATE MADE EXPLICIT 2026-07-24: the emitted
      value is 0.0 on every bar where retest_flag != 1 — which is MOST bars (measured zero_rate
      42.31% on the XAUUSD freeze corpus). Until now that gate lived only in this note while the
      `formula` described the ungated math, so the declaration disagreed with the emitted column on
      the majority of rows. `retest_flag` (FM-061) is now a declared dependency. The scalar
      derived_math.retest_depth is UNCHANGED and remains correct for the gated branch — the pipeline
      applies the gate via np.where at feature_pipeline.py:969.
    taxonomy:
      category:        Retest
      knowledge_class: Derived
    semantics:
      description:   "How far price sits from the fast EMA, in ATR-scaled units, on bars where a retest is active; 0.0 otherwise."
      why_it_exists: "After a liquidity sweep, the question is whether price returned to a fair-value reference. This measures the depth of that return in volatility-normalized terms."
      interpretation:
        high: "Price is far from the reference — a shallow or failed retest."
        low:  "Price has returned tightly to the reference — a deep retest. NOTE 0.0 is ambiguous: it means EITHER a perfect retest OR no retest at all; disambiguate with retest_flag."
    states: []
    lineage:
      derivation_depth: 4
      produced_by:      feature_pipeline.compute_canonical_temporal_features
      consumed_by:      [UNKNOWN]
      vector_key:       retest_depth
      vector_index:     34
  ema_spread:
    id:          FM-022
    version:     1
    lifecycle:   parity_verified
    formula:     "(ema_fast - ema_slow) / atr if atr>0 else nan   # emitted only when <feature_pipeline.normalization_basis> == 'atr_relative' (the default); 'atr_absolute' selects FM-030 instead"
    impl:        derived_math.ema_spread
    depends_on:  [ema_fast, ema_slow, atr]
    active:      true
    source_of_truth: feature_pipeline.py:869     # CORRECTED 2026-07-24 (was :497, stale)
    # ── B0/B1 semantic-migration governance (2026-07-12) — LEGACY identity, DO NOT silently change ──
    semantic_version:    "1.0-legacy-price-scaled"
    units:               price_scaled            # NOT dimensionless: absolute-price numerator / dimensionless atr
    normalization_basis: atr_relative            # denominator `atr` is close-relative (atr_14_raw/close)
    temporal_semantics:  same_bar
    known_issue: >
      DIMENSIONAL MIX (B1/F1, fresh-reproduced 2026-07-12): numerator (ema_fast-ema_slow) is absolute
      price; denominator `atr` is dimensionless (close-relative) -> the quantity SCALES with price level
      (probe: median ratio 100x at 100x price). Corrected identity = FM-030 ema_spread_atr.
      DECISION-SURFACE COST MEASURED 2026-07-22 (F-061): because the emitted magnitude equals the
      corrected value times `close`, the engine_runner.dual_engine thresholds tuned for a
      dimensionless O(1) quantity (trend_strength_threshold 0.15 / momentum_threshold 0.3) are
      INERT on crypto and binding only on FX. On BNBUSDT/BTCUSDT (median |ema_spread| 320 / 38,110
      vs 0.47 corrected) detect_regime returns "trend" on 98.9%/99.9% of bars and breakout_engine's
      score is pinned at 1.0 on ~100%; under the corrected identity both discriminate (52.7% trend,
      6.8% pinned) and are instrument-scale invariant. So this is no longer a representational
      defect only -- it degrades live decisions. Correction is now REACHABLE (config-gated, inactive).
    replacement_identity: FM-030                  # registered below as a first-class inactive identity
    migration_class:      FORMULA_CORRECTION_CONFIG_GATED   # was FORMULA_CORRECTION_DEFERRED until 2026-07-22
    config_key:           feature_pipeline.normalization_basis   # "atr_relative" selects THIS identity (default)
    artifact_compatibility: LEGACY_BOUND          # active code (engine_runner regime/breakout, heuristic
                                                  # gaussian) + inactive rr_model/gaussian-38 artifacts bind
                                                  # to this math; correction requires retrain + recalibration.
    taxonomy:
      category:        Trend
      knowledge_class: Derived
    semantics:
      description:   "Separation between the fast and slow EMA, divided by close-relative ATR."
      why_it_exists: "Measures how strongly the short-term trend has pulled away from the longer-term trend, intended to be normalized for volatility."
      interpretation:
        high: "Fast EMA far above slow — strong established uptrend."
        low:  "Large negative — strong established downtrend; near zero means the EMAs are entangled (no trend)."
        caveat: "READ THIS BEFORE USING THE VALUE: the emitted magnitude scales with PRICE LEVEL (see known_issue / F-061). Cross-instrument or cross-epoch comparison of raw values is invalid under this legacy identity."
    states: []
    lineage:
      derivation_depth: 3
      produced_by:      feature_pipeline.compute_canonical_ema_features
      consumed_by:      [UNKNOWN]
      vector_key:       ema_spread
      vector_index:     9
  momentum_score:
    id:          FM-023
    version:     1
    lifecycle:   parity_verified
    formula:     "close_delta / atr if atr>0 else nan   # close_delta = close.diff(); emitted only when <feature_pipeline.normalization_basis> == 'atr_relative' (the default); 'atr_absolute' selects FM-031 instead"
    impl:        derived_math.momentum_score
    depends_on:  [close_delta, atr]

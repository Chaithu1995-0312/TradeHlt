    transitions:            ["IDLE -> BULK_FOUND -> WAIT_FOR_MANIPULATION -> MANIPULATION_DETECTED -> ALERT -> WAIT_FOR_MANIPULATION"]
    validation_rules:       ["no runtime import of crt_engine_v2 or parent_crt or visual_crt or sujan_crt or weekly_sweep or backtest_v2", "the parent candle can never manipulate its own range", "purge arithmetic is imported from SP-001, never re-derived locally", "closes-back-inside is the FULLY-INSIDE reading: range_low < close < range_high", "no ATR, volatility, percentage, body-ratio, displacement or magnitude threshold exists in this object", "the founding is never chosen by this node: parents arrive either externally or as a bridge-CONFIRMED subset of the SEM-034 shortlist", "UNK-007 stays OPEN; SEM-034 is UNVALIDATED and confers no identity", "not CRTState, not C1/C2/C3, not MANIPULATION_C2 (F-077)", "not SEM-031 and not a SEM-031 retune", "no entry, stop, target, outcome, forward_walk, cost model, control or split", "the alert count is an observation, never a result", "no MC-*, no F-*, no G001, no production authority"]
    confidence:             Certain
    evidence:               ["docs/research/sujan_manipulation_object.md", "docs/research/sujan_identity_drift_log.md", "src/research/sujan_manipulation/geometry.py", "tests/research/test_sujan_manipulation.py"]
    origin:                 "User (human bridge) 2026-08-28: SUJAN_MANIPULATION_RESEARCH_PHASE_1 specification. Supplies an answer to the Record-3 UNKNOWN 'what makes a sweep count' (Q10) for THIS construction only. Vocabulary import of 'manipulation' against charter :205 / F-077 approved and recorded in drift log Record 5."
    status:                 characterized
    version:                2
    owner:                  research-sujan-manipulation
    traceability:           "docs/research/sujan_manipulation_object.md <- src/research/sujan_manipulation/ <- SEM-033. Founding at UNK-007, stood in for by the SEM-034 UNVALIDATED proxy. No MC-* exists."
    notes:                  "DETECTION ONLY. Grants no G001, no production authority, no economic claim. Registering this node does not certify that the object is Sujan's - identity certification is a human-bridge status the coding layer cannot self-award. The honest sentence remains: we detected SEM-033, an object the human bridge specified."
    epistemic:
      known_invariants:
        - "The purge arithmetic is SP-001 verbatim; the object adds exactly one conjunct per side (the opposite boundary) to make 'closes back inside the range' literal."
        - "Under the fully-inside reading, a candle that purges the high and closes below the range low is NOT an event, even though bare SP-001 calls it a sweep."

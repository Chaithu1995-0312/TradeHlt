    knowledge_status:       CHARACTERIZED
    description:            "The user-accepted 2026-08-27 reading of the SujanTrader transcripts as a nested conjunction of vetoes, not a 100-point score. Anticipate unfinished HTF objective; confirm activation (raid-and-reclaim + F-074 displacement + return); do not chase when Weekly and Daily are both EXPANSION; location at a closed-parent extreme or midpoint; structural RR floor is remaining-path/lateness (SEM-025 arithmetic). RESEARCH object under src/research/sujan_crt/. Not ParentCRT C1/C2/C3 (F-077). Not SEM-022's ParentCRTTrack ladder. Not SEM-023 admission. Not MC-SUJAN (unsealed)."

    observed_behaviour:     "OBSERVATION: implemented at 2 sites as of 2026-08-18 — crt_engine_v2.py:1582 (try_expansion_to_retest, adaptive ceiling retest_atr_depth_fraction with floor retest_min_depth_atr_fraction) and visual_crt/retest.py:49 (detect_pool_retest). Fewer copies than SP-001/SP-002 because weekly_sweep and parent_crt have no retest stage. The two implementations use different reference anchors (engine: expansion/displacement geometry; visual: the swept pool), which is a FOUNDING difference, not an arithmetic one."

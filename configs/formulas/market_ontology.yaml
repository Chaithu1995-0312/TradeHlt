      vector_index:     []

# ═══════════════════════════════════════════════════════════════════════════
# ROLLING INDICATORS — first-class WINDOWED identities (bottom-up cert program, 2026-07-12)
# ═══════════════════════════════════════════════════════════════════════════
# Promoted from the descriptive `indicator_identities` freeze to FIRST-CLASS registered entries
# (FM-040..FM-046). These are WINDOWED (no scalar float->float form), so `computation_class: rolling`:
#   * they ARE iterated by the registry/lineage (build_lineage_graph, validate_registry) — first-class
#     DAG nodes with `depends_on`, so atr/ema_fast/ema_slow are no longer base_inputs leaves;
#   * validate_registry EXEMPTS them from the scalar-FORMULA_REGISTRY impl-resolution (there is no
#     scalar callable) — the `impl` names the pipeline computation authority;
#   * certified by a SERIES-level parity + PIT-prefix probe (feature_dag_rolling_certification.py),
#     NOT the scalar derived_math parity battery.
# Math is byte-identical to the existing pipeline (feature_pipeline.py) — a registration, not a change.
rolling_indicators:
  true_range:
    id:        FM-040
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "max(high - low, abs(high - prev_close), abs(low - prev_close))"
    impl:      feature_pipeline.compute_indicators        # df['true_range']; no scalar form (uses prev_close)
    depends_on: [high, low, close]
    lookback:  1
    units:     price_absolute
    active:    true
    taxonomy:
      category:        Volatility
      knowledge_class: Primitive
    semantics:
      description:   "Wilder's true range: the greatest of this bar's range and its two gap-inclusive extensions against the previous close."
      why_it_exists: "A bar's own high-low understates movement when the market gapped. True range restores the real distance travelled, making it the honest input to every volatility average."
      interpretation:
        high: "Large real movement including any gap from the prior close."
        low:  "Quiet bar with no gap."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      feature_pipeline.compute_indicators
      consumed_by:      [UNKNOWN]
      vector_key:       []
      vector_index:     []
  atr:
    id:        FM-041
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "SMA(<feature_pipeline.atr_period>) of true_range, close-relative: atr_14_raw / close (atr_14_raw = true_range.rolling(<feature_pipeline.atr_period>).mean())  # default 14"
    impl:      feature_pipeline.compute_canonical_volatility_features
    depends_on: [true_range]
    smoothing_method: SMA
    lookback:  14
    config_key: feature_pipeline.atr_period
    normalization_basis: close
    units:     dimensionless
    active:    true
    supersedes_descriptive: IND-001        # was descriptive-only in indicator_identities
    taxonomy:
      category:        Volatility
      knowledge_class: Statistical
    semantics:
      description:   "Simple moving average of true_range over the configured period, divided by close (close-relative, dimensionless)."
      why_it_exists: "The system's unit of volatility. Nearly every normalized feature divides by this, so it is what makes thresholds portable across instruments."
      interpretation:
        high: "Volatile regime — the same point move means less here."
        low:  "Quiet regime — small absolute moves are significant."
        caveat: "SMA-smoothed, NOT Wilder's recursive EWMA (measured maxdiff 0.118 vs Wilder). And close-RELATIVE: multiply by close to recover absolute-price ATR."
    states: []
    lineage:
      derivation_depth: 2
      produced_by:      feature_pipeline.compute_canonical_volatility_features
      consumed_by:      [UNKNOWN]
      vector_key:       atr
      vector_index:     13
  rsi_14:
    id:        FM-042
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "100 - 100/(1+RS); RS = SMA(<feature_pipeline.rsi_period>) gain / (SMA(<feature_pipeline.rsi_period>) loss + 1e-9); clipped [0,100]  # default period 14"
    impl:      feature_pipeline.compute_indicators
    depends_on: [close]
    smoothing_method: SMA
    lookback:  14
    config_key: feature_pipeline.rsi_period
    bounds:    "[0, 100]"
    active:    true
    supersedes_descriptive: IND-002
    taxonomy:
      category:        Momentum
      knowledge_class: Statistical
    semantics:
      description:   "Relative Strength Index on a [0, 100] scale, using SMA-averaged gains and losses."
      why_it_exists: "Bounded momentum oscillator — expresses whether recent bars have been dominated by gains or losses without reference to price level."
      interpretation:
        high: "Gains dominate the window (>70 conventionally 'overbought')."
        low:  "Losses dominate (<30 conventionally 'oversold'); 50 means balance."
        caveat: "SMA gain/loss averaging, NOT Wilder's EWMA (measured maxdiff 35.8 vs Wilder). The RS ratio form is Wilder's; the averaging is not."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      feature_pipeline.compute_indicators
      consumed_by:      [UNKNOWN]
      vector_key:       rsi_14
      vector_index:     15
  ema_fast:
    id:        FM-043
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "close.ewm(span=<feature_pipeline.ema_fast_span>, adjust=False).mean()  # default 9"
    impl:      feature_pipeline.compute_canonical_ema_features
    depends_on: [close]
    lookback:  9
    config_key: feature_pipeline.ema_fast_span
    active:    true
    taxonomy:
      category:        Trend
      knowledge_class: Statistical
    semantics:
      description:   "Exponentially weighted moving average of close over the fast span."
      why_it_exists: "The short-term fair-value reference. Retests are measured against it, and its relation to ema_slow defines trend_bias."
      interpretation:
        high: "Above price — recent closes have been falling toward it."
        low:  "Below price — recent closes have been rising away from it."
        caveat: "UNRELATED to crt_engine.ema_fast (a different pair, spans 2/5, soft-confirmation logic). Same bare name, different module — do not conflate."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      feature_pipeline.compute_canonical_ema_features
      consumed_by:      [UNKNOWN]
      vector_key:       ema_fast
      vector_index:     7
  ema_slow:
    id:        FM-044
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "close.ewm(span=<feature_pipeline.ema_slow_span>, adjust=False).mean()  # default 21"
    impl:      feature_pipeline.compute_canonical_ema_features
    depends_on: [close]
    lookback:  21
    config_key: feature_pipeline.ema_slow_span
    active:    true
    taxonomy:
      category:        Trend
      knowledge_class: Statistical
    semantics:
      description:   "Exponentially weighted moving average of close over the slow span."
      why_it_exists: "The longer-term trend reference. Its separation from ema_fast is the raw material for ema_spread and trend_bias."
      interpretation:
        high: "Above price — the longer trend is still pointing down relative to current price."
        low:  "Below price — the longer trend supports current price."
        caveat: "UNRELATED to crt_engine.ema_slow (different pair, span 5). Same bare name, different module."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      feature_pipeline.compute_canonical_ema_features
      consumed_by:      [UNKNOWN]
      vector_key:       ema_slow
      vector_index:     8
  swing_high:
    id:        FM-045
    version:   1
    lifecycle: registered
    computation_class: rolling_stateful
    formula:   "causal DELAYED publication of a centered rolling-max swing high over width 2k+1 (FC1-A: math at t, published with k-bar delay, available_at = t+k); k = <feature_pipeline.swing_window>  # default 2"
    impl:      feature_pipeline.compute_structure_liquidity
    depends_on: [high]
    lookback:  2
    config_key: feature_pipeline.swing_window
    active:    true
    note: >
      TUNABLE STRUCTURAL, highest blast radius in the layer. k sets BOTH the pivot width (2k+1)
      AND the FC1-A causal publication delay -- i.e. WHEN this feature becomes knowable. Changing
      it shifts the PIT contract and invalidates artifacts certified against the old value
      (re-certification, not a re-run). Resolve it ONLY via
      features.feature_pipeline.resolve_swing_window(); never re-declare the literal.
    taxonomy:
      category:        MarketStructure
      knowledge_class: Structural
    semantics:
      description:   "Flag marking that a local pivot high was confirmed, published k bars after the pivot itself."
      why_it_exists: "Swing highs are where resting buy-side liquidity accumulates. Identifying them is the precondition for detecting sweeps, breaks of structure, and higher highs."
      interpretation:
        high: "A pivot high has been confirmed as of this bar."
        low:  "No pivot confirmation on this bar."
        caveat: "PIT SEMANTICS: the pivot occurred k bars ago; this flag is its CONFIRMATION, delayed so no future information is used. The value is knowable at t, the event was at t-k."
    states:
      - name:        NoSwingHigh
        value:       0
        condition:   "no centered pivot high confirmed at this bar"
        description: "No structural high has been established here."
      - name:        SwingHighConfirmed
        value:       1
        condition:   "centered rolling-max pivot over width 2k+1, published k bars later"
        description: "A structural high is now confirmed — a liquidity reference above the market."
    lineage:
      derivation_depth: 1
      produced_by:      feature_pipeline.compute_structure_liquidity
      consumed_by:      [UNKNOWN]
      vector_key:       swing_high
      vector_index:     23
  swing_low:
    id:        FM-046
    version:   1
    lifecycle: registered
    computation_class: rolling_stateful
    formula:   "causal DELAYED publication of a centered rolling-min swing low over width 2k+1 (FC1-A); k = <feature_pipeline.swing_window>  # default 2"
    impl:      feature_pipeline.compute_structure_liquidity
    depends_on: [low]
    lookback:  2
    config_key: feature_pipeline.swing_window
    active:    true
    taxonomy:
      category:        MarketStructure
      knowledge_class: Structural
    semantics:
      description:   "Flag marking that a local pivot low was confirmed, published k bars after the pivot itself."
      why_it_exists: "Swing lows are where resting sell-side liquidity accumulates — the mirror of swing_high and the other half of the structural reference pair."
      interpretation:
        high: "A pivot low has been confirmed as of this bar."
        low:  "No pivot confirmation on this bar."
        caveat: "Same PIT delay as swing_high: the event was at t-k, the confirmation is at t."
    states:
      - name:        NoSwingLow
        value:       0
        condition:   "no centered pivot low confirmed at this bar"
        description: "No structural low has been established here."
      - name:        SwingLowConfirmed
        value:       1
        condition:   "centered rolling-min pivot over width 2k+1, published k bars later"
        description: "A structural low is now confirmed — a liquidity reference below the market."
    lineage:
      derivation_depth: 1
      produced_by:      feature_pipeline.compute_structure_liquidity
      consumed_by:      [UNKNOWN]
      vector_key:       swing_low
      vector_index:     24
  # ── M16-WU-ONTOLOGY-REGISTRATION (partial), 2026-07-19 ────────────────────────
  # Registration ONLY — no formula change. These identities were already certified
  # PROMOTED_PRODUCTION by the L0-L6 DAG programme (census 2026-07-14) but carried
  # ONTOLOGY_REGISTRATION_DEBT: their executable identity was pipeline-defined only.
  # Registering them puts them inside feature_math_lint's watch-list (_registered_names()
  # is built from this ontology), which is what enables re-derivation enforcement.
  macd_line:
    id:        FM-047
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "close.ewm(span=<feature_pipeline.macd_fast>, adjust=False).mean() - close.ewm(span=<feature_pipeline.macd_slow>, adjust=False).mean()  # defaults 12, 26"
    impl:      feature_pipeline.compute_indicators
    depends_on: [close]
    smoothing_method: EWM
    lookback:  26
    config_keys: [feature_pipeline.macd_fast, feature_pipeline.macd_slow]
    # `lookback` mirrors the LONGER span (the effective warmup); names which key it tracks so the
    # ontology<->config parity test can assert it rather than guess among the plural keys.
    lookback_config_key: feature_pipeline.macd_slow
    active:    true
    taxonomy:
      category:        Momentum
      knowledge_class: Statistical
    semantics:
      description:   "Difference between a fast and a slow EWM of close."
      why_it_exists: "Classic convergence/divergence momentum: expresses whether short-term average price is pulling away from long-term average price."
      interpretation:
        high: "Short-term average above long-term — upward momentum."
        low:  "Short-term below long-term — downward momentum; zero is the crossover."
        caveat: "Absolute price units, so magnitudes are NOT comparable across instruments or price epochs."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      feature_pipeline.compute_indicators
      consumed_by:      [UNKNOWN]
      vector_key:       macd_line
      vector_index:     16
  macd_signal:
    id:        FM-048
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "macd_line.ewm(span=<feature_pipeline.macd_signal>, adjust=False).mean()  # default 9"
    impl:      feature_pipeline.compute_indicators
    depends_on: [macd_line]
    smoothing_method: EWM
    lookback:  9
    config_key: feature_pipeline.macd_signal
    active:    true
    taxonomy:
      category:        Momentum
      knowledge_class: Statistical
    semantics:
      description:   "EWM smoothing of macd_line over the signal span."
      why_it_exists: "A slower reference for macd_line; their difference (macd_hist_raw) is where the actual signal lives."
      interpretation:
        high: "Smoothed momentum is positive."
        low:  "Smoothed momentum is negative."
        caveat: "Same absolute-price-unit caveat as macd_line."
    states: []
    lineage:
      derivation_depth: 2
      produced_by:      feature_pipeline.compute_indicators
      consumed_by:      [UNKNOWN]
      vector_key:       macd_signal
      vector_index:     17
  macd_hist_raw:
    id:        FM-049
    version:   2                 # v2 (2026-07-22): split; this entry is now the RAW difference only
    lifecycle: registered
    computation_class: rolling
    formula:   "macd_line - macd_signal"
    impl:      feature_pipeline.compute_indicators
    depends_on: [macd_line, macd_signal]
    active:    true
    vector_key: macd_hist_raw    # canonical index 18 (schema v4.0)
    note: >
      SPLIT 2026-07-22 (SCHEMA-V4-VECTOR-MIGRATION). v1 of this entry carried BOTH quantities under
      one name and warned: "Emitted value is Z-SCORED. compute_normalization overwrites macd_hist in
      place ... Easy to misread from the formula line alone." That warning is now unnecessary: the
      formula above is exactly what this feature emits, and the z-score moved to FM-053
      `macd_hist_z`. The v3.0 vector key `macd_hist` carried the Z-SCORED value, so historical
      records alias to FM-053, NOT to this entry (features/feature_schema.py SCHEMA_V3_ALIASES).
    taxonomy:
      category:        Momentum
      knowledge_class: Statistical
    semantics:
      description:   "macd_line minus macd_signal — the raw MACD histogram, in absolute price units."
      why_it_exists: "Acceleration of momentum: whether the momentum measure is itself pulling away from its own average."
      interpretation:
        high: "Momentum is accelerating upward."
        low:  "Momentum is accelerating downward; zero marks the signal-line crossover."
        caveat: "This is the RAW difference. Schema v3.0 emitted the Z-SCORED value under the name `macd_hist`; that quantity is now FM-053. Historical records alias to FM-053, not here."
    states: []
    lineage:
      derivation_depth: 3
      produced_by:      feature_pipeline.compute_indicators
      consumed_by:      [UNKNOWN]
      vector_key:       macd_hist_raw
      vector_index:     18
  macd_hist_z:
    id:        FM-053
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "rolling(<feature_pipeline.zscore_window>) z-score of macd_hist_raw  # default 50"
    config_key: feature_pipeline.zscore_window
    impl:      feature_pipeline.compute_normalization
    depends_on: [macd_hist_raw]
    active:    true
    vector_key: macd_hist_z      # canonical index 19 (schema v4.0)
    note: >
      The value schema v3.0 emitted under the name `macd_hist`. Written to its OWN column now
      (NORMALIZE_TO_NEW_COL) instead of overwriting its source in place, so the declared formula and
      the emitted value finally agree for both halves of the pair. The zscore_window also sets the
      canonical ~78-row warmup (see T-5).
    taxonomy:
      category:        Momentum
      knowledge_class: Statistical
    semantics:
      description:   "Rolling z-score of macd_hist_raw over the configured window."
      why_it_exists: "Makes MACD acceleration comparable across instruments and price epochs by expressing it in standard deviations of its own recent history — which the raw form cannot do."
      interpretation:
        high: "Momentum acceleration is unusually strong versus its own recent distribution."
        low:  "Unusually negative; near zero means typical for this instrument lately."
        caveat: "This is the value schema v3.0 emitted under the name `macd_hist` — the name/quantity mismatch that motivated the v4.0 split."
    states: []
    lineage:
      derivation_depth: 4
      produced_by:      feature_pipeline.compute_normalization
      consumed_by:      [UNKNOWN]
      vector_key:       macd_hist_z
      vector_index:     19
  trend_strength:
    id:        FM-064
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "rolling(<feature_pipeline.zscore_window>) z-score of SMA(<feature_pipeline.trend_strength_window>) of diff(SMA(<feature_pipeline.ma_periods[0]>) of close)  # defaults 50, 10, 20"
    config_keys: [feature_pipeline.zscore_window, feature_pipeline.trend_strength_window, feature_pipeline.ma_periods]
    impl:      feature_pipeline.compute_trend_features
    depends_on: [close]
    active:    true
    vector_key: trend_strength     # canonical index 11 (unchanged across v3.0/v4.0)
    note: >
      REGISTERED 2026-07-31 (closes the last of two canonical slots with no ontology identity,
      the other being FM-065 candles_since_retest below). Was reserved as FM-064 since ontology
      v1.4 (2026-07-24) but deliberately not registered: `core/engine_runner.py` had a LOCAL
      variable also named `trend_strength` (= abs(ema_spread), an unrelated regime-detection
      quantity — see `dual_engine.detect_regime`) that would trip `feature_math_lint`'s ownership
      check the moment this name became a registered identity. That local has been renamed to
      `ema_spread_abs` (engine_runner.py, zero behavior change — the value and its use in
      `detect_regime`'s threshold comparison are unchanged, only the local variable's name
      differs) so the two quantities can no longer collide under one name.
      `compute_trend_features` computes the raw four-stage chain (`ma_20 -> ma_slope_20 ->
      rolling-mean trend_strength`); `compute_normalization` then z-scores it in place — the
      SAME two-stage split every other rolling+normalized feature in this ontology already
      documents (c.f. FM-049/FM-053 macd_hist_raw/macd_hist_z). `trend_strength_window` also
      sets the canonical ~78-row warmup jointly with `zscore_window` and `ma_periods[0]`
      (`required_warmup_rows()`, feature_pipeline.py).
    taxonomy:
      category:        Trend
      knowledge_class: Statistical
    semantics:
      description:   "Rolling z-score of the 10-bar smoothed slope of the 20-bar moving average of close."
      why_it_exists: "A trend-strength measure orthogonal to ema_spread/momentum_score — it tracks whether the SLOPE of a slower moving average is itself accelerating, standardized against its own recent history so it is comparable across instruments and epochs."
      interpretation:
        high: "The 20-bar trend is steepening unusually fast relative to its own recent history."
        low:  "Unusually flattening or reversing; near zero is typical for this instrument lately."
        caveat: "Distinct from FM-022 ema_spread (EMA separation) and FM-023 momentum_score (1-bar change) — this is a SLOPE-OF-A-SLOWER-MA statistic, twice-smoothed and z-scored. Do not conflate the three as interchangeable 'trend' features."
    states: []
    lineage:
      derivation_depth: 4
      produced_by:      feature_pipeline.compute_normalization
      consumed_by:      [UNKNOWN]
      vector_key:       trend_strength
      vector_index:     11
  volatility_regime:
    id:        FM-050
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "tercile(atr_14.rolling(<feature_pipeline.volatility_percentile_window>, min_periods=1).rank(pct=True)); atr_14 = SMA(14) of true_range (ABSOLUTE); cuts at <feature_pipeline.volatility_tercile_low>/<feature_pipeline.volatility_tercile_high> -> int8 {0,1,2}  # defaults 200, 0.33/0.66"
    config_keys: [feature_pipeline.volatility_percentile_window, feature_pipeline.volatility_tercile_low, feature_pipeline.volatility_tercile_high]
    impl:      feature_pipeline.compute_volatility_regime
    depends_on: [true_range]
    lookback:  200
    # `lookback` mirrors the percentile window (the tercile cuts are thresholds, not lookbacks).
    lookback_config_key: feature_pipeline.volatility_percentile_window
    bounds:    "{0, 1, 2}"
    active:    true
    note: >
      DEPENDENCY IS ABSOLUTE atr_14, NOT the close-relative FM-041 `atr`. compute_volatility_regime
      ranks df["atr_14"] (== atr_14_raw == SMA(14) of true_range, absolute price units); FM-041 `atr`
      is atr_14_raw / close (close-relative, canonical index 13). Different quantities -- hence
      depends_on true_range (FM-040), the registered ancestor of the absolute form, NOT `atr`.
      Corrected 2026-07-19 after an initial entry wrongly declared depends_on [atr]; matches the
      M14B analysis recorded at scripts/analysis/feature_dag_layers.py:123-124.
      Production bind is ROLLING_CAUSAL (FC1-D, FC-0.5 adjudication). The sibling
      volatility_regime_global_batch (full-frame rank, non-PIT) and _expanding_causal identities
      are research/legacy only and are deliberately NOT registered. CORRECTED 2026-07-19: the
      window and tercile cuts are NO LONGER hardcoded -- they were migrated to config in the
      Phase-A Tier-2 pass (see config_keys above). They are TUNABLE STRUCTURAL: changing any of
      them redefines THIS identity and invalidates artifacts trained against it, so a sweep is a
      semantic change requiring re-certification, not a free knob.
    taxonomy:
      category:        Volatility
      knowledge_class: Statistical
    semantics:
      description:   "Tercile bucket of the current absolute ATR against its own trailing rolling percentile."
      why_it_exists: "Converts continuous volatility into a coarse regime label so downstream logic can condition on 'quiet / normal / volatile' without picking instrument-specific cutoffs."
      interpretation:
        high: "Bucket 2 — currently among the most volatile third of the trailing window."
        low:  "Bucket 0 — among the quietest third."
        caveat: "Local and RELATIVE, not a latent regime state: it ranks ATR against the trailing window only. Depends on ABSOLUTE atr_14, not the close-relative FM-041 `atr`."
    states:
      - name:        LowVolatility
        value:       0
        condition:   "trailing ATR percentile < volatility_tercile_low"
        description: "Compression — quietest third of the trailing window."
      - name:        NormalVolatility
        value:       1
        condition:   "volatility_tercile_low <= percentile < volatility_tercile_high"
        description: "Middle third — typical conditions for this instrument recently."
      - name:        HighVolatility
        value:       2
        condition:   "percentile >= volatility_tercile_high"
        description: "Expansion — most volatile third of the trailing window."
    lineage:
      derivation_depth: 2
      produced_by:      feature_pipeline.compute_volatility_regime
      consumed_by:      [UNKNOWN]
      vector_key:       volatility_regime
      vector_index:     30
  # ── v1.4 COVERAGE COMPLETION (2026-07-24) ─────────────────────────────────────
  # Registration ONLY — no formula change, no pipeline edit. These identities were emitted by the
  # pipeline into CANONICAL_FEATURES but had NO declared identity, so nothing bound their meaning
  # and the ownership lint could not police their names. `last_swing_*_price` carry no vector slot
  # but are registered because the structural_states chain (FM-055/056/057/058) depends on them:
  # they are pipeline-DERIVED, not raw inputs, so grounding them on the `ref_high`/`ref_low`
  # base_input leaves would have been a false statement about the DAG.
  volume_ratio:
    id:        FM-062
    version:   1
    lifecycle: registered
    computation_class: rolling
    formula:   "volume / SMA(volume, <feature_pipeline.volume_ma_window>); 1.0 where the moving average is <= 0  # default 20"
    config_key: feature_pipeline.volume_ma_window
    impl:      feature_pipeline.compute_volume_features
    depends_on: [volume]
    lookback:  20
    units:     dimensionless
    active:    true
    taxonomy:
      category:        Volume
      knowledge_class: Statistical
    semantics:
      description:   "This bar's volume as a multiple of its own trailing average."
      why_it_exists: "Raw volume is not comparable across instruments or eras. Expressing it as a ratio to its own recent mean makes participation self-normalizing."
      interpretation:
        high: "Participation well above normal — conviction or an event."
        low:  "Below-average participation — moves here carry less weight."
        caveat: "Binds to SOURCE volume only. On instruments with dead volume (many FX feeds report zeros) the moving average is 0 and this pins to the 1.0 fallback — a constant, not a signal. The high-low proxy is emitted separately as volume_range_proxy_ratio and is deliberately NOT this feature."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      feature_pipeline.compute_volume_features
      consumed_by:      [UNKNOWN]
      vector_key:       volume_ratio
      vector_index:     5
  volume_spike:
    id:        FM-063
    version:   1
    lifecycle: registered
    computation_class: rolling_stateful
    formula:   "volume_ratio > rolling(<feature_pipeline.volume_spike_adaptive_window>, min_periods=<feature_pipeline.volume_spike_min_samples>).quantile(<feature_pipeline.volume_spike_percentile>/100); where that threshold is NaN fall back to <feature_pipeline.volume_spike_fixed_fallback> -> int8 {0, 1}  # defaults 50, 20, 75, 1.5"
    config_keys: [feature_pipeline.volume_spike_adaptive_window, feature_pipeline.volume_spike_min_samples, feature_pipeline.volume_spike_percentile, feature_pipeline.volume_spike_fixed_fallback]
    impl:      feature_pipeline.promote_volume_spike
    depends_on: [volume_ratio]
    lookback:  50
    lookback_config_key: feature_pipeline.volume_spike_adaptive_window
    bounds:    "{0, 1}"
    active:    true
    taxonomy:
      category:        Volume
      knowledge_class: Heuristic
    semantics:
      description:   "Whether volume_ratio exceeds an ADAPTIVE trailing percentile of its own distribution."
      why_it_exists: "A fixed multiple is not portable across instruments with different volume characteristics. Ranking each bar against the instrument's own recent distribution makes 'spike' mean the same thing everywhere."
      interpretation:
        high: "1 — participation in the top quantile of this instrument's recent behaviour."
        low:  "0 — ordinary participation."
        caveat: "HEURISTIC on two counts: the percentile cut is a judgement call, and during warmup (fewer than min_samples) it silently falls back to a FIXED multiple — so early bars use a different rule than later ones. Emitted twice in the pipeline: seeded with the fixed rule in compute_volume_features, then OVERWRITTEN by this adaptive form in promote_volume_spike. This entry declares the final emitted value."
    states:
      - name:        NoSpike
        value:       0
        condition:   "volume_ratio <= the adaptive threshold (or the fixed fallback during warmup)"
        description: "Participation is unremarkable for this instrument."
      - name:        VolumeSpike
        value:       1
        condition:   "volume_ratio > the adaptive percentile threshold"
        description: "Participation is in the upper tail of the instrument's own recent distribution."
    lineage:
      derivation_depth: 2
      produced_by:      feature_pipeline.promote_volume_spike
      consumed_by:      [UNKNOWN]
      vector_key:       volume_spike
      vector_index:     38
  candles_since_retest:
    id:        FM-065
    version:   1
    lifecycle: registered
    computation_class: rolling_stateful
    formula:   "cumcount of bars since the last liquidity_sweep event (groupby (liquidity_sweep != 0).cumsum()); 0 before the first sweep. Falls back to a retest_flag-keyed grouping ONLY when liquidity_sweep is absent from the frame (feature_pipeline.py:988-991) — non-authoritative, unreachable in production per the certification ledger."
    impl:      feature_pipeline.compute_canonical_temporal_features
    depends_on: [liquidity_sweep]
    units:     bars
    active:    true
    vector_key: candles_since_retest   # canonical index 35
    note: >
      REGISTERED 2026-07-31, closing a MODEL_INTENT_CHANGE-free path that was blocked on
      2026-07-24 (see FM-070 below for the resolution). This entry is the PIPELINE's canonical
      vector-slot quantity ONLY — bars since the last SWEEP event, matching what
      CANONICAL_FEATURES index 35 actually emits and what the DAG/certification ledger have
      always treated it as. It is NOT the CRT engine's live bars-since-RETEST-CANDLE quantity,
      which historically was ALSO written under the bare name `candles_since_retest`
      (config_layer/crt_engine_v2.py:1977,2056, a transient dict local to
      approve()/approve_with_soft_conf(), consumed only by the BitNet legacy-6 encoder) —
      exactly the FM-027/FM-028 (F-050/GD-001) name-collision pattern: intentional math on both
      sides, colliding name. That distinct quantity is now separately registered as FM-070
      `candles_since_retest_state`, and the CRT engine's two call sites were renamed to write
      `candles_since_retest_state` internally, with an explicit legacy-name alias
      (`_bn_in["candles_since_retest"] = ...`) at the BitNet call boundary ONLY — mirroring
      CH-002's existing `retest_depth`/`disp_strength` aliasing for FM-027/FM-028. Zero behavior
      change: the value fed to BitNet under the legacy key is numerically identical
      (`current_candle_index - retest_candle_index`, unchanged); `use_bitnet` stays false on the
      active config (F-004) so the path is presently inert either way.
    taxonomy:
      category:        Retest
      knowledge_class: Statistical
    semantics:
      description:   "Bars elapsed since the most recent liquidity_sweep event; 0 before any sweep has occurred."
      why_it_exists: "A recency/decay signal for how fresh a sweep-driven setup still is — the pipeline's counterpart to the CRT engine's own internal decay_factor (compute_decay_factor), computed from a different anchor (sweep vs. retest confirmation) for a different consumer (training vector vs. live scoring)."
      interpretation:
        high: "The last sweep was long ago — any retest/displacement built on it is stale."
        low:  "A sweep just occurred — the setup is fresh."
        caveat: "Do NOT conflate with the CRT engine's live `candles_since_retest_state` (FM-070) — same name historically, different anchor (sweep vs. retest candle), different producer, different consumer."
    states: []
    lineage:
      derivation_depth: 3
      produced_by:      feature_pipeline.compute_canonical_temporal_features
      consumed_by:      [UNKNOWN]
      vector_key:       candles_since_retest
      vector_index:     35
  # ── FM-065/FM-070 resolution history (2026-07-24 → 2026-07-31) ─────────────────────────────
  # DISCOVERED BY REGISTRATION, then withdrawn on 2026-07-24. Registering the name turned
  # tests/test_feature_math_lint.py::test_floor_is_green RED on two sites:
  #     config_layer/crt_engine_v2.py:1966 and :2045
  #         features["candles_since_retest"] = state.current_candle_index - state.retest_candle_index
  # That is a DIFFERENT QUANTITY from the pipeline's column of the same name:
  #     CRT engine  — bars since the RETEST CANDLE  (matches what the name says)
  #     pipeline    — bars since the last SWEEP     (feature_pipeline.py:988, cumcount over
  #                                                  sweep-event groups; deliberately NOT keyed on
  #                                                  retest_flag, which gave zero variance)
  # So the vector slot's name describes the CRT quantity while carrying the pipeline quantity —
  # exactly the FM-027/FM-028 (F-050 / GD-001) collision pattern: intentional math, colliding name.
  #
  # RESOLVED 2026-07-31: the CRT quantity is now registered under its own identity (FM-070
  # `candles_since_retest_state` above), and `crt_engine_v2.py`'s two emission sites were renamed
  # to write `candles_since_retest_state` internally, aliasing to the legacy key
  # `candles_since_retest` only at the BitNet call boundary — the same CH-002 pattern already
  # used for FM-027/FM-028 (`retest_depth`/`disp_strength`). No new GD pin was needed:
  # `_ORIGINAL_BASELINE_IDS` (feature_math_lint.py) stays frozen at exactly 10 GD ids; this
  # collision is resolved by a rename + a new FM id, not by a lint allowlist entry.
  # `trend_strength`'s parallel collision (`core/engine_runner.py:151`, an unrelated local
  # variable) is resolved the same way — see FM-064 above.
  last_swing_high_price:
    id:        FM-066
    version:   1
    lifecycle: registered
    computation_class: rolling_stateful
    formula:   "forward-fill of high where the centered swing-high pivot fired, then shifted by k = <feature_pipeline.swing_window> (FC1-A causal publication)  # default 2"
    config_key: feature_pipeline.swing_window
    impl:      feature_pipeline.compute_structure_liquidity
    depends_on: [high, swing_high]
    lookback:  2
    units:     price_absolute
    active:    true
    taxonomy:
      category:        MarketStructure
      knowledge_class: Structural
    semantics:
      description:   "Price level of the most recent confirmed swing high, carried forward until a new one confirms."
      why_it_exists: "The structural REFERENCE LEVEL above the market. Every upside structure event — higher_high, bullish break, buy-side sweep — is measured against this."
      interpretation:
        high: "The overhead reference sits far above current price."
        low:  "The reference is close — the market is near a known liquidity pool."
        caveat: "NO VECTOR SLOT — an internal reference, registered so the structural chain grounds honestly. Carries the FC1-A k-bar publication delay of its parent pivot; consumers shift it AGAIN by 1 so the reference reflects pre-open state."
    states: []
    lineage:
      derivation_depth: 2
      produced_by:      feature_pipeline.compute_structure_liquidity
      consumed_by:      [higher_high, break_of_structure, liquidity_sweep, liquidity_distance]
      vector_key:       []
      vector_index:     []
  last_swing_low_price:
    id:        FM-067
    version:   1
    lifecycle: registered
    computation_class: rolling_stateful
    formula:   "forward-fill of low where the centered swing-low pivot fired, then shifted by k = <feature_pipeline.swing_window> (FC1-A causal publication)  # default 2"
    config_key: feature_pipeline.swing_window
    impl:      feature_pipeline.compute_structure_liquidity
    depends_on: [low, swing_low]
    lookback:  2
    units:     price_absolute
    active:    true
    taxonomy:
      category:        MarketStructure
      knowledge_class: Structural
    semantics:
      description:   "Price level of the most recent confirmed swing low, carried forward until a new one confirms."
      why_it_exists: "The structural REFERENCE LEVEL below the market — the mirror of FM-066 and the anchor for every downside structure event."
      interpretation:
        high: "The reference is close beneath price — near a known liquidity pool."
        low:  "The supporting reference is far below."
        caveat: "NO VECTOR SLOT — internal reference. Same FC1-A delay semantics as FM-066."
    states: []
    lineage:
      derivation_depth: 2
      produced_by:      feature_pipeline.compute_structure_liquidity
      consumed_by:      [lower_low, break_of_structure, liquidity_sweep, liquidity_distance]
      vector_key:       []
      vector_index:     []

# ═══════════════════════════════════════════════════════════════════════════
# TEMPORAL CONTEXT — calendar projections (Item-2, 2026-07-19)
# ═══════════════════════════════════════════════════════════════════════════
# A THIRD computation class. These are neither scalar market math (`derived_metrics`, whose impl
# must resolve in FORMULA_REGISTRY and whose charter is "scalar float -> float" ATR/price-relative
# quantities) nor windowed indicators (`rolling_indicators`, computation_class rolling/
# rolling_stateful). They are per-bar projections of the bar's own timestamp — no window, no price
# input. Declaring either of the existing classes would be a false statement, hence this section.
# Like rolling_indicators they are EXEMPT from FORMULA_REGISTRY impl-resolution (the pipeline is
# the computation authority); `impl` names that authority.
temporal_context:
  hour_of_day:
    id:        FM-051
    version:   1
    lifecycle: registered
    computation_class: calendar
    formula:   "timestamp.dt.hour -> int8"
    impl:      feature_pipeline.compute_context
    depends_on: [timestamp]
    bounds:    "[0, 23]"
    active:    true
    taxonomy:
      category:        Time
      knowledge_class: Structural
    semantics:
      description:   "UTC hour of the bar's own timestamp, 0-23."
      why_it_exists: "The calendar root for session classification, and the raw handle for any time-of-day conditioning."
      interpretation:
        high: "Later in the UTC day."
        low:  "Earlier in the UTC day."
        caveat: "CYCLIC, not ordinal: hour 23 is adjacent to hour 0. Any model treating this as a linear magnitude is mis-reading it."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      feature_pipeline.compute_context
      consumed_by:      [UNKNOWN]
      vector_key:       hour_of_day
      vector_index:     32
  session:
    id:        FM-052
    version:   2                 # v2 (2026-07-22): 3-value hour partition -> 5-value window model
    lifecycle: registered
    computation_class: calendar
    formula:   "window model over <feature_pipeline.session_windows_utc>, half-open [start, end): OVERLAP if in LONDON and NEWYORK; else NEWYORK; else LONDON; else ASIA; else CLOSED -> int8  # defaults ASIA [0,9) LONDON [7,16) NEWYORK [12,21)"
    config_keys: [feature_pipeline.session_windows_utc]
    impl:      features.session_classifier.classify_session_feature
    depends_on: [hour_of_day]
    bounds:    "{0, 1, 2, 3, 4}"   # ASIA, LONDON, NEWYORK, OVERLAP, CLOSED
    active:    true
    note: >
      KNOWN 4-WAY COLLISION -- registering this name is precisely to put it under lint enforcement.
      This entry is the PIPELINE's hour-bucket definition (cutoffs 8/16, feature_pipeline:463-464).
      It is NOT dataset_integrity's session-aware tradability calendar (a different concept: market
      open/closed for gap accounting), NOT inout.scanner.s06_scalping.session_hours_start/end
      (7/17 -- same concept, DIFFERENT values, different module, not read by the pipeline), and
      M16-WU-SESSION-ENCODING (P1, BLOCKS_ACTIVATION) records a further canonical-vs-consumer
      encoding permutation against SESSION_MAP/dashboard. The hour cutoffs ARE config-driven via
      config_keys above (session_asia_end_hour/session_london_end_hour) and the formula uses the
      tokens. (CORRECTED 2026-07-19 per §6.2: this note previously asserted the cutoffs were
      hardcoded and un-configurable, contradicting the declared config_keys at :550 -- a
      documented-vs-actual drift now guarded by test_ontology_config_parity Rule F.)
    taxonomy:
      category:        Time
      knowledge_class: Structural
    semantics:
      description:   "Which major trading session the bar falls in, under a 5-value window model that can express the London/New-York overlap and a no-session CLOSED state."
      why_it_exists: "Liquidity and volatility are session-dependent. Encoding the session lets a model condition on WHO is trading rather than merely on the clock."
      interpretation:
        high: "Higher ordinals are not 'more' of anything — this is a NOMINAL category, not a magnitude."
        low:  "Same: ordinal 0 (ASIA) is not 'less' than ordinal 2 (NEWYORK)."
        caveat: "NOMINAL encoding in a float vector. A linear model reads a false ordering. Also: this is the FEATURE's session, deliberately separate from the session FILTER policy in CRTConfig.session_windows, and from three other same-named concepts (scanner 7/17, dataset_integrity calendar) — see the 4-way collision note above."
    states:
      - name:        ASIA
        value:       0
        condition:   "hour in ASIA window and not in LONDON or NEWYORK"
        description: "Asian session — typically the lowest-liquidity, range-bound period."
      - name:        LONDON
        value:       1
        condition:   "hour in LONDON window and not in NEWYORK"
        description: "London session — first major liquidity injection of the day."
      - name:        NEWYORK
        value:       2
        condition:   "hour in NEWYORK window and not simultaneously in LONDON"
        description: "New York session — US participation without London."
      - name:        OVERLAP
        value:       3
        condition:   "hour in BOTH the LONDON and NEWYORK windows"
        description: "London/New-York overlap — the highest-liquidity window of the day. DERIVED, deliberately not configurable."
      - name:        CLOSED
        value:       4
        condition:   "hour in no configured session window"
        description: "No major session active — thin conditions. DERIVED, deliberately not configurable."
    lineage:
      derivation_depth: 2
      produced_by:      features.session_classifier.classify_session_feature
      consumed_by:      [UNKNOWN]
      vector_key:       session
      vector_index:     31

# ═══════════════════════════════════════════════════════════════════════════
# STRUCTURAL STATES — event / classification identities (v1.4, 2026-07-24)
# ═══════════════════════════════════════════════════════════════════════════
# A FOURTH computation class. These are neither scalar market math (`derived_metrics`, whose impl
# must resolve in FORMULA_REGISTRY and whose charter is scalar float -> float), nor windowed
# indicators (`rolling_indicators`), nor calendar projections (`temporal_context`). They emit a
# small ENUMERATED DOMAIN: a detection event or a classification, not a magnitude. Declaring any
# existing class would be a false statement, which is precisely why `temporal_context` was created
# for FM-051/052 rather than forcing them elsewhere — the same reasoning applies here.
#
# Like rolling_indicators and temporal_context they are EXEMPT from FORMULA_REGISTRY
# impl-resolution (the pipeline is the computation authority); `impl` names that authority.
#
# EVERY entry here MUST carry a non-empty `states` block. That is the whole point of the section:
# a bare `domain: {-1, 0, 1}` records the legal values but not what they MEAN, and the meaning is
# what a future reader (or model consumer) actually needs. `condition` strings are DOCUMENTATION —
# declarative only, never `eval`'d, exactly like `formula`.
#
# COVERAGE NOTE: these 8 identities close the vector->ontology gap for the structural/event slots
# of CANONICAL_FEATURES. `retest_flag` has NO vector slot but is registered because FM-021
# retest_depth is gated on it — without it that entry's dependency graph cannot ground.
structural_states:
  trend_bias:
    id:        FM-054
    version:   1
    lifecycle: registered
    computation_class: structural_state
    formula:   "sign(ema_fast - ema_slow) -> float32 {-1, 0, +1}"
    impl:      feature_pipeline.compute_canonical_trend_features
    depends_on: [ema_fast, ema_slow]
    bounds:    "{-1, 0, 1}"
    active:    true
    taxonomy:
      category:        Trend
      knowledge_class: Structural
    semantics:
      description:   "Ternary direction of the fast EMA relative to the slow EMA."
      why_it_exists: "Collapses the continuous ema_spread into the only question most consumers ask of it: which side of the trend are we on? Immune to the price-level scaling defect that afflicts FM-022, because only the SIGN is kept."
      interpretation:
        high: "+1 — short-term average above long-term: market aligned upward."
        low:  "-1 — short-term below long-term: aligned downward. 0 means the EMAs are exactly equal (rare)."
    states:
      - name:        Bearish
        value:       -1
        condition:   "ema_fast < ema_slow"
        description: "Fast EMA below slow EMA — the market is trading below its short-term trend reference."
      - name:        Neutral
        value:       0
        condition:   "ema_fast == ema_slow"
        description: "No separation between the EMAs — no directional alignment. Rare on real data."
      - name:        Bullish
        value:       1
        condition:   "ema_fast > ema_slow"
        description: "Fast EMA above slow EMA — the market is trading above its short-term trend reference."
    lineage:
      derivation_depth: 2
      produced_by:      feature_pipeline.compute_canonical_trend_features
      consumed_by:      [UNKNOWN]
      vector_key:       trend_bias
      vector_index:     10
  higher_high:
    id:        FM-055
    version:   1
    lifecycle: registered
    computation_class: structural_state
    formula:   "high > prev(last_swing_high_price) -> int8 {0, 1}; NaN reference compares False"
    impl:      feature_pipeline.compute_structure_liquidity
    depends_on: [high, last_swing_high_price]
    bounds:    "{0, 1}"
    active:    true
    taxonomy:
      category:        MarketStructure
      knowledge_class: Structural
    semantics:
      description:   "Whether this bar's high exceeded the previous confirmed swing high."
      why_it_exists: "The elementary bullish structure event. A sequence of higher highs is the definition of an uptrend in structural terms, independent of any moving average."
      interpretation:
        high: "1 — structure extended upward past the last reference high."
        low:  "0 — no upward structural extension."
    states:
      - name:        NoHigherHigh
        value:       0
        condition:   "high <= previous last_swing_high_price, or no reference exists yet"
        description: "Structure has not extended upward on this bar."
      - name:        HigherHigh
        value:       1
        condition:   "high > previous last_swing_high_price"
        description: "Price took out the prior structural high — bullish structural extension."
    lineage:
      derivation_depth: 3
      produced_by:      feature_pipeline.compute_structure_liquidity
      consumed_by:      [UNKNOWN]
      vector_key:       higher_high
      vector_index:     25
  lower_low:
    id:        FM-056
    version:   1
    lifecycle: registered
    computation_class: structural_state
    formula:   "low < prev(last_swing_low_price) -> int8 {0, 1}; NaN reference compares False"
    impl:      feature_pipeline.compute_structure_liquidity
    depends_on: [low, last_swing_low_price]
    bounds:    "{0, 1}"
    active:    true
    taxonomy:
      category:        MarketStructure
      knowledge_class: Structural
    semantics:
      description:   "Whether this bar's low undercut the previous confirmed swing low."
      why_it_exists: "The elementary bearish structure event — the mirror of higher_high, and the other half of structural trend definition."
      interpretation:
        high: "1 — structure extended downward past the last reference low."
        low:  "0 — no downward structural extension."
    states:
      - name:        NoLowerLow
        value:       0
        condition:   "low >= previous last_swing_low_price, or no reference exists yet"
        description: "Structure has not extended downward on this bar."
      - name:        LowerLow
        value:       1
        condition:   "low < previous last_swing_low_price"
        description: "Price took out the prior structural low — bearish structural extension."
    lineage:
      derivation_depth: 3
      produced_by:      feature_pipeline.compute_structure_liquidity
      consumed_by:      [UNKNOWN]
      vector_key:       lower_low
      vector_index:     26
  break_of_structure:
    id:        FM-057
    version:   1
    lifecycle: registered
    computation_class: structural_state
    formula:   "+1 if close > prev(last_swing_high_price); -1 if close < prev(last_swing_low_price); else 0 -> int8"
    impl:      feature_pipeline.compute_structure_liquidity
    depends_on: [close, last_swing_high_price, last_swing_low_price]
    bounds:    "{-1, 0, 1}"
    active:    true
    taxonomy:
      category:        MarketStructure
      knowledge_class: Structural
    semantics:
      description:   "Directional break of structure, decided on the CLOSE rather than the extreme."
      why_it_exists: "Distinguishes a genuine structural break from a wick through the level. Closing beyond a reference means the market accepted the new price; merely trading through it does not."
      interpretation:
        high: "+1 — bullish break: closed above the prior structural high."
        low:  "-1 — bearish break: closed below the prior structural low. 0 means no break."
        caveat: "CLOSE-based by design. This is what separates it from liquidity_sweep, which requires the close to come BACK inside — the two are mutually exclusive on the same reference."
    states:
      - name:        BearishBreak
        value:       -1
        condition:   "close < previous last_swing_low_price"
        description: "Accepted below prior structural support — bearish structural shift."
      - name:        NoBreak
        value:       0
        condition:   "close within the prior structural range"
        description: "Structure intact; no accepted break in either direction."
      - name:        BullishBreak
        value:       1
        condition:   "close > previous last_swing_high_price"
        description: "Accepted above prior structural resistance — bullish structural shift."
    lineage:
      derivation_depth: 3
      produced_by:      feature_pipeline.compute_structure_liquidity
      consumed_by:      [UNKNOWN]
      vector_key:       break_of_structure
      vector_index:     22
  liquidity_sweep:
    id:        FM-058
    version:   1
    lifecycle: registered
    computation_class: structural_state
    formula:   "+1 if high > ref_high and close <= ref_high; -1 if low < ref_low and close >= ref_low; else 0 -> int8   # ref_* = prev(last_swing_*_price)"
    impl:      feature_pipeline.compute_structure_liquidity
    depends_on: [high, low, close, last_swing_high_price, last_swing_low_price]
    bounds:    "{-1, 0, 1}"
    active:    true
    taxonomy:
      category:        Liquidity
      knowledge_class: Structural
    semantics:
      description:   "A stop-run: price traded THROUGH a structural reference but closed back inside it."
      why_it_exists: "The founding event of the CRT ontology. Resting stops sit beyond swing points; a sweep is the market reaching them and rejecting the level, which is a fundamentally different act from accepting a break."
      interpretation:
        high: "+1 — buy-side sweep: the high ran stops above the prior swing high, then closed back below it."
        low:  "-1 — sell-side sweep: the low ran stops below the prior swing low, then closed back above it. 0 means no sweep."
        caveat: "MUTUALLY EXCLUSIVE with break_of_structure on the same reference: a sweep requires the close to return inside, a break requires it to stay outside. Sign convention is by WHICH SIDE was swept, not by resulting direction."
    states:
      - name:        SellSideSweep
        value:       -1
        condition:   "low < ref_low and close >= ref_low"
        description: "Sell-side liquidity taken below the prior swing low, then rejected — often bullish in consequence."
      - name:        NoSweep
        value:       0
        condition:   "neither sweep condition met"
        description: "No stop-run on this bar."
      - name:        BuySideSweep
        value:       1
        condition:   "high > ref_high and close <= ref_high"
        description: "Buy-side liquidity taken above the prior swing high, then rejected — often bearish in consequence."
    lineage:
      derivation_depth: 3
      produced_by:      feature_pipeline.compute_structure_liquidity
      consumed_by:      [UNKNOWN]
      vector_key:       liquidity_sweep
      vector_index:     21
  sweep_detected:
    id:        FM-059
    version:   1
    lifecycle: registered
    computation_class: structural_state
    formula:   "liquidity_sweep != 0 -> int8 {0, 1}"
    impl:      feature_pipeline.compute_canonical_structure_features
    depends_on: [liquidity_sweep]
    bounds:    "{0, 1}"
    active:    true
    taxonomy:
      category:        Liquidity
      knowledge_class: Structural
    semantics:
      description:   "Direction-agnostic presence of a liquidity sweep on this bar."
      why_it_exists: "Consumers that care WHETHER a sweep happened, not which side, would otherwise have to re-derive `!= 0` themselves — which is exactly the kind of re-derivation the ownership lint forbids."
      interpretation:
        high: "1 — a sweep occurred in some direction."
        low:  "0 — no sweep."
    states:
      - name:        NoSweep
        value:       0
        condition:   "liquidity_sweep == 0"
        description: "No stop-run detected on this bar."
      - name:        SweepDetected
        value:       1
        condition:   "liquidity_sweep != 0"
        description: "A stop-run occurred; consult liquidity_sweep for the side."
    lineage:
      derivation_depth: 4
      produced_by:      feature_pipeline.compute_canonical_structure_features
      consumed_by:      [UNKNOWN]
      vector_key:       sweep_detected
      vector_index:     20
  double_sweep:
    id:        FM-060
    version:   1
    lifecycle: registered
    computation_class: structural_state
    formula:   "any(liquidity_sweep > 0) and any(liquidity_sweep < 0) over rolling(<feature_pipeline.double_sweep_window>, min_periods=1) -> int8 {0, 1}  # default 5"
    config_key: feature_pipeline.double_sweep_window
    impl:      feature_pipeline.compute_canonical_structure_features
    depends_on: [liquidity_sweep]
    lookback:  5
    bounds:    "{0, 1}"
    active:    true
    taxonomy:
      category:        Liquidity
      knowledge_class: Heuristic
    semantics:
      description:   "Both sweep directions observed within a short trailing window."
      why_it_exists: "A two-sided stop-run is a trap signature: the market took liquidity above AND below in quick succession, which usually means neither side is in control."
      interpretation:
        high: "1 — both sides swept recently; a liquidity trap / whipsaw regime."
        low:  "0 — at most one side swept in the window."
        caveat: "HEURISTIC: the window length is a judgement call, not a mathematical truth. Widening it monotonically increases the flag rate."
    states:
      - name:        NoDoubleSweep
        value:       0
        condition:   "at most one sweep direction present in the trailing window"
        description: "No two-sided liquidity event."
      - name:        DoubleSweep
        value:       1
        condition:   "both a positive and a negative liquidity_sweep within the trailing window"
        description: "Liquidity taken on both sides in quick succession — trap / whipsaw conditions."
    lineage:
      derivation_depth: 4
      produced_by:      feature_pipeline.compute_canonical_structure_features
      consumed_by:      [UNKNOWN]
      vector_key:       double_sweep
      vector_index:     6
  retest_flag:
    id:        FM-061
    version:   1
    lifecycle: registered
    computation_class: structural_state
    formula:   "rolling_any(liquidity_sweep != 0, <feature_pipeline.retest_lookback>) and abs(close - ema_fast) <= <feature_pipeline.retest_atr_band_mult> * atr * close -> int8 {0, 1}  # defaults 10, 1.0"
    config_keys: [feature_pipeline.retest_lookback, feature_pipeline.retest_atr_band_mult]
    impl:      feature_pipeline.compute_canonical_structure_features
    depends_on: [liquidity_sweep, close, ema_fast, atr]
    lookback:  10
    bounds:    "{0, 1}"
    active:    true
    taxonomy:
      category:        Retest
      knowledge_class: Heuristic
    semantics:
      description:   "A recent sweep occurred AND price is currently within an ATR-scaled band of the fast EMA."
      why_it_exists: "The CRT sequence needs a bar where price has returned to fair value after taking liquidity. This conjunction is that bar."
      interpretation:
        high: "1 — an active retest: liquidity was recently taken and price has come back to the reference."
        low:  "0 — either no recent sweep, or price has not returned to the band."
        caveat: "REGISTERED BUT NOT A VECTOR FEATURE — it has no CANONICAL_FEATURES slot. It is registered because FM-021 retest_depth is GATED on it (retest_depth is 0.0 wherever this is 0), so the dependency cannot ground without it. Heuristic: both the lookback and the band multiplier are judgement calls."
    states:
      - name:        NoRetest
        value:       0
        condition:   "no sweep within retest_lookback bars, or |close - ema_fast| outside the ATR band"
        description: "No active retest. FM-021 retest_depth emits 0.0 on these bars."
      - name:        RetestActive
        value:       1
        condition:   "sweep within retest_lookback bars AND |close - ema_fast| <= retest_atr_band_mult * atr * close"
        description: "Price has returned to the fast-EMA reference after taking liquidity — FM-021 retest_depth is meaningful here."
    lineage:
      derivation_depth: 4
      produced_by:      feature_pipeline.compute_canonical_structure_features
      consumed_by:      [feature_pipeline.compute_canonical_temporal_features]
      vector_key:       []
      vector_index:     []
  # ── Phase 2A (2026-07-24): EXISTING pipeline state columns, finally registered ───────────────
  # These two were already computed, already config-driven, and already banded — they simply had
  # no declared identity, so nothing bound their meaning and the ownership lint could not police
  # their names. Registering them is CONSOLIDATION, not addition: no new math, no new config key,
  # no pipeline edit. They also establish the layer-2 pattern the roadmap asks for —
  # "Features measure. States interpret." — as SEPARATE identities rather than one entry doing
  # both: FM-042 rsi_14 stays a continuous measurement, and its interpretation is FM-068 rsi_state.
  rsi_state:
    id:        FM-068
    version:   1
    lifecycle: registered
    computation_class: structural_state
    formula:   "+1 if rsi_14 > <feature_pipeline.rsi_overbought>; -1 if rsi_14 < <feature_pipeline.rsi_oversold>; else 0 -> int8  # defaults 70, 30"
    config_keys: [feature_pipeline.rsi_overbought, feature_pipeline.rsi_oversold]
    impl:      feature_pipeline.compute_indicators
    depends_on: [rsi_14]
    bounds:    "{-1, 0, 1}"
    active:    true
    taxonomy:
      category:        Momentum
      knowledge_class: Heuristic
    semantics:
      description:   "Ternary interpretation of rsi_14 against its overbought/oversold thresholds."
      why_it_exists: "Separates MEASUREMENT from INTERPRETATION: rsi_14 reports a number, this reports what the number means. Consumers that only need the verdict should not each re-apply the thresholds — that is how a shared cut silently becomes three different cuts."
      interpretation:
        high: "+1 — momentum is stretched to the upside by the configured cut."
        low:  "-1 — stretched to the downside; 0 is the unremarkable middle band."
        caveat: "HEURISTIC: 70/30 are conventional, not derived. They are TIER-3 BEHAVIORAL — tuning them changes this identity's output but does NOT redefine FM-042, whose formula does not mention them. Not a canonical vector slot."
    states:
      - name:        Oversold
        value:       -1
        condition:   "rsi_14 < rsi_oversold"
        description: "Losses have dominated the window past the configured cut."
      - name:        NeutralMomentum
        value:       0
        condition:   "rsi_oversold <= rsi_14 <= rsi_overbought"
        description: "Neither side dominates — the majority band."
      - name:        Overbought
        value:       1
        condition:   "rsi_14 > rsi_overbought"
        description: "Gains have dominated the window past the configured cut."
    lineage:
      derivation_depth: 2
      produced_by:      feature_pipeline.compute_indicators
      consumed_by:      [UNKNOWN]
      vector_key:       []
      vector_index:     []
  displacement_flag:
    id:        FM-069
    version:   1
    lifecycle: registered
    computation_class: structural_state
    formula:   "body_size > candle_range * <feature_pipeline.displacement_strong_body_mult> and atr > 0 -> int8 {0, 1}  # default 0.6"
    config_key: feature_pipeline.displacement_strong_body_mult
    impl:      feature_pipeline.compute_canonical_structure_features
    depends_on: [body_size, candle_range, atr]
    bounds:    "{0, 1}"
    active:    true
    taxonomy:
      category:        Volatility
      knowledge_class: Heuristic
    semantics:
      description:   "Marks a candle whose body occupies more than the configured fraction of its range, on a bar with valid ATR."
      why_it_exists: "The trap-first displacement marker: a conviction test expressed as a boolean so downstream structure logic does not each re-apply the body/range cut."
      interpretation:
        high: "1 — a decisive, body-dominated candle."
        low:  "0 — the bar lacked body dominance, or ATR was unavailable."
        caveat: "HEURISTIC and DISTINCT from FM-020 disp_strength (a continuous ATR-normalized magnitude) and from the CRT engine's own `body_ratio >= 0.70` displacement gate. Three related-but-different conviction tests; this is the pipeline's boolean one. Not a canonical vector slot."
    states:
      - name:        NoDisplacement
        value:       0
        condition:   "body_size <= candle_range * displacement_strong_body_mult, or atr <= 0"
        description: "The bar is not body-dominated — no displacement marker."
      - name:        Displacement
        value:       1
        condition:   "body_size > candle_range * displacement_strong_body_mult and atr > 0"
        description: "Body-dominated candle — a conviction move by the configured cut."
    lineage:
      derivation_depth: 3
      produced_by:      feature_pipeline.compute_canonical_structure_features
      consumed_by:      [UNKNOWN]
      vector_key:       []
      vector_index:     []

# ═══════════════════════════════════════════════════════════════════════════
# INDICATOR IDENTITIES — DESCRIPTIVE clarification of rolling indicators (B0/B1, 2026-07-12)
# ═══════════════════════════════════════════════════════════════════════════
# NOTE (2026-07-12 bottom-up cert): IND-001 atr / IND-002 rsi_14 were PROMOTED to first-class
# registered identities FM-041 / FM-042 in `rolling_indicators` above. These descriptive entries are
# retained for history (§6.2 rule 4); the registered entries are now authoritative.
# Rolling indicators (ATR/RSI/MACD) are ALGORITHMS, explicitly OUT of the derived_metrics layer
# (boundary freeze, see header). This section is DESCRIPTIVE ONLY — it does NOT register an executable
# impl and grants no computation authority (the pipeline remains the sole computation authority).
# It exists to make the SEMANTICS machine-readable and to CORRECT false declarations at an authoritative
# source.
#
# SUPERSEDED comment (was: "Full FM-id registration + parity wiring is a separate architectural
# review (deferred, B2/B3).") — WRONG as of 2026-07-19 (tracker C-1 / T-9). MACD was certified and
# promoted by the L0–L6 successor programme WITHOUT a B2/B3 review: macd_line / macd_signal /
# macd_hist are PROMOTED_PRODUCTION + BOUND_CANONICAL_VECTOR (indices 16/17/18) and registered as
# FM-047 / FM-048 / FM-049 under `rolling_indicators`. ATR/RSI are FM-041/FM-042. This
# `indicator_identities` block remains descriptive history only — do not treat it as the live
# registration path. Residual for MACD is ontology-registration hygiene only (M16-WU-ONTOLOGY-
# REGISTRATION P7, BLOCKS_ACTIVATION:false), not a deferred architectural review.
# NOT iterated by the registry/lineage/lint (which scan only primitives/feature_compositions/
# derived_metrics/rolling_indicators/temporal_context via their own section tuples).
indicator_identities:
  atr:
    id:                 IND-001
    versioning_status:  clarified_descriptive       # runtime math UNCHANGED (identity clarification only)
    vector_key:         atr                          # CANONICAL_FEATURES index 13
    smoothing_method:   SMA                          # simple rolling mean of True Range (NOT Wilder RMA)
    lookback:           14
    true_range:         "max(high-low, |high-prev_close|, |low-prev_close|)"
    output:             close_relative               # atr_14_raw / close
    normalization_basis: close
    units:              dimensionless
    computation_authority: "feature_pipeline.py compute_indicators (atr_14_raw) + compute_canonical_volatility_features (atr)"
    false_claims_corrected: >
      (2026-07-12) B1/F3 fresh-reproduced: production ATR == SMA-of-TR (maxdiff 0.0 vs SMA, 0.118 vs
      Wilder). The identity `atr` is close-relative SMA-TR — NOT Wilder ATR and NOT absolute-price ATR.
      Do not silently substitute Wilder smoothing (would change trained-artifact inputs + gate thresholds).
  rsi_14:
    id:                 IND-002
    versioning_status:  clarified_descriptive
    vector_key:         rsi_14                        # CANONICAL_FEATURES index 15
    smoothing_method:   SMA                           # gain/loss are simple rolling(14).mean() — NOT Wilder EWMA
    lookback:           14
    output_scale:       [0, 100]
    rs_form:            "avg_gain / (avg_loss + 1e-9)"
    zero_loss_behavior: "1e-9 denominator guard -> RSI -> 100 (clipped)"
    zero_gain_behavior: "RSI -> 0 (clipped)"
    warmup_behavior:    "NaN for first 14 bars (rolling window) -> dropped by finalize()"
    computation_authority: "feature_pipeline.py compute_indicators (rsi_14)"
    false_claims_corrected: >
      (2026-07-12) B1/F4 fresh-reproduced: production RSI uses SMA gain/loss (maxdiff 0.0 vs SMA, 35.8
      vs Wilder). The docstring at feature_pipeline.py compute_indicators formerly asserted "Standard
      Wilder formula" — CORRECTED same-turn to state SMA (behavior-neutral). RS *ratio form* is Wilder's;
      the *averaging* is SMA. Do not silently substitute Wilder smoothing.


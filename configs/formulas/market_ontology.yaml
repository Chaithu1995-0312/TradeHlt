derived_metrics:
  disp_strength:
    id:          FM-020
    version:     1
    lifecycle:   parity_verified
    formula:     "clip(body_size / (atr * close), <feature_pipeline.disp_strength_clip_low>, <feature_pipeline.disp_strength_clip_high>) if atr>0 and close>0 else nan  # defaults 0.0, 3.0"
    config_keys: [feature_pipeline.disp_strength_clip_low, feature_pipeline.disp_strength_clip_high]
    impl:        derived_math.disp_strength
    depends_on:  [body_size, atr, close]
    clip:        [0.0, 3.0]
    active:      true
    source_of_truth: feature_pipeline.py:950     # CORRECTED 2026-07-24 (was :565, stale)
    note: >
      Body size normalized by ATR-scaled price. The former naming collision with scoring_engine.py's
      local `disp_strength = move/atr` was adjudicated 2026-07-11 (GD-004 closure): a DISTINCT third
      quantity, registered as FM-029 disp_strength_atr_rescale. This entry is the FEATURE-VECTOR
      definition (CANONICAL_FEATURES).
    taxonomy:
      category:        Volatility
      knowledge_class: Derived
    semantics:
      description:   "Candle body measured in units of ATR-scaled price, clipped to [0, 3]."
      why_it_exists: "Answers whether a move is large FOR CURRENT CONDITIONS. A 50-point body means nothing until it is compared to prevailing volatility; this is the displacement test the CRT state machine gates on."
      interpretation:
        high: "Displacement — the bar moved far beyond what recent volatility would predict."
        low:  "The move is unremarkable for this volatility regime; no displacement."
    states: []
    lineage:
      derivation_depth: 3
      produced_by:      feature_pipeline.compute_canonical_temporal_features
      consumed_by:      [UNKNOWN]
      vector_key:       disp_strength
      vector_index:     33

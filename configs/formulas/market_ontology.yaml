    normalization_basis: atr_relative            # denominator `atr` is close-relative (atr_14_raw/close)
    temporal_semantics:  same_bar
    known_issue: >
      DIMENSIONAL MIX (B1/F1, fresh-reproduced 2026-07-12): numerator (ema_fast-ema_slow) is absolute
      price; denominator `atr` is dimensionless (close-relative) -> the quantity SCALES with price level
      (probe: median ratio 100x at 100x price). Corrected identity = FM-030 ema_spread_atr.
      DECISION-SURFACE COST MEASURED 2026-07-22 (F-061): because the emitted magnitude equals the
      corrected value times `close`, the engine_runner.dual_engine thresholds tuned for a
      dimensionless O(1) quantity (trend_strength_threshold 0.15 / momentum_threshold 0.3) are
      INERT on crypto and binding only on FX. On BNBUSDT/BTCUSDT (median |ema_spread| 320 / 38,110
      vs 0.47 corrected) detect_regime returns "trend" on 98.9%/99.9% of bars and breakout_engine's
      score is pinned at 1.0 on ~100%; under the corrected identity both discriminate (52.7% trend,
      6.8% pinned) and are instrument-scale invariant. So this is no longer a representational
      defect only -- it degrades live decisions. Correction is now REACHABLE (config-gated, inactive).
    replacement_identity: FM-030                  # registered below as a first-class inactive identity
    migration_class:      FORMULA_CORRECTION_CONFIG_GATED   # was FORMULA_CORRECTION_DEFERRED until 2026-07-22
    config_key:           feature_pipeline.normalization_basis   # "atr_relative" selects THIS identity (default)
    artifact_compatibility: LEGACY_BOUND          # active code (engine_runner regime/breakout, heuristic
                                                  # gaussian) + inactive rr_model/gaussian-38 artifacts bind
                                                  # to this math; correction requires retrain + recalibration.
    taxonomy:
      category:        Trend
      knowledge_class: Derived
    semantics:
      description:   "Separation between the fast and slow EMA, divided by close-relative ATR."
      why_it_exists: "Measures how strongly the short-term trend has pulled away from the longer-term trend, intended to be normalized for volatility."
      interpretation:
        high: "Fast EMA far above slow — strong established uptrend."
        low:  "Large negative — strong established downtrend; near zero means the EMAs are entangled (no trend)."
        caveat: "READ THIS BEFORE USING THE VALUE: the emitted magnitude scales with PRICE LEVEL (see known_issue / F-061). Cross-instrument or cross-epoch comparison of raw values is invalid under this legacy identity."
    states: []
    lineage:

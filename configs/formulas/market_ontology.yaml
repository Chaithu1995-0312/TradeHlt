    evidence:               ["docs/architecture/model-design-intent.md Part VII 'Which models are measuring the same thing?' — Familiarity (four surfaces) (Authority: NONE, narrative)", "F-060: the live Gaussian heuristic channel is unparameterized (registry mu=0/sigma=1 defaults fire on a successful load) and degenerates to a near-constant ~0.8825 (std 3e-3)", "F-036: Zone Gate weight/threshold sweeps are byte-identical (deltaG001 == 0) — non-pivotal on the fused live decision", "F-041B: 0/8 Zone Gate zones clear honest E>0 under forward_walk re-derivation"]

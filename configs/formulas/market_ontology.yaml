    notes:                  "Two surfaces, deliberately NOT treated the same. The FEATURE (session_windows_utc) is a mislabel -- corrected, config-gated (feature_pipeline.session_timestamp_basis: broker_local DEFAULT / utc_corrected opt-in), default stays byte-identical (F-061/normalization_basis pattern). The FILTER (crt_engine.session_windows, the live trading-eligibility gate) was empirically tuned ON broker-time data; re-basing its timestamps while keeping its band numbers would silently move the actually-traded hours by 2-3h, and a static band cannot compensate a seasonal offset -- left untouched, a separate economic decision. Binance-sourced corpora (F-017/F-021's BNBUSDT base) are UNAFFECTED -- their epochs are genuinely UTC already. Activating utc_corrected on the ACTIVE production config is a separate, explicitly-gated decision (freeze-pin re-certification required) -- NOT made by this registration. See F-066 in docs/current-findings.md for the full evidence record."

  soft_confirmation_double_ema_update:
    id:                     SEM-006
    canonical_name:         SOFT_CONFIRMATION_DOUBLE_EMA_UPDATE
    aliases:                [F-067, double_ema_update, alpha_eff_compression]
    semantic_category:      ExecutionBehaviour
    knowledge_status:       MATHEMATICALLY_DEFINED
    description:            "EngineState.update_emas is called twice on the same candle close during the RETEST/soft-confirmation window -- once unconditionally at the top of process_candle, once inside the evaluating_soft_conf branch (there is no RETEST state branch, so every confirmation candle falls through to it). Re-applying the same update is mathematically equivalent to ONE update at an effective smoothing coefficient alpha_eff = 2*alpha - alpha**2, not to nested composition (a prior bug-trace's EMA(EMA(close)) characterization)."
    observed_behaviour:     "On the full XAUUSD M15 corpus (47,275 bars, config v2_multi_2026_04): 17 soft-confirmation evaluations. Trend-only mean spread ratio (double-update / single-update) = 0.4673 (n=10), matching the closed-form prediction (~0.457-0.467 for ema_fast=2/ema_slow=5). Chop-only ratio = 0.9698 (n=7) -- the toy alternating-series inflation prediction (~1.34x) did NOT replicate on real data; real chop includes near-zero EMA crossings that can sign-flip between arms rather than scale (e.g. candle_index=37273), so it is reported as observed, not forced to the pre-registered toy figure. 0/17 tier-bucket flips -- ledger-neutral on this corpus (all three historically-approved soft-conf candidates on the 8-week freeze slice were separately killed by the discount/premium zone filter, unrelated to this mechanism)."
    mathematical_definition: "alpha = 2/(period+1); applying the EMA update twice with the same close: ema' = close*alpha + (close*alpha + ema*(1-alpha))*(1-alpha) = close*alpha_eff + ema*(1-alpha_eff), alpha_eff = 2*alpha - alpha**2. For ema_fast=2 (alpha=2/3): alpha_eff=8/9 (effective span 1.25, not 2). For ema_slow=5 (alpha=2/6): alpha_eff=5/9 (effective span 2.6, not 5)."
    units:                  dimensionless
    formula:                "f_mom = clip((ema_fast - ema_slow) * dir_mult / atr_abs, 0, 1), where ema_fast/ema_slow are the DOUBLE-updated (alpha_eff) trajectories, not the configured alpha"
    dependencies:           []
    required_inputs:        [ema_fast_val, ema_slow_val, atr_abs, direction]
    produced_outputs:       [f_mom, soft_confirmation_score_C, fusion_score_S]
    producers:              ["src/config_layer/crt_engine_v2.py:291 EngineState.update_emas", "src/config_layer/crt_engine_v2.py:2629 (call site A, unconditional)", "src/config_layer/crt_engine_v2.py:2998 (call site B, inside evaluating_soft_conf)"]
    consumers:              ["src/config_layer/crt_engine_v2.py:1898 UltronRiskEngine.compute_soft_confirmation (reads at :1919)", "src/config_layer/crt_engine_v2.py:1953 approve_with_soft_conf (S vs tier_1/tier_2 thresholds)"]
    transitions:            []
    validation_rules:       ["a probe or fix touching this mechanism must reproduce compute_soft_confirmation byte-exactly when fed the SAME ema values it reads (tests/test_soft_conf_ema_probe.py self-consistency battery)", "the closed-form alpha_eff prediction is a MECHANISM claim, not an economic one -- do not cite the trend-compression ratio as evidence of a G001 improvement without a fresh measurement"]
    confidence:             Certain
    evidence:               ["results/analysis/soft_conf_ema_double_update.LATEST.json (n=17, self_consistency_err=0.0)", "tests/test_soft_conf_ema_probe.py (12 tests, closed-form + corpus self-consistency)", "docs/current-findings.md F-067"]
    origin:                 "Source-verification of a multi-model (grok/deepseek) bug trace, 2026-08-04 -- the trace's mechanism and direction were both backwards and are corrected here, not just in chat (CLAUDE.md Epistemic Integrity correction discipline)"
    status:                 measured_no_fix_applied
    version:                1
    owner:                  claude
    traceability:           "update_emas (:291) -> two call sites (:2629, :2998) -> compute_soft_confirmation (:1898) -> approve_with_soft_conf (:1953) -> tier bucket -> TRADE_OPENED/FILTER_REJECTED"
    notes:                  "OBSERVATION_ONLY per user decision ('measure first, fix after') -- no src/ edit landed with this registration. Whether to remove the duplicate call at :2998 is a separate BEHAVIOR_CHANGE_AUTHORIZED turn. Grants NO authority (SS6.5) -- the trend-compression confirmation is mechanism evidence, not an economic G001 result; n=17 is thin (XAUUSD throughput ceiling, consistent with F-035/F-045-class corpus limits)."
    epistemic:
      known_invariants:
        - "Both call sites are real and unconditional on every soft-confirmation-window candle (source-verified, not a comment/log-string inference)."
        - "Double-application is mathematically alpha_eff = 2*alpha - alpha**2 (exact closed form, verified to 1e-12 in tests/test_soft_conf_ema_probe.py), NOT nested composition EMA(EMA(close))."
        - "Trend-only spread compression is confirmed on the full XAUUSD corpus (ratio 0.4673, n=10) and matches the closed-form prediction."
      unknown_mechanism: "Whether removing the duplicate call would improve, degrade, or leave unchanged any real economic outcome is unmeasured -- XAUUSD gives only n=17 soft-conf evaluations and 1 total_setup on the full corpus, so no fix-vs-no-fix economic comparison is currently constructible on this instrument. The chop-regime prediction (toy alternating-series inflation ~1.34x) also did not replicate on real corpus chop (observed 0.9698) -- the mechanism for why real chop behaves differently from the idealized toy series (near-zero-spread sign flips) is not fully characterized."
      candidate_hypotheses:
        - "Removing the duplicate call (single update per candle) would make f_mom track true momentum more faithfully, plausibly changing the S-score vector meaningfully on instruments with more soft-conf throughput than XAUUSD."
        - "The effect is economically negligible in practice because the RETEST/soft-conf window is already rare and short-lived (soft_conf_max_candles=3), so any single-candle EMA distortion self-corrects within the window before it can change many decisions."
      resolution_metric: "A fix-vs-no-fix A/B ledger comparison on an instrument with enough soft-conf throughput to be decisive (XAUUSD alone is insufficient at n=17/1-setup); OR a forward-looking S-score sensitivity analysis across the historical BNBUSDT/ETHUSDT/BTCUSDT/SOLUSDT corpora used in F-019 onward."
      falsification_conditions:
        - "A same-method re-run on a higher-throughput instrument shows near-zero trend-compression ratio (would mean the XAUUSD result was instrument-specific, not a general property of the alpha_eff mechanism)."
        - "A fix-vs-no-fix ledger A/B shows the duplicate call is net-neutral or net-positive for realized economics (would mean the mechanism, though real, carries no correctness argument for removal)."

  shadow_ttl_created_bar_off_by_one:
    id:                     SEM-007
    canonical_name:         SHADOW_TTL_CREATED_BAR_OFF_BY_ONE
    aliases:                [F-068, pending_displacement_created_idx, deadlock_fix_ttl_interaction]
    semantic_category:      ExecutionBehaviour
    knowledge_status:       VALIDATED
    description:            "reset_to_range's [DEADLOCK FIX] fall-through (deliberate -- lets a sweep fire on the freshly-seeded range on the SAME candle rather than losing a bar) means that when an HTF-triggered reset creates shadow displacement memory, the RANGE branch of process_candle runs on that SAME candle immediately after creation. Pre-fix, that branch unconditionally decremented pending_displacement_ttl there too, so a configured TTL of N yielded only N-1 usable subsequent bars."
    observed_behaviour:     "XAUUSD full-corpus (47,275 bars) before/after the fix: SHADOW_PENDING resumptions 43 -> 51 (+8), SWEEP 6995 -> 6987 (-8), DISPLACEMENT/EXPANSION/RETEST/EXECUTION/RANGE/total_setups byte-identical. test_shadow_survives_configured_ttl_then_expires verified to FAIL against the pre-fix guard (temporarily reverted, observed sequence [2,1,0,0] vs the expected [3,2,1,0], restored)."
    mathematical_definition: "pre-fix: ttl(bar_0)=N-1, ttl(bar_k)=max(N-1-k,0) for k>=0 relative to the creating bar. post-fix: ttl(bar_0)=N (unchanged), ttl(bar_k)=max(N-k,0) for k>=1. The creating bar (k=0) is now excluded from the decrement via pending_displacement_created_idx == candle.index."
    units:                  bars
    formula:                "decrement condition: pending_displacement_ttl > 0 AND candle.index != pending_displacement_created_idx"
    dependencies:           []
    required_inputs:        [pending_displacement_ttl, pending_displacement_created_idx, candle.index]
    produced_outputs:       [pending_displacement_ttl, SHADOW_PENDING_resumption_eligibility]
    producers:              ["src/config_layer/crt_engine_v2.py:1734 _create_shadow (reset_to_range)", "src/config_layer/crt_engine_v2.py:2700-2701 RANGE-branch decrement guard"]
    consumers:              ["src/config_layer/crt_engine_v2.py RANGE branch sweep-resume check (try_range_to_shadow_pending)", "src/config_layer/crt_engine_v2.py:2856 consumed-path teardown (try_shadow_pending_to_expansion)"]
    transitions:            ["RANGE -> SHADOW_PENDING (matching-direction sweep while pending_displacement_ttl > 0, including on the bar TTL would otherwise hit its last surviving decrement)"]
    validation_rules:       ["pending_displacement_created_idx must be cleared on every teardown path that clears pending_displacement_ttl (consumed, SHADOW_LEAK, TTL-exhaustion, non-HTF-reset expiry) -- no fifth stale field"]
    confidence:             Certain
    evidence:               ["tests/test_shadow_ttl_lifecycle.py (6 tests, includes the pre-fix-must-fail verification)", "results/ttl_before vs results/ttl_after XAUUSD state_distribution diff", "docs/current-findings.md F-068"]
    origin:                 "Source-verification of a multi-model (grok/deepseek) bug trace, 2026-08-04 -- the trace's claim that this was mitigated by an existing code comment was checked and found false"
    status:                 shipped
    version:                1
    owner:                  claude
    traceability:           "reset_to_range :1734 (create) -> process_candle RANGE branch :2700-2701 (guard) -> try_range_to_shadow_pending (resume) -> try_shadow_pending_to_expansion :2856 (consume/clear)"
    notes:                  "Correctness-only fix; no economic claim. total_setups is unchanged at 1 on the full XAUUSD corpus -- at that N, no economic conclusion (positive or negative) is derivable from this fix; the state-distribution delta (+8 SHADOW_PENDING resumptions) is the complete, honest result. A prior bug-trace rated this defect 'Low' severity based on a code comment ('same bar burns 1') that does not exist in crt_engine_v2.py -- CORRECTED: the comment existed only in a prior session's assistant_project.md entry, never in source; the fix adds the comment the claim assumed was already there. Grants NO authority beyond the correctness fix itself (SS6.5)."


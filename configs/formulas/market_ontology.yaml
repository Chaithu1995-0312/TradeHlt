      vector_key:       []
      vector_index:     []
  disp_strength_atr_rescale:
    id:          FM-029
    version:     1
    lifecycle:   registered      # GD-004 closure 2026-07-11: the scoring_engine.py:31 local
                                 # `disp_strength = move/atr` — a THIRD identity, distinct from
                                 # FM-020 and FM-028 (probe: equals FM-028 on 0.00% of bars).
    formula:     "disp_strength / atr; atr<=0 -> 0.0"
    impl:        derived_math.disp_strength_atr_rescale
    depends_on:  [disp_strength, atr]
    active:      true
    source_of_truth: scoring_engine.py:31
    note: >
      AS-WIRED quantity of scoring_engine.compute_scores: the sole caller (crt_engine.py:23) passes
      the FM-020 feature as `move` and the close-relative pipeline atr, so the value is
      FM-020/atr_rel == body_size*close/atr_14_raw^2. HYPOTHESIS (deferred, FU-CRT-MOVE-MISWIRE):
      the signature (`move`, `atr`) suggests a raw-move/FM-028-like input was intended — fixing the
      call site is a gate-ON fusion BEHAVIOR change, out of identity-closure scope. Characterization
      (docs/governance/gd004_disp_rescale_probe-2026-07-11.json, BNBUSDT 29,922 bars): saturates
      s_breakout's min(x/2,1) at 1.0 on 97.5% of bars; equals FM-020 2.08% (zero-disp bars only),
      equals FM-028 0.00%. Impact bounded: backtests gate-OFF (F-037), run() never executes (F-048).
    taxonomy:
      category:        Volatility
      knowledge_class: Derived
    semantics:
      description:   "The AS-WIRED quantity of scoring_engine.compute_scores: FM-020 divided again by close-relative ATR."
      why_it_exists: "Registered to SEPARATE a third colliding identity, not because the quantity is desirable. Its existence is a record of what the code actually computes."
      interpretation:
        high: "Saturating — the value pins s_breakout's min(x/2, 1) at 1.0 on 97.5% of bars, so the score carries almost no information."
        low:  "Only reached on near-zero-displacement bars."
        caveat: "Double-normalized by construction (body_size*close / atr_14_raw^2). Do NOT read this as a displacement measure; see the FU-CRT-MOVE-MISWIRE hypothesis in the note."
    states: []
    lineage:
      derivation_depth: 4
      produced_by:      scoring_engine.compute_scores
      consumed_by:      [scoring_engine]
      vector_key:       []
      vector_index:     []
  candles_since_retest_state:
    id:        FM-070
    version:   1
    lifecycle: registered
    formula:   "current_candle_index - retest_candle_index"
    impl:      derived_math.candles_since_retest_state
    depends_on: [current_candle_index, retest_candle_index]
    active:    true
    note: >
      REGISTERED 2026-07-31 to resolve the FM-065 name collision (see that entry's note in
      rolling_indicators). The CRT engine's live bars-since-the-RETEST-CANDLE count — DISTINCT
      from FM-065's bars-since-SWEEP pipeline quantity, despite historically sharing the bare
      name `candles_since_retest`. Consumed only inside `approve()` / `approve_with_soft_conf()`
      (config_layer/crt_engine_v2.py) to build the transient BitNet input dict; aliased to the
      legacy key `candles_since_retest` at that call boundary only, matching the existing
      FM-027/FM-028 alias pattern (CH-002). Also computed independently, under the LOCAL name
      `candles_elapsed`, by `compute_decay_factor` (same subtraction, different consumer —
      exponential score decay rather than a BitNet feature) — a duplicate-formula site noted
      here, not remediated in this pass (no name collision, so the ownership lint does not flag
      it; consolidating it is a code-simplification opportunity, not a semantic defect).
    taxonomy:
      category:        Retest
      knowledge_class: Derived
    semantics:
      description:   "Bars elapsed since the retest candle that triggered the current CRT engine confirmation window."
      why_it_exists: "Feeds the BitNet legacy-6 encoder's `candles_since_retest` input under its expected name, computed from the CRT engine's own state rather than re-deriving it from the training vector."
      interpretation:
        high: "The retest confirmation happened many bars ago — soft-confirmation staleness."
        low:  "The retest just occurred."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      derived_math.candles_since_retest_state
      consumed_by:      [crt_engine_v2, bitnet.encoders]

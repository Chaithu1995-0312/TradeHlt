    required_inputs:        [m15_ohlc]
    produced_outputs:       [MotherRange, InsideCloseEntry]
    producers:              ["src/research/mother_range/geometry.py detect_inside_close_entries"]
    consumers:              ["src/research/mother_range/driver.py"]
    transitions:            ["MOTHER_BLOCK -> TEST_BLOCK_INSIDE_CLOSE -> ENTRY"]
    validation_rules:       ["calendar x=16 not positional", "big-mother lookback uses prior blocks only", "entry is C2 close (t=0)", "SL/TP are mother extremes, not ATR multiples chosen after seeing y", "no runtime import of crt_engine_v2", "not SEM-011", "F-086 stride holdout is not this split"]

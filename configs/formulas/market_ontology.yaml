risk_behaviours:

  structural_rr_floor:
    id: SEM-025
    canonical_name: STRUCTURAL_RR_FLOOR
    aliases:
      - min_rr_5
      - reward_floor
      - one_to_five_rule
    semantic_category: RiskBehaviour
    knowledge_status: MATHEMATICALLY_DEFINED
    description: "An admission rule that rejects any candidate whose reward-to-risk falls below a declared floor, in a construction where BOTH the target and the stop are already fixed by structure. Because neither leg is chosen, the floor cannot improve a trade; it can only decide which trades are allowed through. What it actually selects on is the subject of this node."
    observed_behaviour: "UNIMPLEMENTED here. The repository's existing reward-to-risk gate is UltronRiskGate.min_rr_ratio, which is COST-TAXED and applied AFTER ExecutionPlanner has produced SL/TP (contract D, F-048) - a different object at a different point in the pipeline. The floor described by this node is applied at SIGNAL time against purely structural levels, before any planner runs. In the source corpus the floor is 5 and is stated alongside 'Target = HTF CRT objective' and 'Stop = CRT invalidation', which is what makes both legs structural rather than chosen."
    mathematical_definition: "Let e be entry, s the structural invalidation level and g the structural objective level. reward_leg = abs(g - e), risk_leg = abs(e - s), rr = reward_leg / risk_leg. The rule admits iff rr >= floor. Substituting the admission condition gives risk_leg <= reward_leg / floor: for a fixed reward leg the rule is EXACTLY an upper bound on the stop distance. Two consequences follow by arithmetic, not by assumption. (1) SELECTION: the admitted set is the set of candidates whose invalidation happens to lie close to entry. (2) COST: per-trade cost in R is cost_r = cost_price / risk_leg (F-087), which is strictly decreasing in risk_leg, so the admitted set is also the set carrying the HIGHEST cost per trade measured in R."
    units: dimensionless ratio; the floor is a pure number
    formula: "rr = abs(g - e) / abs(e - s) ; admitted = rr >= floor ; equivalently risk_leg <= abs(g - e) / floor"
    dependencies:
      - SEM-015
      - SEM-022
      - SEM-024
    required_inputs:
      - entry_price
      - structural_invalidation_level
      - structural_objective_level
      - rr_floor
    produced_outputs:
      - reward_to_risk
      - rr_admitted
      - risk_leg_distance
    producers: []
    consumers: []
    transitions: []
    validation_rules:
      - "The floor must never be described as a quality filter in any artifact this node governs. With both legs structural it is an upper bound on stop distance; calling it a quality measure is the semantic error this node exists to prevent."
      - "Any measurement of this rule must report the admitted set's stop-distance distribution alongside its expectancy. Expectancy alone cannot distinguish 'the floor selected better trades' from 'the floor selected thinner buffers'."
      - "cost_r must be computed per candidate from its own risk_leg via the SEM-015 component model, never from a corpus-average risk distance - averaging destroys exactly the relationship this node names."
      - "The floor is a BEHAVIORAL knob: strict config read, no silent default (CLAUDE.md 6.5), and it must be sweepable so the admitted set can be measured as a function of the floor rather than at one chosen value."
      - "A run that applies the floor must also produce the otherwise-identical run without it. The floor's effect is a DIFFERENCE and is not recoverable from a single arm."
    confidence: Certain
    evidence:
      - "SujanTraderCrtExpPart2.txt:1262-1270 PHASE 8 states all three clauses together: 'Reward >= 1:5', 'Target = HTF CRT objective', 'Stop = CRT invalidation'."
      - "Five setups posted by the same trader and reconstructed to the pip 2026-08-22. Sorted by stop distance in points the reward-to-risk is strictly monotone DECREASING - 86:8.5, 101:5.5, 151:5.0, 175:4.9, 338:4.5 - while sorted by reward distance it carries no order at all (5.5, 8.5, 5.0, 4.9, 4.5). n=5, so this is corroboration of the arithmetic, not an independent statistical result."
      - "Every one of those five ratios reconstructs from its own entry, stop and target to within 0.1 of the ratio the trader published, which is what establishes that neither leg was chosen to hit the ratio."
      - "F-087 established cost_r = cost_price / risk_distance and measured stop WIDTH, not stop policy, as the dominant cost driver on XAUUSD - the same arithmetic that makes consequence (2) hold."
      - "F-048 records that the repository's own reward-to-risk authority is UltronRiskGate's cost-taxed min_rr_ratio applied after the planner, establishing that this signal-time structural floor is a DIFFERENT object."
    origin: "Registered 2026-08-22 during the SujanTrader corpus trace, BEFORE any implementing code, per CLAUDE.md 6.6. Seeds the previously-empty risk_behaviours section."
    status: registered
    version: 1
    owner: research-sujan-crt
    traceability:
      manifest: UNKNOWN
      implements: src/research/sujan_crt/score.py
    notes: "PROVENANCE (F-077 discipline): the floor appears in a dialogue transcript as the AI interlocutor's proposed checklist, not the trader's authored method - the TRIGGER for this node, not its authority. This node asserts the SELECTION and COST consequences, which are arithmetic. It does NOT assert that the floor is harmful; that is a hypothesis held in the epistemic block and is what the paired measurement is designed to answer. Grants no G001."
    epistemic:
      known_invariants:
        - "With both legs structural, rr is fully determined by geometry - the floor changes the admitted SET and can never change any individual candidate's rr."
        - "Admission is exactly equivalent to an upper bound on stop distance for a fixed reward leg. This is an identity, not an approximation."
        - "Per-trade cost in R is strictly decreasing in stop distance, so the admitted set carries strictly higher mean cost_r than the rejected set whenever reward legs are comparable."
        - "A floor applied to a population whose reward legs vary is NOT a pure stop-distance filter; it is a filter on the ratio. The stop-distance reading is exact only conditional on the reward leg."
      unknown_mechanism: "Whether the floor's effect on net expectancy is positive, negative or nil on a real corpus. Two identified forces oppose each other: a tighter stop raises cost_r and sits closer to prices the market has recently traded (both adverse), while a higher rr raises the payoff on the trades that do resolve favourably (beneficial). Which dominates is not derivable from the geometry and has never been measured for this construction."
      candidate_hypotheses:
        - "UNTESTED: the floor REDUCES net expectancy, because admitted candidates have the thinnest buffer against ordinary retracement and simultaneously the highest cost in R. Pre-registered as the program's directional prediction before any measurement."
        - "UNTESTED: the floor is approximately NEUTRAL on gross expectancy and negative only on net, which would locate the entire effect in cost rather than in hit rate."
        - "UNTESTED: the effect is non-monotone in the floor, with a shallow interior optimum, in which case a floor of 5 is neither the best nor the worst choice and the rule's specific value is arbitrary."
      resolution_metric: "Run the otherwise-identical funnel rung with and without the floor, and additionally as a sweep over floor values. Report, per arm: n, gross expectancy with confidence interval, net expectancy under the SEM-015 component cost, mean and distribution of risk_leg, and mean cost_r. The paired difference between the with-floor and without-floor arms on the SAME underlying candidate set is the estimate; both arms must resolve through the same exit and cost model."
      falsification_conditions:
        - "The SELECTION claim is falsified if, on a real corpus, the admitted set's stop-distance distribution is statistically indistinguishable from the rejected set's - which would mean reward-leg variation dominates and the floor is not a stop-distance filter in practice."
        - "The COST claim is falsified only by a cost model in which cost_r does not depend on risk_leg. Under SEM-015 it cannot be falsified, so it must be reported as arithmetic and never presented as an empirical finding."
        - "The harm HYPOTHESIS is falsified if the with-floor arm's net expectancy exceeds the without-floor arm's by more than the paired confidence interval. That outcome is a registrable result and must not be retuned away."


  sujan_manipulation_phase1:
    id:                     SEM-033
    canonical_name:         SUJAN_MANIPULATION_PHASE1
    aliases:                [sujan_manipulation_research_phase_1, parent_bulk_purge_reclaim]
    semantic_category:      Pattern
    knowledge_status:       CHARACTERIZED
    description:            "Phase-1 DETECTION-ONLY object: a later candle that purges an EXTERNALLY SUPPLIED parent bulk candle's full wick-to-wick range and closes back fully inside it. Emits SUJAN_MANIPULATION_DETECTED and stops. RESEARCH object under src/research/sujan_manipulation/. The founding (which candle is 'bulk') is UNRESOLVED and lives at UNK-007; this node defines only what happens AFTER a parent is supplied. Not ParentCRT MANIPULATION_C2 (F-077). Not SEM-031 (no import, no retune; F-095 does not travel here). Not a trade object: no entry, no stop, no target, no outcome, no MC-*."
    observed_behaviour:     "UNMEASURED at registration beyond a detection smoke run. Phase 1 produces an alert COUNT, which is an observation and never a result. No rate, quality, expectancy or economic reading is derived from it."
    mathematical_definition: "Bars are OHLC with strictly increasing timestamps and a row ordinal index. A parent bulk candle P is supplied externally as a timestamp resolved to a bar; ParentRange = (high=P.high, low=P.low), full wick-to-wick, body-only interpretations REJECTED. For a bar B with B.index > P.index: high_purge = swept_high(B.high, B.close, range_high) and B.close > range_low; low_purge = swept_low(B.low, B.close, range_low) and B.close < range_high, where swept_high/swept_low are SP-001 (strict on both sides). side = BOTH if both, else HIGH_SWEEP if high_purge, else LOW_SWEEP if low_purge, else no event. Purge and close-back-inside are properties of ONE candle. The parent range remains the reference object after an alert (alerts repeat); there is no TTL; every supplied parent is monitored independently and in parallel to end of corpus."
    units:                  price for the range boundaries; dimensionless otherwise
    formula:                "see mathematical_definition; frozen in docs/research/sujan_manipulation_object.md"
    dependencies:           [SP-001, UNK-007, SEM-034]
    required_inputs:        [ohlc, parent_bulk_candle_timestamps]

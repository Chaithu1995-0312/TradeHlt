    formula:     "clip(abs(close - ema_fast) / (atr * close), <feature_pipeline.retest_depth_clip_low>, <feature_pipeline.retest_depth_clip_high>) if retest_flag==1 and atr>0 and close>0 else 0.0  # defaults 0.0, 1.0"
    config_keys: [feature_pipeline.retest_depth_clip_low, feature_pipeline.retest_depth_clip_high]
    impl:        derived_math.retest_depth

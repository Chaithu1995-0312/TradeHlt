    status:                 open
    version:                1
    owner:                  reasoning-capability-program
    traceability:           "Groups the existing gaussian/zone_gate MIAR entries (docs/governance/miar_registry.json) and CRT's internal confirmation gate by reasoning axis, WITHOUT altering any of their individual authority_boundary or explicit_non_goals. Graduates IN PLACE if the resolution_metric below is ever measured — no duplicate node on refinement."
    notes:                  "The four producers have structurally different authority shapes today (soft score / hard gate / embedded-internal) — part of what is unresolved is whether 'same reasoning question, different authority shape' is itself meaningful or an artifact of ad-hoc development. This node grants no authority to any producer and does not alter Zone Gate's hard-gate status, Gaussian's fusion weight, or CRT's internal confirmation logic."
    # Epistemic block — OBSERVED is in research_stage_statuses (ENCOURAGED, not mandatory); included
    # because the cross-model pattern this node records is explicitly a hypothesis, not yet a fact.
    epistemic:
      known_invariants:
        - "Four production models compute a distance-from-known-state quantity: HeuristicGaussianEngine (3-feature EMA/momentum kernel), MLGaussianEngine (trained NB density), Zone Gate similarity kernel (full 39-dim, hard gate), and CRT's internal distance-decay soft-confirmation (crt_engine_v2.py). This is a citable code fact, not a hypothesis."
        - "No shared formula, scale, or declared target exists across the four producers today (F-060, F-036 independently measured each in isolation; no joint analysis exists)."
      unknown_mechanism: "Whether these four surfaces are genuinely one reasoning capability (statistical/structural distance-from-known-state) realized four times at different granularities, or four computations that only share informal vocabulary ('familiarity') without any common formal definition, scale, or target."
      candidate_hypotheses:
        - "All four estimate a common latent quantity (distance from a learned/reference distribution of market states) at different granularities — global parametric (Gaussian heuristic/ML) vs local geometric (Zone Gate) vs internal-heuristic (CRT)."
        - "Only Gaussian heuristic and Gaussian ML are truly the same capability (same declared target, different estimators); Zone Gate and CRT-internal are a structurally distinct membership/geometry capability that merely shares vocabulary."
        - "The four are accidental convergent reimplementations with no principled relationship, each added independently to solve a locally-perceived need."
      resolution_metric: "Cross-producer measurement (not run by this registration): for a fixed corpus, compute correlation / rank-agreement across all four producers' raw pre-threshold outputs. High mutual correlation supports one shared capability; near-zero/negative correlation supports the accidental-reimplementation hypothesis. Per §6.5 Authority Ladder, this registers the QUESTION (information), not a measurement — no authority is claimed or implied."
      falsification_conditions:
        - "Pairwise correlation among the four producers' raw scores is not significantly different from zero on a real corpus — refutes 'one shared capability'."
        - "A fifth, clearly different-axis model (e.g. RR polarity, which answers a distinct commitment-geometry question per MIAR) shows equal or higher correlation with one of the four than the four show with each other — refutes that the grouping is meaningful at all."

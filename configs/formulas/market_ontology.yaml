  sujan_bulk_candle_proxy_v1:
    id:                     SEM-034
    canonical_name:         SUJAN_BULK_CANDLE_PROXY_V1
    aliases:                [bulk_candle_proxy, top_n_bulk_shortlist]
    semantic_category:      Pattern
    knowledge_status:       CHARACTERIZED
    description:            "A bridge-APPROVED, UNVALIDATED mechanical proxy that shortlists candidate parent bulk candles for SEM-033. Top-N over the WHOLE corpus by FM-002 candle_range and, SEPARATELY, by FM-001 body_size; two lists, never merged. It does NOT define what a bulk candle is - UNK-007 stays OPEN. A candidate becomes a parent only when the human bridge confirms it on the rendered page. Versioned as its own node so a future rule is a NEW freeze rather than a retune of SEM-033."
    observed_behaviour:     "XAUUSD M15 2026-08-29 (47,275 bars, top_n=50): 50 candidates per ranking, overlap 34 of 50 (68%). Parquet cross-check AGREES - 47,166 rows compared against features.candle_range / features.body_size, 0 mismatches at 1e-06, 109 csv_only as expected (78-bar warmup + edge trim). TEMPORAL CONCENTRATION MEASURED: candle_range touches 4 of 25 corpus months, body_size 5 of 25; 20-21 months contribute ZERO candidates. That is the top-N-over-corpus rule behaving as specified, not a defect, but a shortlist is NOT a survey of the corpus."
    mathematical_definition: "Let B be the corpus bars, each with a row ordinal index. For ranking R in {candle_range, body_size} define m_R(bar): m_candle_range(b) = FM-002 candle_range(b.high, b.low); m_body_size(b) = FM-001 body_size(b.open, b.close). Order B by (-m_R(b), b.index) - ties break by ASCENDING bar index, never by sort stability - and take the first N. N is a recorded constant, not a fitted parameter: N=50, frozen by the human bridge 2026-08-29 (drift log Record 6). The two rankings are computed independently and are NEVER combined into a single score; their intersection is reported as a count and a bar-index list. Comparison scope is the whole corpus: no rolling window, no percentile, no volatility normalisation, no threshold."
    units:                  price for magnitudes; dimensionless for rank and overlap
    formula:                "see mathematical_definition; N and rule frozen in docs/research/sujan_manipulation_object.md"
    dependencies:           [FM-001, FM-002, UNK-007]
    required_inputs:        [ohlc, top_n]
    produced_outputs:       [RankedCandidate, candidates_jsonl, confirmation_page]
    producers:              ["src/research/sujan_manipulation/bulk_proxy.py TopNRangeSelector / TopNBodySelector"]
    consumers:              ["src/research/sujan_manipulation/driver.py run_candidates", "src/research/sujan_manipulation/label_page.py"]
    transitions:            []
    validation_rules:       ["magnitudes come from features.candle_math; inline OHLC arithmetic is forbidden and AST-tested", "no new FM-* id: nothing here enters the 48-dim vector", "the two rankings are never merged and never re-ranked by their overlap", "ties break by ascending bar index, explicitly", "N is required at construction; no silent default", "status stays UNVALIDATED until an agreement check against a bridge-labelled set exists", "a candidate is not a parent until the bridge confirms it", "the parquet cross-check fails closed without pyarrow; a skipped check is never reported as passed", "this proxy does not resolve UNK-007 and does not certify identity", "no economic claim; the candidate count is an observation"]
    confidence:             Certain
    evidence:               ["docs/research/sujan_manipulation_object.md", "docs/research/sujan_identity_drift_log.md", "src/research/sujan_manipulation/bulk_proxy.py", "tests/research/test_sujan_manipulation.py", "docs/research-readiness/sujan_manipulation/candidates/candidates_manifest.json"]
    origin:                 "User (human bridge) 2026-08-29: instructed the repository to find parent bulk candles from OHLC rather than wait for a hand-supplied list. Rulings recorded the same turn: repo decides, shortlist-then-eyeball, both size readings un-merged, top-N over the whole corpus, N=50, CSV as source with Parquet as cross-check, UNK-007 refined in place and left open."
    status:                 characterized
    version:                1
    owner:                  research-sujan-manipulation
    traceability:           "UNK-007 (the open concept) <- SEM-034 (this UNVALIDATED proxy) -> SEM-033 (the detector, which consumes confirmed parents only). Replacing the rule means SEM-034 v2 or a new node, never an edit to SEM-033."
    notes:                  "APPROVED != VALIDATED. This node exists so that a mechanical stand-in for a visual concept is a NAMED, VERSIONED object rather than an anonymous heuristic buried in a selector. Grants no G001, no production authority, no identity certification. The measured 68% overlap between the two rankings is a fact about the proxy, not about the market."
    epistemic:
      known_invariants:
        - "Given a corpus and N, the output is deterministic: the tie-break is explicit and does not depend on input order."
        - "The two rankings genuinely disagree: on XAUUSD M15 at N=50 they share only 34 candles."
        - "A wick-dominant candle can rank first by candle_range and not appear at all by body_size, and vice versa - tested directly."
        - "Magnitudes agree exactly with the independently computed Parquet columns (0 mismatches over 47,166 rows)."
        - "Top-N over the whole corpus concentrates on volatile stretches: 20 of 25 XAUUSD months returned no candidate at all."
      unknown_mechanism: "Whether this proxy selects the candles the human bridge would call bulk. No agreement check exists, because no hand-labelled set existed before this build; producing that set is the point of the confirmation page."

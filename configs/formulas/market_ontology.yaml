# ═══════════════════════════════════════════════════════════════════════════
# MARKET ONTOLOGY — the WHAT layer (market mathematics)
# ═══════════════════════════════════════════════════════════════════════════
# Third authority in the WHO / HOW / WHAT split (CLAUDE.md §6.5 Config-First):
#   active_models.yaml      = WHO   (which model uses which feature, and why)
#   configs/production/*.json = HOW  (runtime policy: thresholds, weights, switches)
#   configs/formulas/*.yaml   = WHAT (the mathematical meaning of a feature)
#
# AUTHORITY MODEL (registry is authoritative, ontology is descriptive):
#   Ontology (WHAT, descriptive) -> Formula Registry (authoritative dispatch)
#     -> Implementations (scalar callables) -> Consumers (read the registry).
#   CONFIG-DECLARED, CODE-EXECUTED — the `formula` strings below are the human/LLM-readable
#   AUTHORITY for what each quantity MEANS; the single authority for HOW it is COMPUTED is the
#   named Python callable in src/features/registry/ (FORMULA_REGISTRY). NEVER `eval`'d. A parity
#   test binds declaration to implementation; an ownership-lint forbids re-derivation elsewhere.
#   Enforced rule: a registered quantity may only ORIGINATE from a registered implementation.
#
# LAYER SEPARATION (the wick_size lesson, 2026-07-05; extended to derived metrics 2026-07-06):
#   - `primitives` are mathematical IDENTITIES over OHLC — immutable, never configurable
#     (like area = pi*r*r). They live in src/features/candle_math.py.
#   - `feature_compositions` are trading INTERPRETATIONS (which numerator/denominator a
#     ratio uses). Debatable; changing an ACTIVE denominator is a policy change that REQUIRES
#     threshold recalibration (e.g. body_ratio >= 0.70) and is gated.
#   - `derived_metrics` are deterministic NORMALIZED quantities (ATR/price-relative). They live
#     in src/features/derived_math.py; the vectorized feature_pipeline.py is bound to them by a
#     parity battery.
#   - `rolling_indicators` are WINDOWED indicators (ATR/RSI/EMA/true_range/swing publication). The
#     2026-07-12 bottom-up certification program LIFTED the earlier boundary freeze for the seven
#     load-bearing ones: they are first-class registered identities (FM-040..FM-046) with
#     `computation_class: rolling` — computed by the pipeline (no scalar float->float form exists),
#     certified by a SERIES-level parity + PIT probe rather than the scalar parity battery. Stateful
#     detection state-machines (BOS/CHOCH/pivot) remain out of this layer.
#
# GOVERNANCE FIELDS (per entry):
#   id         — stable FM-0NN handle; findings/tests/docs reference the ID, so a rename never
#                breaks references.
#   version    — per-feature formula version (global `version` below tracks the schema).
#   lifecycle  — verification maturity on the fixed ladder:
#                  proposed -> research -> registered -> parity_verified -> consumable -> deprecated
#                (lifecycle tracks VERIFICATION state, not mere usage; a feature consumed by the
#                 vector but whose scalar<->pipeline-column parity is not yet wired stays `registered`).
#   depends_on — dependency edges (registered features or `base_inputs`); the DAG resolves to OHLC.
#                Reverse `used_by` edges are COMPUTED by build_lineage_graph(), never stored.
#   source_of_truth — (derived_metrics only) provenance pointer to the canonical pipeline site,
#                kept until the pipeline routes through the registry.

version: 1.4                     # 1.4 (2026-07-24): Feature Specification System — every entry carries
                                # taxonomy/semantics/lineage/states; +structural_states section (FM-054..061);
                                # +rolling_indicators FM-062/063/066/067. Coverage of CANONICAL_FEATURES
                                # completed 2026-07-31: FM-064 trend_strength + FM-065 candles_since_retest
                                # registered (closing the two-slot gap; each required a same-name execution-code
                                # collision to be resolved first — a local-variable rename in engine_runner.py
                                # for FM-064, and a new FM-070 identity + CRT-engine key rename for FM-065).
                                # ADDITIVE ONLY: no existing runtime key was moved, renamed or reindented
                                # (see spec_schema.frozen_runtime_keys).
                                # 1.3 (2026-07-12): bottom-up cert program — rolling_indicators section
                                # (FM-040..046 first-class windowed identities); atr/ema removed from base_inputs.
                                # 1.2: B0/B1 semantic-migration governance (FM-022/023/002 + indicator_identities + migration_candidates).
authority: user_approved        # WHAT layer; grants no promotion authority (§6.5 — HOW stays in production/*.json)

# ═══════════════════════════════════════════════════════════════════════════
# SPEC SCHEMA — the contract every feature entry satisfies (v1.4, 2026-07-24)
# ═══════════════════════════════════════════════════════════════════════════
# This ontology is a FEATURE SPECIFICATION SYSTEM, not merely a formula registry. Every entry
# answers: what is it · why does it exist · how is it computed · what does it mean · what states
# can it express · which config influences it · who consumes it · what depends on it.
#
# HYBRID LAYOUT (non-negotiable — the reason this migration is zero-risk):
#   The keys in `frozen_runtime_keys` below are read by LIVE CODE at MODULE IMPORT TIME, flat, by
#   hard subscript. `config_layer/crt_engine_v2.py:33-34` calls `bind_phase2_crt_callables()` at
#   import, which walks (primitives, feature_compositions, derived_metrics) in
#   `features/fm_resolve.py:61` and reads spec["id"/"impl"/"lifecycle"/"numerator"/"denominator"];
#   `features/registry/derived_registry.py:43` does DERIVED[entry["impl"]]. crt_engine_v2 is
#   imported by every live AND backtest path. Nesting any of these keys (e.g. moving `formula`
#   under a `math:` block) does not degrade validation — it HARD-CRASHES the CRT engine on import.
#   Therefore: frozen keys stay FLAT and byte-identical; all specification content is carried in
#   ADDITIVE sibling blocks that no runtime path reads.
#
# EMPTY VALUES: always `[]` — never `null`, `~`, or a bare key. YAML null deserializes to Python
# None, so `entry.get("states", [])` returns None (the default never fires) and the next iteration
# raises TypeError. Absent-means-empty is a trap; empty-means-empty is the contract.
spec_schema:
  version: 1
  frozen_runtime_keys:          # FLAT, never nested — see the import-time note above
    - id                        # fm_resolve.py:68 · validate_registry
    - version                   # validate_registry
    - lifecycle                 # fm_resolve.py:81 · validate_registry
    - formula                   # validate_registry
    - impl                      # derived_registry.py:43 (hard subscript) · fm_resolve.py:80
    - computation_class         # validate_registry (rolling / temporal / structural_state branches)
    - depends_on                # build_lineage_graph
    - numerator                 # composition_registry.py:29 (feature_compositions only)
    - denominator               # composition_registry.py:29 (feature_compositions only)
  additive_spec_blocks:         # NEW in v1.4 — unread by any runtime path
    taxonomy:
      category:        "closed vocabulary below — the market domain this feature belongs to"
      knowledge_class: "closed vocabulary below — what KIND of knowledge this is"
    semantics:
      description:     "what the quantity is, in one sentence"
      why_it_exists:   "the decision or gate it was built to serve"
      interpretation:  "{high: ..., low: ...} — what the reader should conclude from the value"
    states:            "list of {name, value, condition, description}; [] for continuous features"
    lineage:
      derivation_depth: "DESCRIPTIVE int — hops from a base_input. NOT computed by validate_registry"
      produced_by:      "the pipeline method or scalar callable that emits it"
      consumed_by:      "SCALAR consumers only (named call sites reading this feature alone), or [UNKNOWN]"
      vector_key:       "CANONICAL_FEATURES name, or [] when the feature has no vector slot"
      vector_index:     "index into CANONICAL_FEATURES, or [] when unbound"
  # The market domain. Chosen by WHAT QUESTION THE FEATURE ANSWERS, not by what its inputs are:
  # volatility_ratio consumes candle geometry but answers a volatility question -> Volatility.
  category_vocabulary:
    - Price                     # raw OHLCV level
    - CandleGeometry            # single-candle shape
    - Trend                     # directional regime / alignment
    - Momentum                  # rate of change
    - Volatility                # dispersion / range magnitude
    - Liquidity                 # sweeps, stop-runs, liquidity levels
    - MarketStructure           # swings, BOS, HH/LL
    - Retest                    # post-sweep return-to-level behaviour
    - Volume                    # traded size and its anomalies
    - Time                      # calendar projections
  # What KIND of knowledge this is — tells a future author how much to trust and whether it is tunable.
  knowledge_class_vocabulary:
    - Primitive                 # mathematical identity over OHLC; not debatable, not configurable
    - Derived                   # deterministic normalization of primitives/indicators
    - Statistical               # distributional (z-score, percentile, rank)
    - Heuristic                 # threshold-dependent; the cut is a judgement call, not a truth
    - Structural                # state-machine / event detection over a price sequence
    - Behavioral                # encodes a market-participant interpretation
  # `states` shape. Declarative ONLY — `condition` is documentation, NEVER eval'd, same rule as
  # `formula`. Required non-empty when computation_class == structural_state or an enumerated
  # domain/bounds exists; `[]` otherwise.
  states_shape:
    name:        "human-readable state label"
    value:       "the emitted numeric value"
    condition:   "the predicate, as prose/pseudocode — never executed"
    description: "what this state means about the market"

  # ═══════════════════════════════════════════════════════════════════════════
  # CANONICAL MARKET ONTOLOGY EVOLUTION CONTRACT (adopted 2026-07-25)
  # ═══════════════════════════════════════════════════════════════════════════
  # The ontology is the SUPREME semantic authority (user decision 2026-07-25: LITERAL
  # SUPERSESSION — authority #1, first-mover; runtime/models and the historical §4.0/§6.5
  # precedence DERIVE from it for MEANING). Every market concept must exist as a canonical node
  # with full lineage; discovered-but-undefined behaviour becomes an explicit UNKNOWN node here,
  # never a TODO or a comment.
  #
  # TWO MECHANICAL CONSTRAINTS (physical — keep supremacy coherent, NOT doctrine-overridable):
  #   1. frozen_runtime_keys stay FLAT + additive: primitives/feature_compositions/derived_metrics
  #      are read by crt_engine_v2 at import (fm_resolve.bind_phase2_crt_callables). The ontology
  #      may change first, but frozen-key edits are additive-only or the engine hard-crashes on
  #      import. New node types live in the NON-frozen sibling sections named below.
  #   2. An ontology change that would alter PRODUCTION behaviour cascades through parity-proof +
  #      the promotion gate before it reaches runtime. "Ontology first" governs the ORIGIN and
  #      REQUIREMENT of a change, not an automatic unvalidated runtime mutation (anti-split-brain).
  #
  # The semantic sections are ADDITIVE and NOT in features/registry `_ITERATED_SECTIONS`, so they
  # are invisible to the frozen runtime binding and to validate_registry. A SEPARATE validator,
  # features.registry.validate_semantic_registry, enforces the contract below.
  semantic_registry:
    version: 1
    # NON-frozen sibling sections that hold contract node types (validated by
    # validate_semantic_registry; never read on the runtime binding path).
    sections:
      - state_transitions        # edges of a state machine as first-class nodes
      - regimes                  # volatility / trend / market regimes
      - execution_behaviours     # how the engine/resolver behaves when acting
      - risk_behaviours          # risk-gate / sizing behaviours
      - model_contracts          # model input/output contracts
      - invariants               # properties that must always hold
      - canonical_unknowns       # UNKNOWN_* nodes awaiting refinement (permanent citizens)
      - reasoning_capabilities   # WHAT KIND of market-reasoning question a model answers, bottom-up
                                  # extracted from existing model behaviour (never invented a-priori
                                  # — see docs/governance/REASONING_CAPABILITY_REGISTRY.md). A capability
                                  # groups 1+ market questions (miar_registry.json market_question_matrix)
                                  # that are the SAME reasoning axis at a coarser grain, even when
                                  # answered by different models today. Grants NO authority (§6.5) —
                                  # informational only; never read on the runtime binding path.
    # Refinement ladder — the KNOWLEDGE axis (distinct from `lifecycle`, the EXECUTION contract).
    # A node refines IN PLACE up this ladder; its identity (id) never changes, no duplicate node.
    knowledge_status_ladder:
      - UNKNOWN                   # behaviour observed to exist but not characterized
      - OBSERVED                  # measured once; mechanism not proven
      - CHARACTERIZED             # mechanism understood qualitatively
      - MATHEMATICALLY_DEFINED    # a precise definition exists
      - FORMULA_DERIVED           # an executable formula exists
      - VALIDATED                 # cross-checked against independent evidence
      - PRODUCTION_CERTIFIED      # earned production authority (§6.5 — measured G001)
      - STABLE                    # frozen canonical semantic
    # WHAT KIND of market object a node is.
    semantic_category_vocabulary:
      - Feature
      - Formula
      - DerivedMathematics
      - State
      - Transition
      - Pattern
      - Regime
      - Context
      - Structure
      - Zone
      - Geometry
      - LiquidityBehaviour
      - VolatilityBehaviour
      - ExecutionBehaviour
      - RiskBehaviour
      - ModelInput
      - ModelOutput
      - ValidationRule
      - Invariant
      - Unknown
      - ReasoningCapability     # a market-reasoning question-axis, bottom-up extracted from
                                 # existing model behaviour (reasoning_capabilities section)
    # Every node in a semantic section MUST carry these keys. A field's VALUE may be UNKNOWN / []
    # until discovered (contract: "may remain UNKNOWN, never fabricate"), but the key must be
    # PRESENT. `evidence` and `origin` must be non-empty (not UNKNOWN) once status is above UNKNOWN.
    semantic_node_required_fields:
      - id                       # unique across ALL sections (FM-0NN and SEM-/UNK- ids)
      - canonical_name
      - aliases
      - semantic_category        # in semantic_category_vocabulary
      - knowledge_status         # in knowledge_status_ladder
      - description
      - observed_behaviour
      - mathematical_definition
      - units
      - formula
      - dependencies
      - required_inputs
      - produced_outputs
      - producers
      - consumers
      - transitions
      - validation_rules
      - confidence
      - evidence
      - origin
      - status
      - version
      - owner
      - traceability
      - notes
    # EPISTEMIC BLOCK (2026-07-25) — separate epistemic LEVELS so a hypothesis never becomes a
    # "fact" by repetition. A research-stage node carries an `epistemic:` mapping with these keys.
    # MANDATORY when knowledge_status == UNKNOWN; ENCOURAGED for OBSERVED / CHARACTERIZED. When
    # present on any node it is always validated. `observation` lives in the node's
    # `observed_behaviour`; supporting `evidence` in the node's `evidence` field.
    #   Component          | Purpose                              | May change?
    #   known_invariants   | facts already validated              | only with new evidence
    #   unknown_mechanism  | the single unanswered question       | yes
    #   candidate_hypotheses | explicitly-untested guesses (NOT truth) | yes
    #   resolution_metric  | how the question will be answered    | can evolve if improved
    #   falsification_conditions | what evidence would DISPROVE the hypotheses | can evolve
    epistemic_fields:
      - known_invariants          # a list; facts already validated (change only with new evidence)
      - unknown_mechanism         # prose; the single unanswered question
      - candidate_hypotheses      # a list; NEVER ontology truth
      - resolution_metric         # prose/list; how it will be answered
      - falsification_conditions  # a list; what evidence would prove the hypotheses WRONG
    research_stage_statuses:      # where the epistemic discipline applies
      - UNKNOWN                   # epistemic block MANDATORY
      - OBSERVED                  # ENCOURAGED
      - CHARACTERIZED             # ENCOURAGED
    unknown_token: UNKNOWN        # the only permitted stand-in for an undiscovered value

# Leaf/base inputs of the dependency DAG — raw OHLCV plus out-of-ontology upstream quantities
# (rolling indicators / structural levels) that derived metrics legitimately consume. These are
# terminal nodes: every registered feature's depends_on chain resolves down to this set.
base_inputs:
  - open
  - high
  - low
  - close
  - volume
  # atr / ema_fast / ema_slow were promoted to first-class registered `rolling_indicators`
  # (FM-041/043/044) on 2026-07-12 — they are no longer leaves; the DAG grounds them via true_range/close.
  - close_delta    # close.diff() — one-bar price change
  - ref_high       # trailing swing-high reference price (structural — out of scope, a leaf)
  - ref_low        # trailing swing-low reference price
  - bos_level      # last break-of-structure price level
  - disp_open      # displacement-candle open  (cross-candle context for FM-027)
  - disp_close     # displacement-candle close
  - retest_close   # retest-candle close
  # 2026-07-31 (FM-070): CRT engine bar-index counters. Structural state-machine bookkeeping, not
  # OHLCV market math — a leaf by the same rule as disp_open/disp_close/retest_close.
  - current_candle_index   # CRT engine's running bar index
  - retest_candle_index    # bar index of the candle that confirmed the active retest
  # T-16/Item-2 (2026-07-19): timestamp is the calendar root for `temporal_context` (FM-051/052).
  # A leaf by the same rule as ref_high/ref_low/bos_level — it is raw input, not derived from OHLC.
  # Already a raw input in scripts/analysis/feature_dag_layers.py (_RAW_INPUTS), so this aligns the
  # ontology with the DAG rather than introducing a new concept.
  - timestamp      # bar open time (UTC) — calendar root (structural — out of scope, a leaf)

primitives:
  body_size:
    id:        FM-001
    version:   1
    lifecycle: consumable
    formula:   "abs(close - open)"
    impl:      candle_math.body_size
    depends_on: [open, close]
    taxonomy:
      category:        CandleGeometry
      knowledge_class: Primitive
    semantics:
      description:   "Absolute distance between the candle's open and close."
      why_it_exists: "The magnitude of committed directional movement within the bar — the numerator of every conviction ratio and the base of displacement strength."
      interpretation:
        high: "Price travelled far from open to close: participants committed in one direction."
        low:  "Open and close nearly coincide: the bar resolved indecisively regardless of its range."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      candle_math.body_size
      consumed_by:      [UNKNOWN]
      vector_key:       body_size
      vector_index:     27
  candle_range:
    id:        FM-002
    version:   1
    lifecycle: consumable
    formula:   "high - low"
    impl:      candle_math.candle_range
    depends_on: [high, low]
    # Exact equality — NOT a second formula identity. Pipeline CANONICAL_FEATURES
    # key remains `wick_size` for schema stability; resolves to this identity.
    aliases:   [wick_size]                       # READ-side only (historical records); never emitted
    vector_key: candle_range                     # v4.0: the slot finally carries the honest name
    # ── B0/B1 wick_size misnomer governance (2026-07-12) — RESOLVED 2026-07-22 ──
    semantic_quantity: candle_range              # the REAL quantity: high - low (full range)
    misnomer_alias:    wick_size                 # the v3.0 vector slot name, now retired
    status:            resolved_renamed_v4       # was deprecated_misnomer_alias until 2026-07-22
    wick_magnitude_is: total_wick                # actual wick magnitude = FM-005 (upper_wick+lower_wick)
    migration_class:   IDENTITY_CLARIFICATION    # slot math unchanged; identity made unmistakable
    artifact_compatibility: LEGACY_BOUND         # v3 artifacts bind the old NAME; math unchanged
    note: >
      RESOLVED 2026-07-22 (SCHEMA-V4-VECTOR-MIGRATION): the canonical vector key is now
      `candle_range`, so the slot name and the quantity finally agree. The math NEVER changed —
      it was always high-low — which is why this was a rename and not a formula correction.
      `wick_size` survives ONLY as a read-side alias for historical records; it must never be
      emitted. Do not register a separate FM-id for it. Actual wick magnitude remains FM-005
      total_wick (upper+lower). Original 2026-07-12 framing, kept per §6.2 rule 4: "the name
      `wick_size` is a DEPRECATED MISNOMER ... slot math is FROZEN (would break vector slot 28 /
      trained artifacts)" — the freeze held; the rename was executed under an explicit waiver with
      per-artifact reconciliation. B1/F5 fresh-reproduced 2026-07-12.
      Distinct from total_wick (FM-005 = upper+lower wick = range-body) and from
      live_engine_hook total_wick under the same historical name (GD-001 family).
    taxonomy:
      category:        CandleGeometry
      knowledge_class: Primitive
    semantics:
      description:   "Full high-to-low extent of the bar."
      why_it_exists: "The bar's total opportunity span — the denominator that converts absolute movement into a scale-free conviction ratio."
      interpretation:
        high: "Wide bar: the market explored a large price area within the period."
        low:  "Narrow bar: compression, little exploration."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      candle_math.candle_range
      consumed_by:      [UNKNOWN]
      vector_key:       candle_range
      vector_index:     28
  upper_wick:
    id:        FM-003
    version:   1
    lifecycle: parity_verified
    formula:   "high - max(open, close)"
    impl:      candle_math.upper_wick
    depends_on: [open, high, close]
    taxonomy:
      category:        CandleGeometry
      knowledge_class: Primitive
    semantics:
      description:   "Distance from the bar's high down to the top of its body."
      why_it_exists: "Measures upside rejection — price that was reached and then given back before the close."
      interpretation:
        high: "Sellers rejected higher prices: an upside probe failed."
        low:  "The close held near the high: no upside rejection."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      candle_math.upper_wick
      consumed_by:      [UNKNOWN]
      vector_key:       []
      vector_index:     []
  lower_wick:
    id:        FM-004
    version:   1
    lifecycle: parity_verified
    formula:   "min(open, close) - low"
    impl:      candle_math.lower_wick
    depends_on: [open, low, close]
    taxonomy:
      category:        CandleGeometry
      knowledge_class: Primitive
    semantics:
      description:   "Distance from the bottom of the bar's body down to its low."
      why_it_exists: "Measures downside rejection — price that was reached and then recovered before the close."
      interpretation:
        high: "Buyers rejected lower prices: a downside probe failed."
        low:  "The close held near the low: no downside rejection."
    states: []
    lineage:
      derivation_depth: 1
      produced_by:      candle_math.lower_wick
      consumed_by:      [UNKNOWN]
      vector_key:       []
      vector_index:     []
  total_wick:
    id:        FM-005
    version:   1
    lifecycle: parity_verified
    formula:   "upper_wick + lower_wick"     # == candle_range - body_size
    impl:      candle_math.total_wick
    depends_on: [upper_wick, lower_wick]
    taxonomy:
      category:        CandleGeometry
      knowledge_class: Primitive
    semantics:
      description:   "Combined length of both wicks; equivalently candle_range - body_size."
      why_it_exists: "Total rejected price travel — the portion of the bar's range the market refused to hold."
      interpretation:
        high: "Most of the bar's range was rejected: indecision or a failed probe."
        low:  "Little rejection: the bar's range was mostly committed body."
    states: []
    lineage:
      derivation_depth: 2
      produced_by:      candle_math.total_wick
      consumed_by:      [UNKNOWN]
      vector_key:       []
      vector_index:     []

feature_compositions:
  body_ratio:
    id:          FM-010
    version:     1
    lifecycle:   consumable
    numerator:   body_size
    denominator: candle_range
    bounded:     [0, 1]
    active:      true
    depends_on:  [body_size, candle_range]
    note: >
      CANONICAL body_to_range_ratio. Identity FEAT-BODY_TO_RANGE_RATIO / FORMULA-BODY-TO-RANGE.
      The CRT displacement gate `body_ratio >= 0.70` is coherent ONLY against this bounded [0,1]
      definition. Verified 2026-07-05 that the CRT Candle property and the batch pipeline both
      compute this. Distinct from body_to_total_wick_ratio (FM-013).
    taxonomy:
      category:        CandleGeometry
      knowledge_class: Derived
    semantics:
      description:   "Fraction of the candle's full range occupied by its body, bounded [0, 1]."
      why_it_exists: "The canonical conviction measure. Scale-free, so one threshold (the CRT displacement gate at 0.70) is coherent across instruments and price levels."
      interpretation:
        high: "Decisive candle — the market moved and held; little was rejected."
        low:  "Indecision — the range was explored but surrendered before the close."
    states: []
    lineage:
      derivation_depth: 2
      produced_by:      candle_math.body_ratio
      consumed_by:      [UNKNOWN]
      vector_key:       body_ratio
      vector_index:     29
  body_to_total_wick_ratio:
    id:          FM-013
    version:     1
    lifecycle:   registered
    numerator:   body_size
    denominator: total_wick
    bounded:     null
    active:      false
    depends_on:  [body_size, total_wick]
    impl:        candle_math.body_to_total_wick_ratio
    note: >
      DISTINCT semantic (Phase-1 identity closure). body/total_wick — historically live_engine_hook
      bare name body_ratio (GD-001 / Q-BODY-RATIO-NONCANON-LIVE). Identity
      FEAT-BODY_TO_TOTAL_WICK_RATIO / FORMULA-BODY-TO-TOTAL-WICK. Must not share governed bare name
      body_ratio with FM-010. Unbounded above 1 when body > wicks.
    taxonomy:
      category:        CandleGeometry
      knowledge_class: Derived
    semantics:
      description:   "Body size relative to total wick length; unbounded above 1 when the body exceeds the wicks."
      why_it_exists: "An alternative conviction framing that contrasts commitment against rejection directly, rather than against the full range."
      interpretation:
        high: "Body dwarfs the wicks — movement met almost no rejection."
        low:  "Wicks dominate — the bar was mostly rejected travel."
    states: []
    lineage:
      derivation_depth: 3
      produced_by:      candle_math.body_to_total_wick_ratio
      consumed_by:      [UNKNOWN]
      vector_key:       []

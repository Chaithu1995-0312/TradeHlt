migration_candidates:
  ema_spread_atr:
    id:                 FM-030
    replaces:           FM-022                        # ema_spread (legacy price-scaled)
    status:             proposed_correction
    active:             false
    semantic_version:   "2.0-atr-absolute"
    formula:            "(ema_fast - ema_slow) / (atr * close) if atr>0 and close>0 else nan"
    units:              dimensionless                 # divides by ABSOLUTE atr (atr*close) -> scale-invariant
    normalization_basis: atr_absolute
    depends_on:         [ema_fast, ema_slow, atr, close]
    migration_class:    FORMULA_CORRECTION
    requires:           [retrain_inactive_artifacts, recalibrate_active_thresholds]
    proof:              "scale-invariance verified in tests/test_b0b1_feature_semantic_migration.py"
  momentum_score_atr:
    id:                 FM-031
    replaces:           FM-023                        # momentum_score (legacy price-scaled)
    status:             proposed_correction
    active:             false
    semantic_version:   "2.0-atr-absolute"
    formula:            "close_delta / (atr * close) if atr>0 and close>0 else nan"
    units:              dimensionless
    normalization_basis: atr_absolute
    depends_on:         [close_delta, atr, close]
    migration_class:    FORMULA_CORRECTION
    requires:           [retrain_inactive_artifacts, recalibrate_active_thresholds]
    proof:              "scale-invariance verified in tests/test_b0b1_feature_semantic_migration.py"


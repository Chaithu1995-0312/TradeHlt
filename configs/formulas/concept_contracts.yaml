  # ═══════════════════════════════ TRADING (slice 2) ═══════════════════════════════
  # What a trade PLAN means: thesis, its roles on market prices, cost, measured outcome.
  # Roles never write a level's status (I-10). Fills, position lifecycle, approval and the exit
  # schedule (partial fractions, stop management) are Decision/Execution — slice 3 (user, D2-6).

  TRS-01:
    canonical_name: thesis
    layer: TRADING
    kind: THESIS
    status: ACCEPTED
    definition: "A directional claim on one MKT-P01 episode, born on the bar of its MKT-E04 displacement. A sweep with no displacement is an episode that never became a thesis, not a failed thesis."
    identity: {reference: MKT-P01, timeframe: per_founding, clock: per_founding, availability_rule: "bar of MKT-E04"}
    parameterization: {founding: {domain: "MKT-L01.founding", identity_bearing: true}}
    inputs: [MKT-P01, MKT-E01, MKT-E04]
    rule: "direction = the implied bias of the MKT-E01 sweep, confirmed by MKT-E04 (GP-06 away from the swept side, F-074). A thesis binds exactly one TRS-03 invalidation and one TRS-05 stop (I-11); it may bind a TRS-02 objective, a TRS-04 entry and TRS-06 targets."
    roles: {invalidation: TRS-03, stop: TRS-05, objective: TRS-02, entry: TRS-04, target: TRS-06}
    units: {domain: direction, values: [LONG, SHORT]}
    lifecycle: {states: [ACTIVE, FAILED, SPENT, EXPIRED], transitions: {TRS-03: FAILED, MKT-E11: SPENT, MKT-E12: EXPIRED}, terminal_authority: MARKET, expiry_rule: "MKT-E12 expires the thesis only while its episode is at MKT-P01.DISPLACED. From MKT-P01.EXTENDED on, a rollover is context, not termination (R1-B): the thesis then ends by TRS-03, MKT-E11, or the episode's expansion TTL (PRODUCER, O-4)."}
    absence: "No MKT-E04 after the sweep -> no thesis (None)."
    authority: {evidence: [REPO, USER_DECISION], sources: [src/config_layer/crt_engine_v2.py, src/structure/predicates.py], lineage: [F-074, D2-1]}
    divergences:
      - {surface: "CRTEngine.try_range_to_sweep (crt_engine_v2.py:1112)", current: "state.direction is set on the SWEEP transition, before any displacement", contract: "direction belongs to a thesis, which exists only from MKT-E04 (D2-1)", disposition: RECORDED}
    version: 2   # R1-B: stage-dependent expiry

  TRS-02:
    canonical_name: objective
    layer: TRADING
    kind: OBJECTIVE
    status: ACCEPTED
    definition: "A role on a market level: the price a directional bias expects to reach. The level keeps its own status (I-10)."
    identity: {reference: "MKT-L01 founding", timeframe: per_founding, clock: per_founding, availability_rule: "bar the bias exists and the level is available"}
    parameterization:
      scope: {domain: [parent_range], identity_bearing: true}
    inputs: [MKT-L01, GP-02, GP-03]
    rule: "LONG: target = h_ref; SHORT: target = l_ref. ACHIEVED = GP-03 REACH of the target; INVALIDATED = GP-02 BEYOND of the opposite range edge; otherwise EXISTS; NONE until a bias exists (htf_state.resolve_objective). Scope parent_range only: the bias is the parent-track C3 bias; an M15 objective is PROPOSED (spec §11)."
    units: {unit: price, normalization_basis: none}
    lifecycle: {states: [NONE, EXISTS, ACHIEVED, INVALIDATED], transitions: {GP-03: ACHIEVED, GP-02: INVALIDATED}, terminal_authority: MARKET}
    absence: "status NONE with target None."
    authority: {evidence: [REPO], sources: [src/config_layer/htf_state.py], lineage: [F-078]}
    divergences:
      - {surface: "htf_state.resolve_objective / Objective (htf_state.py:116-141)", current: "one record carries both the target and invalidate_at", contract: "the target is TRS-02; the opposite edge is an invalidation role (TRS-03 family) on the same range", disposition: RECORDED}
      - {surface: "parent C3 bias", current: "the bias input is the parent-track C3 state, whose stage mapping is PROPOSED (F-075/F-077)", contract: "scope parent_range is accepted on the htf_state rule alone", disposition: RECORDED}
    version: 1

  TRS-03:
    canonical_name: invalidation
    layer: TRADING
    kind: INVALIDATION
    status: ACCEPTED
    definition: "The rule that says a thesis is wrong. It ends the thesis, not the position. Expiry (MKT-E12) and a spent move (MKT-E11) end a thesis without falsifying it and are not invalidations."
    identity: {reference: TRS-01, timeframe: per_founding, clock: per_founding, availability_rule: "the role (its retracement level) on the MKT-E04 bar; its firing (MKT-E10) on the breach bar"}
    parameterization:
      retrace_fraction: {domain: float, identity_bearing: true, default_ref: crt_engine.retrace_reset_pct}
    inputs: [TRS-01, MKT-E10, MKT-L02]
    rule: "MKT-E10 against the thesis direction on the MKT-L02 retracement of the displacement move at retrace_fraction. The displacement move runs from MKT-E01 sweep_extreme (the sweep bar's wick, R1-A) to the MKT-E04 close; MKT-E11 (SPENT) measures its extension on the same move (user, 2026-10-02; reference price normalised 2026-10-03). The invalidation still applies after a rollover the thesis survives (R1-B)."
    units: {domain: event}
    lifecycle: null
    absence: "n/a (a thesis without an invalidation is not tradable, I-11)."
    authority: {evidence: [REPO, USER_DECISION], sources: [src/config_layer/crt_engine_v2.py], lineage: [D2-2]}
    divergences:
      - {surface: "ResetLogic.should_reset retrace (crt_engine_v2.py:2898-2909)", current: "the move is the displacement candle body abs(close-open), and the retrace fires at retrace >= retrace_reset_pct (inclusive); the 1.618 extension (:2911-2923) measures from sweep_event.price, the sweep WICK, to the displacement close (CORRECTED 2026-10-03: previously recorded as 'sweep level'; found by integration run 20261002T192245Z bar 1019)", contract: "one move (MKT-E01 sweep_extreme to displacement close) for both invalidation and extension; the breach is GP-02 strict. The engine's extension now matches the contract; the retrace (body, >=) still differs", disposition: RECORDED}
      - {surface: "ResetLogic.should_reset HTF protection (crt_engine_v2.py:2882-2891)", current: "after the HTF clock flips during EXPANSION/RETEST the function returns before the retrace rule, so a surviving setup is never invalidated by price again", contract: "a thesis that survives a rollover (R1-B) can still FAIL on MKT-E10", evidence: "integration run results/semantic_os_integration/20261002T192245Z", disposition: RECORDED}
      - {surface: "ResetLogic.should_reset (crt_engine_v2.py:2876)", current: "all resets are suppressed while a trade is OPEN or TP1, so an invalidation after entry is neither acted on nor recorded", contract: "the invalidation is recorded on the thesis; whether it also closes the position is a Decision/Execution policy", disposition: RECORDED, decided_in: slice_3, decision: "When a thesis is invalidated while its position is open, does the position close?", resolution: "a policy, not a rule: DEX-07 exit_rule parameter on_invalidation in {hold, close_on_invalidation, close_on_origin}; the invalidation is always recorded on the thesis (user, D3-1)"}
    version: 2   # R1-A, R1-B

  TRS-04:
    canonical_name: entry
    layer: TRADING
    kind: ENTRY
    status: ACCEPTED
    definition: "The price and bar at which a plan is entered. The fill is observable only on or after the bar of the decision to enter (I-6)."
    identity: {reference: TRS-01, timeframe: bar, clock: bar_close, availability_rule: "fill bar"}
    parameterization:
      entry_semantics: {domain: [resting_order], legacy_values: [approval_bar_legacy], identity_bearing: true}
    inputs: [TRS-01, MKT-E09]
    rule: "resting_order: the plan is decided and filled at the close of the MKT-E09 retest bar; the confirmation bars after it are walked, and an unconfirmed plan is closed at that bar's close (crt_engine_v2.py entry_semantics)."
    units: {unit: price, normalization_basis: none}
    lifecycle: null
    absence: "No retest after the thesis -> no entry (None)."
    authority: {evidence: [REPO], sources: [src/config_layer/crt_engine_v2.py], lineage: [F-110]}
    divergences:
      - {surface: "setup.entry_semantics = approval_bar_legacy (active config)", current: "the RETEST close is booked on the later approval bar and the bar between is never walked for SL/TP", contract: "resting_order; a fill is never priced from before its own decision bar without walking the bars between (I-6)", evidence: "F-110: 16 of 16 filled orders end within one bar", disposition: RECORDED}
    version: 1

  TRS-05:
    canonical_name: stop
    layer: TRADING
    kind: STOP
    status: ACCEPTED
    definition: "The price that closes the position at a loss. A role on a market price; distinct from the thesis invalidation (I-11)."
    identity: {reference: TRS-01, timeframe: bar, clock: bar_close, availability_rule: "bar the plan is built"}
    parameterization:
      anchor: {domain: [displacement, sweep_extreme], identity_bearing: true, default_ref: backtest.sl_anchor}
      buffer_atr: {domain: float, identity_bearing: true, default_ref: crt_engine.sl_atr_buffer}
    inputs: [TRS-01, MKT-E01, MKT-E04, MKT-L02]
    rule: "LONG: anchor low - buffer_atr * ATR; SHORT: anchor high + buffer_atr * ATR. anchor displacement = the MKT-E04 candle's extreme (a MKT-L02 candle_extreme); sweep_extreme = the swept candle's wick extreme. ATR is the plan bar's absolute ATR (FM-074). A stop on the wrong side of entry rejects the plan (ExecutionEngine.stop_price / build_trade)."
    units: {unit: price, normalization_basis: none}
    lifecycle: null
    absence: "None when there is no displacement candle, no direction, or anchor sweep_extreme without a sweep."
    authority: {evidence: [REPO], sources: [src/config_layer/crt_engine_v2.py], lineage: [F-072]}
    divergences:
      - {surface: "other stop constructions in the active config", current: "strategy_engine.s01..s10.sl_atr_mult, inout.exit.sl_atr_buffer_mult, sl_tp_comparison.legacy_sl_atr_mult build stops by other rules", contract: "one stop concept; other constructions are separate representations (unmapped in slice 2)", disposition: RECORDED}
    version: 1

  TRS-06:
    canonical_name: target
    layer: TRADING
    kind: TARGET
    status: ACCEPTED
    definition: "A price at which the plan expects to take profit. A role: either derived from the plan (a multiple of R) or placed on a market level."
    identity: {reference: TRS-01, timeframe: bar, clock: bar_close, availability_rule: "bar the plan is built"}
    parameterization:
      ordinal: {domain: [1, 2], identity_bearing: true}
      target_policy: {domain: [fixed_r, structural_tp2], identity_bearing: true, applies_to: [2], default_ref: setup.target_policy}
      r_multiple: {domain: float, identity_bearing: true}
      intent: {domain: [liq_sweep, pullback, breakout, reversal], identity_bearing: true, applies_to: [1]}
    inputs: [TRS-01, TRS-04, TRS-05, MKT-L01]
    rule: "R = |entry - stop|. fixed_r: target = entry +/- r_multiple * R. structural_tp2: target 2 = the opposite edge of the founding range (a MKT-L01 level in a TARGET role); the plan is rejected if that edge is behind entry or closer than 1R; under structural_tp2 r_multiple is not used and is not part of that target's identity. Target 1's r_multiple is chosen by intent (ExecutionEngine._derive_trade_intent, crt_engine_v2.py:2529)."
    units: {unit: price, normalization_basis: none, multiplier_unit: R}
    lifecycle: null
    absence: "None when the plan has no stop (R undefined)."
    authority: {evidence: [REPO], sources: [src/config_layer/crt_engine_v2.py, src/config_layer/state_identity.py], lineage: [STORY-83.11]}
    divergences:
      - {surface: "config keys tp1_atr_multiplier_* / tp2_atr_multiplier", current: "named ATR multipliers", contract: "they multiply R (crt_engine_v2.py build_trade)", disposition: RECORDED}
      - {surface: "intent labels", current: "a classifier over RETEST features selects the target-1 multiple", contract: "the labels carry no defined market meaning yet; they are a parameter of the target, not concepts", disposition: RECORDED}
    version: 1

  TRS-07:
    canonical_name: cost
    layer: TRADING
    kind: MEASUREMENT
    status: ACCEPTED
    definition: "The round-trip cost of one plan, in price and in R (cost_r = cost_price / R)."
    identity: {reference: TRS-01, timeframe: plan, clock: bar_close, availability_rule: "flat_bps: bar the plan is built; component: the exit bar (it depends on the exit kind)"}
    parameterization:
      cost_model: {domain: [component, flat_bps], identity_bearing: true}
      cost_source: {domain: str, identity_bearing: true}
    inputs: [TRS-04, TRS-05]   # plus the exit kind of the walk that consumes it (TRS-08); not listed to keep the graph acyclic
    rule: "component: research.costs.ComponentCostModel (half spread both legs, commission per leg, entry slippage, stop slippage only on stop exits; SEM-015); the exit kind is the walk's actual exit (stop exit = forward_walk SL_HIT, or multi_tp_walk.is_stop_exit), never a caller's assumption. flat_bps: research.costs.CostModel (round-trip bps of entry). cost_source names the calibration (manifest + sha256, or SYNTHETIC)."
    units: {unit: R, normalization_basis: "risk distance |entry - stop|", missing_rule: "a cost model with status UNKNOWN yields no cost (None), never 0"}
    lifecycle: null
    absence: "None when the cost model is UNKNOWN or the plan has no stop."
    authority: {evidence: [REPO], sources: [src/research/costs.py], lineage: [SEM-015, F-082]}
    divergences:
      - {surface: "research flat 12 bps default", current: "~11x the measured XAUUSD cost (F-082)", contract: "the cost model is part of every outcome's identity (I-15)", disposition: RECORDED}
    version: 1

  TRS-08:
    canonical_name: outcome
    layer: TRADING
    kind: OUTCOME
    status: ACCEPTED
    definition: "The R result of walking one plan forward through a named walk under a named cost model (I-15)."
    identity: {reference: TRS-01, timeframe: bar, clock: bar_close, availability_rule: "exit bar"}
    parameterization:
      walk: {domain: [forward_walk, multi_tp_walk], identity_bearing: true}   # forward_walk_oco removed 2026-10-02: it walks a two-sided box, not the thesis direction
      basis: {domain: [gross, net], identity_bearing: true}
      cost_model: {domain: [component, flat_bps, none], identity_bearing: true}
      cost_source: {domain: str, identity_bearing: true, applies_to: [net]}
      walk_params: {domain: mapping, identity_bearing: true}
    inputs: [TRS-04, TRS-05, TRS-06, TRS-07]
    rule: "gross: R from the walk (intrabar high/low touch; stop is checked before targets on the same bar), cost_model none. net: gross minus TRS-07 cost_r computed from the walk's actual exit; cost_model and cost_source name the TRS-07 model and its calibration. A walk_params value that is a dataclass (SEM-016 AdverseFill) enters the identity as its type name plus fields. walk_params holds every walk argument that changes the result (multi_tp_walk partial_fraction, trail_fraction, stop_policy, tie_break, max_forward; forward_walk exit_model, max_forward) and is declared by the caller at measurement time, so a REP names the walk and the measurement records walk_params."
    units: {unit: R, normalization_basis: "risk distance |entry - stop|", missing_rule: "an unwalkable plan (no future bars) has no outcome (None)"}
    lifecycle: null
    absence: "None until the walk reaches an exit or its horizon."
    authority: {evidence: [REPO], sources: [src/research/measurement/forward_walk.py, src/research/oracle/multi_tp_walk.py], lineage: [SEM-017, F-088]}
    divergences:
      - {surface: "forward_walk", current: "one target, no partial exit, no stop move", contract: "an outcome is only comparable to production when its walk matches production's exit plan; the walk is identity-bearing", evidence: "F-088", disposition: RECORDED}
    version: 1

  # ═══════════════════════════════ DECISION / EXECUTION (slice 3) ═══════════════════════════════
  # What happens to a real position: size, admission, fill, approval, lifecycle, exits, carry,
  # realised result. Never redefines a market or trading concept (I-3); a decision may end a
  # PLAN or a POSITION, never a thesis. User decisions D3-1..D3-6 (spec §14).
  # Order of one position: plan (TRADING) -> DEX-01 size -> DEX-02 admission -> DEX-03 fill ->
  # DEX-04 approval (before the fill under approval_bar_legacy, after it under resting_order) ->
  # DEX-05 position under DEX-06 schedule and DEX-07 rules -> DEX-08 carry -> DEX-09 result.

  DEX-01:
    canonical_name: position_size
    layer: DECISION_EXECUTION
    kind: EXECUTION_SPEC
    status: ACCEPTED
    definition: "How much to trade: the quantity at which hitting the plan's stop loses exactly the chosen fraction of equity."
    identity: {reference: TRS-01, timeframe: plan, clock: bar_close, availability_rule: "bar the plan is built (equity as of that bar)"}
    parameterization:
      risk_fraction: {domain: float, identity_bearing: true, default_ref: backtest.risk_pct_per_trade}
      equity_basis: {domain: [initial_capital, current_equity], identity_bearing: true}
    inputs: [TRS-04, TRS-05]
    rule: "quantity = risk_fraction * equity / R, R = |entry - stop| in price per unit. risk_fraction is a FRACTION (0.01 = 1 percent), never a percent. equity_basis initial_capital uses the starting capital for every position; current_equity uses realised equity at the plan bar (closed positions only, never open P&L). Rounding to a broker lot step is execution detail outside this concept."
    units: {unit: instrument_units, normalization_basis: "risk distance |entry - stop|", missing_rule: "no stop -> no size (None)"}
    lifecycle: null
    absence: "None when the plan has no stop (R undefined) or R == 0."
    authority: {evidence: [REPO, USER_DECISION], sources: [src/config_layer/crt_engine_v2.py, src/core/ultron_risk_gate.py, src/runtime/backtest_v2.py], lineage: [F-111]}
    divergences:
      - {surface: "execution_planner.risk_percent / ultron_risk_gate.max_risk_per_trade_pct (live rail)", current: "a PERCENT (1.0 = 1 percent)", contract: "risk_fraction is a fraction", evidence: "F-111 (docs/governance/config_unit_registry.json)", disposition: RECORDED}
      - {surface: "backtest.sizing_mode = fixed_investment_inr with per_trade_investment_inr", current: "the backtest ledger sizes by a fixed rupee investment per trade, not by risk", contract: "size from risk_fraction and R", disposition: RECORDED}
      - {surface: "Trade.risk_pct (crt_engine_v2.py:215)", current: "a dataclass default 0.01 that the engine never reads from config", contract: "risk_fraction is an identity-bearing value declared by the caller", disposition: RECORDED}
    version: 1

  DEX-02:
    canonical_name: portfolio_admission
    layer: DECISION_EXECUTION
    kind: DECISION
    status: ACCEPTED
    definition: "Whether the portfolio has room for one more position. A plan over a cap is FILTERED, never shrunk to fit."
    identity: {reference: TRS-01, timeframe: bar, clock: bar_close, availability_rule: "fill bar (the open positions are those open at that bar's close)"}
    parameterization:
      max_concurrent_positions: {domain: int, identity_bearing: true}
      max_open_risk: {domain: float, identity_bearing: true}
    inputs: [DEX-01]   # plus the open DEX-05 positions at the fill bar; not listed to keep the graph acyclic
    rule: "ADMITTED iff (open positions + 1 <= max_concurrent_positions) and (sum of open positions' risk_fraction + this plan's risk_fraction <= max_open_risk). Otherwise FILTERED with reason_code portfolio_cap (terminal DECISION/FILTERED of the PLAN only). The size is never trimmed to fit. A filtered plan does not end its thesis: a later plan of the same ACTIVE thesis may be admitted. Positions of the same thesis count like any other and may overlap (user, D3-4/D3-5). Open risk is the risk_fraction at entry; a stop moved after TP1 does not reduce it. max_open_risk is a fraction of equity."
    units: {domain: verdict, values: [ADMITTED, FILTERED]}
    lifecycle: null
    absence: "n/a (every plan that reaches its fill bar gets a verdict)."
    authority: {evidence: [REPO, USER_DECISION], sources: [src/core/ultron_risk_gate.py, src/portfolio/allocator.py], lineage: [F-013, F-111]}
    divergences:
      - {surface: "PortfolioAllocator.allocate (src/portfolio/allocator.py:85-99)", current: "sizes risk from signal confidence and TRIMS it to fit the remaining cap; no count cap; nothing calls it (F-013)", contract: "fixed risk_fraction; over a cap the plan is FILTERED, never trimmed", disposition: RECORDED}
      - {surface: "UltronRiskGate.evaluate check 5 (ultron_risk_gate.py:363-372)", current: "rejects over_exposure on the open-risk cap, in PERCENT (max_portfolio_risk_pct 5.0), using min(risk, max_risk_per_trade_pct)", contract: "fractions; this plan's own risk_fraction", disposition: RECORDED}
      - {surface: "EngineState.active_trade (crt_engine_v2.py)", current: "the CRT engine holds one trade at a time, so it never opens a second position on any thesis", contract: "count and risk caps only; overlap allowed", disposition: RECORDED}
      - {surface: "inout.risk.max_concurrent_trades = 3 (active config)", current: "declared for the inout rail; no reader found in src/ by grep 2026-10-02", contract: "max_concurrent_positions", disposition: RECORDED}
    version: 1

  DEX-03:
    canonical_name: fill
    layer: DECISION_EXECUTION
    kind: EXECUTION
    status: ACCEPTED
    definition: "The moment an admitted plan becomes a position: one fill bar and one fill price."
    identity: {reference: TRS-01, timeframe: bar, clock: bar_close, availability_rule: "fill bar"}
    parameterization:
      entry_semantics: {domain: TRS-04.entry_semantics, legacy_values: [approval_bar_legacy], identity_bearing: true}
    inputs: [TRS-04, DEX-02]
    rule: "resting_order: fill bar = the MKT-E09 retest bar, fill price = its close (TRS-04). Entry slippage is a cost (TRS-07 component), never folded into the fill price, so it is charged once. An unadmitted plan never fills. A fill is observable only on its own bar or later (I-6)."
    units: {unit: price, normalization_basis: none}
    lifecycle: null
    absence: "None when the plan is FILTERED (DEX-02) or has no entry."
    authority: {evidence: [REPO], sources: [src/config_layer/crt_engine_v2.py], lineage: [F-110]}
    divergences:
      - {surface: "setup.entry_semantics = approval_bar_legacy (active config)", current: "booked one bar after the retest at the retest close", contract: "see TRS-04", evidence: "F-110", disposition: RECORDED}
    version: 1

  DEX-04:
    canonical_name: approval
    layer: DECISION_EXECUTION
    kind: DECISION
    status: ACCEPTED
    definition: "A decision rail's verdict on one plan: APPROVED, or FILTERED with a reason code. It ends a plan or a position, never a thesis or a market object (I-3)."
    identity: {reference: TRS-01, timeframe: bar, clock: bar_close, availability_rule: "bar the rail decides"}
    parameterization:
      rail: {domain: [crt_engine, planner_ultron], identity_bearing: true}
    inputs: [TRS-01, TRS-04, TRS-05, TRS-06, DEX-03]
    rule: "The rail is identity-bearing because the two rails approve different populations (F-103). Under approval_bar_legacy the verdict precedes the fill. Under resting_order the order fills at the retest close and the verdict follows on a later confirmation bar: APPROVED keeps the position; FILTERED closes it at that bar's close with exit reason UNCONFIRMED (crt_engine_v2.py close_unconfirmed). FILTERED reason codes come from terminal_reason_map.yaml class FILTERED. A FILTERED plan ends that plan only; the thesis stays ACTIVE (D3-4)."
    units: {domain: verdict, values: [APPROVED, FILTERED]}
    lifecycle: null
    absence: "None until the rail decides; a plan never reaching a decision bar has no verdict."
    authority: {evidence: [REPO], sources: [src/config_layer/crt_engine_v2.py, src/config_layer/execution_planner.py, src/core/ultron_risk_gate.py], lineage: [F-103, F-109, F-110]}
    divergences:
      - {surface: "backtest rail vs live rail", current: "backtest reaches the CRT engine filters but never ExecutionPlannerV1_2 / UltronRiskGate; live reaches the planner and Ultron but has no CRT state machine", contract: "one approval concept; the rail is a parameter", evidence: "F-103", disposition: RECORDED}
      - {surface: "planner_ultron on XAUUSD", current: "the planner gate cannot approve REVERSAL/CONTINUATION (ceiling 0.45 < 0.55); 26 of 27 replayed CRT trades reject_gate", contract: "a verdict means what the rail decided, not that the rail can approve", evidence: "F-109", disposition: RECORDED}
      - {surface: "CRT engine DECISION/FILTERED resets", current: "a filter resets the whole episode to RANGE", contract: "a filter ends the plan; the thesis keeps its own lifecycle (TRS-01)", disposition: RECORDED}
    version: 1

  DEX-05:
    canonical_name: position
    layer: DECISION_EXECUTION
    kind: EXECUTION
    status: ACCEPTED
    definition: "One filled plan from its fill to its close. A thesis may found several positions, which may overlap (D3-4/D3-5)."
    identity: {reference: TRS-01, timeframe: bar, clock: bar_close, availability_rule: "fill bar; each transition on its own bar"}
    parameterization: {}
    inputs: [DEX-01, DEX-03, DEX-06, DEX-07]
    rule: "instance_key = (anchor = fill bar, side = direction, parent = the thesis instance). OPEN on the fill bar; PARTIAL when the DEX-06 partial fills at target 1; CLOSED on the bar of exactly one exit_reason: STOP (initial stop, before target 1), TRAIL_STOP (runner stop after target 1), TARGET_FINAL (target 2), INVALIDATION or ORIGIN (DEX-07), TIMEOUT (DEX-07 ttl), UNCONFIRMED (DEX-04 FILTERED after a resting fill). Termination is EXECUTION/POSITION_CLOSED. Closing a position never changes its thesis's state, and a thesis ending never closes a position by itself (only DEX-07 can)."
    units: {domain: lifecycle}
    lifecycle: {states: [OPEN, PARTIAL, CLOSED], exit_reasons: [STOP, TRAIL_STOP, TARGET_FINAL, INVALIDATION, ORIGIN, TIMEOUT, UNCONFIRMED], terminal_authority: EXECUTION}
    absence: "None when there is no fill."
    authority: {evidence: [REPO, USER_DECISION], sources: [src/config_layer/crt_engine_v2.py], lineage: [F-088, F-110]}
    divergences:
      - {surface: "Trade.status (crt_engine_v2.py:2710-2844)", current: "PENDING / OPEN / TP1 / TP2 / STOPPED / STOPPED_STRUCTURAL / TIMEOUT / UNCONFIRMED; STOPPED covers both the initial stop and the runner's trailed stop", contract: "state and exit_reason are separate; STOP and TRAIL_STOP are distinct reasons", disposition: RECORDED}
      - {surface: "CRTState.EXECUTION / RESOLUTION", current: "position lifecycle carried as market CRT states", contract: "a position is not an episode stage (§3); remapping waits for L3 v2.0.0 (D-4)", disposition: RECORDED}
    version: 1

  DEX-06:
    canonical_name: exit_schedule
    layer: DECISION_EXECUTION
    kind: EXECUTION_SPEC
    status: ACCEPTED
    definition: "The resting exits of a position: how much closes at target 1, where the runner's stop moves after it, and which exit wins when one bar touches several."
    identity: {reference: TRS-01, timeframe: plan, clock: bar_close, availability_rule: "bar the plan is built"}
    parameterization:
      partial_fraction: {domain: float, identity_bearing: true, default_ref: execution_planner.partial_tp_fraction}
      trail_fraction: {domain: float, identity_bearing: true}
      tie_break: {domain: [stop_first], identity_bearing: true}
    inputs: [TRS-04, TRS-05, TRS-06]
    rule: "At target 1, partial_fraction of the position closes at target 1 and the runner's stop moves to entry + trail_fraction * (target1 - entry) (0 = breakeven; 0.5 = half way). The runner then exits at target 2 or the moved stop. stop_first: when one bar's range touches the stop and a target, the stop fills (intrabar touch on high/low). These are the multi_tp_walk arguments partial_fraction, trail_fraction and tie_break production (F-088), so a DEX-09 bar_replay result must equal multi_tp_walk under the same values."
    units: {unit: fraction, normalization_basis: "position quantity (partial_fraction); target1 - entry distance (trail_fraction)"}
    lifecycle: null
    absence: "n/a (every position has a schedule; a single-target plan is partial_fraction 1.0)."
    authority: {evidence: [REPO], sources: [src/config_layer/crt_engine_v2.py, src/research/oracle/multi_tp_walk.py], lineage: [SEM-017, F-088, F-056]}
    divergences:
      - {surface: "ExecutionEngine.update_trade (crt_engine_v2.py:2735, 2762)", current: "the partial 0.5 is a literal in the engine, while execution_planner.partial_tp_fraction is declared separately", contract: "partial_fraction is one identity-bearing value", disposition: RECORDED}
      - {surface: "execution_planner.partial_tp_breakeven_enabled", current: "named breakeven, but the runner stop moves half way to target 1 (crt_engine_v2.py:2765)", contract: "trail_fraction 0.5; the name is a recorded naming trap", evidence: "F-088", disposition: RECORDED}
      - {surface: "ExecutionEngine.update_trade docstring", current: "declares priority TP2 > SL > TP1", contract: "stop_first is the effective rule (_intrabar_trigger_price)", evidence: "F-088", disposition: RECORDED}
    version: 1

  DEX-07:
    canonical_name: exit_rule
    layer: DECISION_EXECUTION
    kind: EXECUTION_SPEC
    status: ACCEPTED
    definition: "The non-resting reasons a position closes: what to do when its thesis is invalidated, and an optional time limit."
    identity: {reference: TRS-01, timeframe: bar, clock: bar_close, availability_rule: "bar the plan is built; each firing on its own bar's close"}
    parameterization:
      on_invalidation: {domain: [hold, close_on_invalidation, close_on_origin], identity_bearing: true}
      precedence: {domain: [after_resting_fills], legacy_values: [absolute], identity_bearing: true, default_ref: crt_engine.displacement_origin_kill_precedence}
      ttl_bars: {domain: int, identity_bearing: true, default_ref: setup.trade_ttl_candles}
    inputs: [TRS-01, TRS-03, MKT-E04, DEX-06]
    rule: "D2-2 settled as a policy (user, D3-1). The TRS-03 invalidation is ALWAYS recorded on the thesis (FAILED), whatever the value. hold: the position ignores it and ends by DEX-06 exits or ttl. close_on_invalidation: close at the close of the MKT-E10 breach bar (exit_reason INVALIDATION). close_on_origin: close at the close of the first bar after the fill that closes beyond the open of the founding MKT-E04 candle against the direction (exit_reason ORIGIN; SEM-021). Both are close-triggered and booked at that close. after_resting_fills: on that bar the stop, targets and partial fill first; the rule closes what is left. ttl_bars: close at the close of the ttl-th bar after the fill if nothing else fired (exit_reason TIMEOUT); no value = no time limit. No setting claims economic value (SEM-021 is unmeasured)."
    units: {domain: policy}
    lifecycle: null
    absence: "n/a"
    authority: {evidence: [REPO, USER_DECISION], sources: [src/config_layer/crt_engine_v2.py, src/config_layer/state_identity.py], lineage: [D2-2, SEM-021, STORY-83.11]}
    divergences:
      - {surface: "ResetLogic.should_reset (crt_engine_v2.py:2876)", current: "an invalidation after entry is neither acted on nor recorded", contract: "always recorded on the thesis", disposition: RECORDED}
      - {surface: "crt_engine.displacement_origin_kill_precedence = absolute", current: "evaluates the kill before resting fills on the same bar, which can cancel a fill that already happened", contract: "after_resting_fills; absolute is a declared measurement weakness (SEM-021)", disposition: RECORDED}
      - {surface: "active config crt_engine.displacement_origin_kill_enabled = true", current: "the active engine is close_on_origin", contract: "on_invalidation is a declared value; close_on_origin is one of three", disposition: RECORDED}
    version: 1

  DEX-08:
    canonical_name: carry
    layer: DECISION_EXECUTION
    kind: MEASUREMENT
    status: ACCEPTED
    definition: "Overnight financing (swap) a position pays or earns for the broker days it is held."
    identity: {reference: TRS-01, timeframe: position, clock: broker_server_day, availability_rule: "exit bar"}
    parameterization:
      cost_source: {domain: str, identity_bearing: true}
    inputs: [DEX-03, DEX-05]
    rule: "nights = number of broker rollovers crossed: the distinct broker-server calendar dates that have bars, after the fill bar's date, up to and including the exit bar's date (weekends without bars add none). weighted_nights = sum over those rollovers of 3 on the calibration's triple-swap weekday, else 1. carry = research.costs.ComponentCostModel carry with nights_held = weighted_nights, in price, and in R over |entry - stop|. A debit is a cost; the cost model decides the sign rule. Broker-server time is the clock (MT5 bar stamps are server time, F-066)."
    units: {unit: R, normalization_basis: "risk distance |entry - stop|", missing_rule: "a position held over at least one rollover with swap or the triple-swap weekday unmeasured has no carry (None), never 0; zero rollovers is a real 0"}
    lifecycle: null
    absence: "None when swap or the triple-swap weekday is unmeasured and nights > 0."
    authority: {evidence: [REPO, USER_DECISION], sources: [src/research/costs.py], lineage: [SEM-015, F-066]}
    divergences:
      - {surface: "ComponentCostModel (research/costs.py:122-123, 232-261)", current: "per-night swap only; no triple-swap weekday field; slice-2 outcomes pass nights_held = 0", contract: "weighted nights from a calibrated triple-swap weekday", disposition: RECORDED}
    version: 1

  DEX-09:
    canonical_name: position_result
    layer: DECISION_EXECUTION
    kind: OUTCOME
    status: ACCEPTED
    definition: "The realised R of one whole position: every partial and final exit, net of costs and carry when net."
    identity: {reference: TRS-01, timeframe: position, clock: bar_close, availability_rule: "exit bar"}
    parameterization:
      walk: {domain: [bar_replay, broker_fills], identity_bearing: true}
      basis: {domain: [gross, net], identity_bearing: true}
      cost_model: {domain: TRS-08.cost_model, identity_bearing: true}
      cost_source: {domain: str, identity_bearing: true, applies_to: [net]}
    inputs: [DEX-03, DEX-05, DEX-06, DEX-07, DEX-08, TRS-07]
    rule: "gross R = sum over exits of (exit fraction * signed exit move) / R. net = gross - TRS-07 cost_r for the position's actual exits - DEX-08 carry. The position's identity also carries its DEX-01, DEX-06 and DEX-07 parameterizations. bar_replay walks OHLC bars (backtest); broker_fills uses the broker's executed fills (live / paper) - the two are never pooled (F-010). Under on_invalidation hold and ttl none, a bar_replay gross result must equal research.oracle.multi_tp_walk with the same partial_fraction, trail_fraction and tie_break."
    units: {unit: R, normalization_basis: "risk distance |entry - stop|", missing_rule: "an open position has no result (None)"}
    lifecycle: null
    absence: "None until the position is CLOSED; None for net when carry or cost is None."
    authority: {evidence: [REPO], sources: [src/config_layer/crt_engine_v2.py, src/research/oracle/multi_tp_walk.py], lineage: [F-010, F-088, F-110]}
    divergences:
      - {surface: "Trade.pnl (crt_engine_v2.py)", current: "price per unit, gross, blended by literal 0.5 weights", contract: "R, with basis and cost model in identity", disposition: RECORDED}
      - {surface: "F-110 ledger fix", current: "the TP1 partial was not booked in the ledger before 2026-10-01", contract: "every exit is part of the result", evidence: "F-110", disposition: RECORDED}
    version: 1

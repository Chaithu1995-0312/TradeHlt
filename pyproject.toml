[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelatest"
version = "1.0.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
hummingbot = ["hummingbot>=2.0.0"]
# MT5-first analytics subsystem (mt5_analytics/). Foundation/kernel needs only
# MetaTrader5 (behind an import guard); the rest support later phases (storage,
# dashboard, research).
mt5_analytics = [
    "MetaTrader5",
    "pandas",
    "pyarrow",
    "duckdb",
    "streamlit",
    "scipy",
    "scikit-learn",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "."]
testpaths = ["tests"]

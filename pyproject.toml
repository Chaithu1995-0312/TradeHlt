[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelatest"
version = "1.0.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
hummingbot = ["hummingbot>=2.0.0"]
# Parquet projections over JSONL research corpora (src/utils/parquet_store.py) and
# DuckDB query helpers over those projections (src/utils/duckdb_query.py). Optional:
# build/projection needs pyarrow; query needs duckdb. Every read path degrades to the
# JSONL source when pyarrow is absent; duckdb_query raises only when a query is attempted.
parquet = ["pyarrow", "duckdb"]
# Own-corpus OHLC chart rendering (src/charts/, INFRA-CPC-V1 Workstream A0). Optional:
# render.py imports mplfinance behind a guard and degrades to a stdlib inline-SVG
# backend when it is absent, so an absent plotting stack changes the output FORMAT
# and never the availability of the chart or its series/legend/pin artifacts.
charts = ["mplfinance"]
live_rail = ["websockets>=12"]
# MT5-first analytics subsystem (mt5_analytics/). Foundation/kernel needs only
# MetaTrader5 (behind an import guard); the rest support later phases (storage,
# dashboard, research).
mt5_analytics = [
    "MetaTrader5",
    "pandas",
    "pyarrow",
    "duckdb",
    "streamlit",
    "scipy",
    "scikit-learn",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "."]
testpaths = ["tests"]
# ERP testing-plan markers (§3.1). Additive vocabulary only — NO --strict-markers
# (the full suite carries known F-018 reds; strict mode would break collection).
markers = [
  "unit: pure logic, no network",
  "contract: golden/schema/determinism",
  "research_integrity: validation-path and label integrity",
  "market_network: read-only live market HTTP",
  "broker_mt5_ro: requires running MT5 terminal, read-only",
  "exec_dry_run: MT5/Telegram dry_run paths",
  "ui_playwright: control plane browser E2E",
  "shadow_economic: owner-gated shadow measurement",
  "capital_micro: owner-gated real capital — never default",
  "slow: long-running",
]

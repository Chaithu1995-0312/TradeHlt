[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-ssot-framework"
version = "0.1.0"
description = "Intent-driven research analysis inventory and dependency planning"
requires-python = ">=3.11"

[project.scripts]
research-ssot = "research_ssot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

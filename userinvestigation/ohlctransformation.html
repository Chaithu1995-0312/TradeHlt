re stale and the mirror isn&#x27;t exact. `build_trade` says its stop arithmetic is \&quot;one authority, no second copy\&quot;, but `compute_crt_levels` is a second copy. Verdict on both: DOCUMENTATION GAP.\n- **Guard difference.** `compute_crt_levels` has no inverted-SL guard (it uses `abs(entry - sl)`), and `build_trade` rejects that case. The live hook only checks that the SL is non-zero. Whether live can actually hit an inverted stop is UNVERIFIED.\n\n## B. OHLC transformation (partial)\n\n- **Higher-timeframe builders:** there are at least four, in `research/resample.py:127`, `runtime/backtest_v2.py` (`HTFBuilder`, `:1188`), `features/parent_candle.py:62` (`ParentCandleBuilder`), and `features/calendar_periods.py`. Whether they agree on bucket edges is UNVERIFIED.\n- **Feature pipeline callers:** `FeaturePipeline(` is called from 22 files, including the backtest, live rail feeder, model trainers and many research drivers.\n\n**New finding on the second-low live run (checked on the CSV path):** `resample` drops the trailing partial bucket, and `fetch_mt5` drops the forming M15 bar.\n- With the last M15 bar at 19:45, the last emitted H4 bar is the one that closed at 16:00. The bar that just closed at 20:00 is withheld.\n- The live task runs 10 minutes after each H4 close, so every run sees an H4 bar that is one bar (4 hours) stale. A trigger shows up about 4 hours late, while the entry price is still that bar&#x27;s close.\n- Paper results stay comparable to the backtest, but they are not an executable real-time fill. I recorded this in memory. I haven&#x27;t run it on actual MT5 output.&quot;}

<script>
const FILE = "ohlctransformation.jsonl";
const status = document.getElementById("status");
const log = document.getElementById("log");

function render(raw, how) {
  log.replaceChildren();
  const lines = raw.split(/\r?\n/).filter(function (s) { return s.trim(); });
  lines.forEach(function (line) {
    const row = JSON.parse(line);
    const art = document.createElement("article");
    art.className = row.role === "user" ? "user" : "assistant";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = row.role + (row.ts ? " · " + row.ts : "");
    const pre = document.createElement("pre");
    pre.textContent = row.text;
    art.append(who, pre);
    log.append(art);
  });
  status.textContent = how + " — " + lines.length + " messages.";
}

fetch(FILE).then(function (res) {
  if (!res.ok) throw new Error(String(res.status));
  return res.text();
}).then(function (raw) {
  render(raw, "Read " + FILE);
}).catch(function () {
  const raw = document.getElementById("jsonl-fallback").value;
  render(raw, "Opened as a local file, so the browser did not allow a read of " + FILE + ". Showing the copy written into this page at the same time as that file");
});
</script>

<script>
const FILE = "schema_slice_20261010.jsonl";
const status = document.getElementById("status");
const log = document.getElementById("log");

function render(raw, how) {
  log.replaceChildren();
  const lines = raw.split(String.fromCharCode(10)).filter(function (s) { return s.trim(); });
  lines.forEach(function (line) {
    const row = JSON.parse(line);
    const art = document.createElement("article");
    art.className = row.role === "user" ? "user" : "assistant";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = row.role + (row.ts ? " - " + row.ts : "");
    const pre = document.createElement("pre");
    pre.textContent = row.text;
    art.append(who, pre);
    log.append(art);
  });
  status.textContent = how + " - " + lines.length + " messages.";
}

fetch(FILE).then(function (res) {
  if (!res.ok) throw new Error(String(res.status));
  return res.text();
}).then(function (raw) {
  render(raw, "Read " + FILE);
}).catch(function () {
  const raw = document.getElementById("jsonl-fallback").value;
  render(raw, "Opened as a local file, so the browser did not allow a read of " + FILE + ". Showing the copy written into this page at the same time as that file");
});

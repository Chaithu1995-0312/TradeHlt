# SUPERSEDED 2026-09-10 by CH-analysis-trace-linkage. Kept, never deleted (CLAUDE.md 6.2 rule 4):
# this pack is the record of how the run was gated, and of the user ruling that resolved it.
superseded_by:
  analysis_id: AN-SHADOWMEM-XAUUSD-M15-V1
  location: docs/governance/run_linkage_registry.json  ->  XAUUSD._analyses / XAUUSD._traces
  change_id: CH-analysis-trace-linkage
  validator: tests/test_run_linkage_traces.py
  reason: >
    This pack is bound to a single run_id, but the analysis consumed five runs (three
    registered, two not) and six of eight artifact groups carry no run_id at all. A run has
    no claims; an analysis does. Bound at the wrong grain, the pack needed TWO admission
    mechanisms with no precedence between them -- trust_table marks
    create_H20_context_economics VALID while forbidden_inferences lists
    quote_create_h20_headline -- so two readers each correctly following the pack reach
    opposite verdicts. The AN/TR records carry one mechanism at the analysis grain.
  copy_to_reference: >
    trust_table is by this file's own header a "strict key-copy" of schema_bridge.surfaces,
    guarded by "if this table disagrees ... this pack is STALE". The replacement cites
    surfaces as '<run_id>#<surface>' pointers into that same block, so the staleness class is
    removed structurally rather than warned about.
  user_ruling_preserved: >
    2026-09-10: forbidden_inferences outranks trust_table for this run. That ruling is why
    the parent_crt and session statements sit in AN-SHADOWMEM-XAUUSD-M15-V1.withdrawn_claims
    with reason FORBIDDEN rather than appearing as claims.
  still_authoritative_here:
    - the forbidden_inferences list itself (the ruling's subject)
    - two_clocks worked example
    - sparse_contexts object-boundary notes

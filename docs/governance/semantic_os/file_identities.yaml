# Semantic OS — File Identity registry (HAND-AUTHORED) — Semantic File Identity Layer
#
# Charter: docs/governance/SEMANTIC_OS_CONTRACT.md
# Design:  docs/governance/SEMANTIC_OS_V1_DESIGN.md
# Schema:  semantic_os/1.1 · validator: src/governance/semantic_os.py (_validate_file_identity)
# Guard:   tests/test_semantic_identity.py
# Report:  docs/governance/SEMANTIC_FILE_IDENTITY_REPORT.md
#
# A FileIdentity gives one Python module a rename-stable identity:
#     semantic_id (this record'''s id, a dotted slug) -> semantic_name -> physical_path
# plus a filename_semantic_status classification (ALIGNED/HISTORICAL/MISLEADING/COMPATIBILITY/
# SPLIT/UNKNOWN) that names when a physical filename no longer matches what the module does.
#
# Physical filenames are NEVER renamed by this layer. authority is always advisory (§6.5) — a
# curated identity here grants no rename/promotion/production authority, only a name to reason
# and communicate with.
#
# TIER 1 (HIGH confidence) = hand-verified from source. TIER 2 (MEDIUM confidence) = curated but
# boundary-claimed / not independently source-read (filename_status_reason says so explicitly).
# TIER 3 (LOW confidence, filename_semantic_status UNKNOWN) is NEVER written here — it is
# generated at seed time by governance.semantic_identity.derive_tier3_identities for every
# remaining code-universe path. See docs/governance/SEMANTIC_FILE_IDENTITY_REPORT.md §3 for why.
#
# HAND-AUTHOR only meaning. Never write owner_boundary/encyclopedia_id/script_registry_id/
# imports/tests/package/bytes — those are DERIVED exact-path joins computed in
# src/governance/semantic_objects.py. miar_entry is the only hand-authored cross-link.
# authority is always advisory.


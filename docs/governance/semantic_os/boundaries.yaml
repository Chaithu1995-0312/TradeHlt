      Session feature labels have a single module owner and an explicit clock basis
      (broker_local vs utc_corrected); live filter windows are a separate policy surface.
    invariant_violation_symptom: >-
      Feature session labels and CRT session_windows are silently treated as one enum, so a clock
      correction retunes live economics without an explicit decision.

    contract_ids: []
    contract:
      inputs:

# Semantic OS — Boundary registry (HAND-AUTHORED)
#
# Charter: docs/governance/SEMANTIC_OS_CONTRACT.md
# Schema:  docs/reference/schemas.md §9.11 · validator: src/governance/semantic_os.py
# Guard:   tests/test_semantic_os.py
#
# A Boundary is an ARCHITECTURAL SEAM, not a file list. You maintain the GLOB and the INVARIANT;
# membership is recomputed from disk on every seed. Renaming a module inside a claimed tree changes
# nothing here. A glob that matches zero files is a validation error (validator 7), and no file may
# be claimed by two boundaries (single ownership).
#
# invariant_protected is REQUIRED and non-empty: a boundary that protects nothing is not a boundary.
#
# STATUS: PR-5 wave 1 SHIPPED — 10 seams (BD-001..BD-010; BD-002 = Capital Risk Gate only).
# Spine SPINE_FILES remain 100% claimed (~94 member files total). Advisory only; no production
# behavior change.

boundaries:

  # ── Substrate: features / ontology / clock ─────────────────────────────────

  - id: BD-001
    kind: boundary
    name: Feature Vector Emission
    boundary_kind: PRODUCTION
    status: ACTIVE
    authority: advisory
    authority_layer: WHAT

    owner: src/features/feature_pipeline.py
    owner_symbol: FeaturePipeline
    members:
      - src/features/feature_pipeline.py
      - src/features/feature_schema.py
      - src/features/feature_builder.py
      - src/features/feature_identity.py
      - src/features/feature_monitor.py
      - src/features/schema_validator.py
      - src/features/dataset_builder.py
      - src/features/dataset_validator.py
      - src/features/feature_states.py
      - src/features/__init__.py
    members_exclude: []
    consumers:
      - BD-006
      - BD-007
      - BD-008

    invariant_protected: >-
      Everything crossing this seam is a fixed-width, declared-order, point-in-time feature vector
      whose order hash matches the captured baseline. No consumer downstream re-derives a governed
      market quantity for itself.
    invariant_violation_symptom: >-
      A downstream engine computes its own version of a named feature, or the emitted width/order
      silently stops matching FEATURE_ORDER_HASH, so two consumers disagree about the same slot
      without any check failing.

    contract_ids:
      - CT-001
    contract:
      inputs:
        - Chronologically ordered OHLCV frame with configured warmup rows.
        - feature_pipeline config section (strictly required, no silent defaults).
      outputs:
        - Fixed-width numeric vector in CANONICAL_FEATURES order.
        - SCHEMA_HASH and FEATURE_ORDER_HASH identity.
      guarantees:
        - Emitted order equals the declared CANONICAL_FEATURES order.
        - Feature mathematics originates from registered formula authorities, never inline.
      non_guarantees:
        - Does NOT guarantee every emitted feature is point-in-time (F-051 records a live exception).
        - Does NOT guarantee any feature carries economic value.
        - Does NOT guarantee consumers interpret the slots correctly.
      enforced_by_tests:
        - tests/test_feature_lineage.py
        - tests/test_feature_math_lint.py
        - tests/test_formula_registry.py

    concepts:
      - CN-001
    closure_surface_id: CANONICAL_FEATURE_CODE_SURFACE
    miar_stage: substrate
    change_classes:
      - FORMULA_CHANGE
      - DERIVED_METRIC_CHANGE
      - DATASET_SCHEMA_CHANGE
      - FEATURE_IDENTITY_CHANGE
    evidence:
      - path: src/features/feature_schema.py
        symbol: CANONICAL_FEATURES
        line: 71
        type: code
      - path: src/features/feature_pipeline.py
        symbol: FeaturePipeline
        line: 423
        type: code
    findings:
      - F-046
      - F-047
      - F-051
      - F-054
    why_this_boundary: >-
      The seam is placed at vector EMISSION rather than at each formula because that is the only
      point where a single artifact — the ordered vector plus its hash — can be compared against a
      baseline. Ontology math (BD-003) and session labeling (BD-004) feed this seam but are not it.

    supersedes: null
    superseded_by: null

  - id: BD-003
    kind: boundary
    name: Market Ontology Math
    boundary_kind: AUTHORITY
    status: ACTIVE
    authority: advisory
    authority_layer: WHAT

    owner: src/features/formula_registry.py
    owner_symbol: FORMULA_REGISTRY
    members:

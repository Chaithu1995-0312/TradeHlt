  # ── Runtime spine ──────────────────────────────────────────────────────────

  - id: BD-005
    kind: boundary
    name: Runtime Candle Paths
    boundary_kind: TRANSPORT
    status: ACTIVE
    authority: advisory
    authority_layer: HOW

    owner: src/runtime/backtest_v2.py

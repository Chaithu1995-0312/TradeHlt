      - src/features/candle_math.py
      - src/features/fm_resolve.py
      - src/features/registry/**/*.py
      - configs/formulas/market_ontology.yaml
    members_exclude: []
    consumers:
      - BD-001

    invariant_protected: >-
      Market quantities used in production have a registered FM identity and a single callable
      implementation path — never silent local re-derivation of the same named quantity.
    invariant_violation_symptom: >-
      Two call sites emit different values for the same named feature, or a new formula lands
      without an ontology registration and ownership lint failure is ignored.

    contract_ids:
      - CT-003
    contract:
      inputs:
        - Ontology YAML declarations (FM/SEM identities, dependencies, lifecycle).
        - Registered callables in the formula registry package.
      outputs:
        - Deterministic scalar/vector formula results for declared names.
        - Lineage / validation reports for registry health.
      guarantees:
        - Formula implementations are named callables (never eval of ontology strings).
        - New governed quantities are registered before production use.
      non_guarantees:
        - Does NOT guarantee economic usefulness of any formula (§6.5).
        - Does NOT emit the assembled canonical vector (BD-001).
      enforced_by_tests:
        - tests/test_formula_registry.py
        - tests/test_feature_math_lint.py
        - tests/test_candle_math.py

    concepts:
      - CN-007
    closure_surface_id: CANONICAL_FEATURE_CODE_SURFACE
    miar_stage: market_understanding
    change_classes:
      - FORMULA_CHANGE
      - DERIVED_METRIC_CHANGE
    evidence:

    invariant_protected: >-
      Only VALID_TRANSITIONS among the nine CRT states are legal. Structural meaning is shared —
      consumers may score differently but must not invent alternate state semantics for the same bar.
    invariant_violation_symptom: >-
      Illegal state jumps, or programmatic CRTConfig paths that diverge from production structural
      knobs (F-057 class), or strategy-local geometry forks of sweep/displacement.

    contract_ids:

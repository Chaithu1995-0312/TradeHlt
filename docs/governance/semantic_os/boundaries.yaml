  - id: BD-002
    kind: boundary
    name: Capital Risk Gate
    boundary_kind: POLICY
    status: ACTIVE
    authority: advisory
    authority_layer: WHO

    owner: src/core/ultron_risk_gate.py
    owner_symbol: UltronRiskGate
    members:
      - src/core/ultron_risk_gate.py
    members_exclude: []
    consumers: []

    invariant_protected: >-
      Economic reward:risk is evaluated in exactly ONE place, after entry/stop/target are planned,
      and no position reaches order placement without an explicit APPROVE from that single
      authority.
    invariant_violation_symptom: >-
      A second component upstream applies its own reward:risk threshold, so approval depends on
      whichever gate happens to be stricter — or an upstream gate compares a non-economic quantity
      against an economic threshold and silently rejects everything.

    contract_ids:
      - CT-002
    contract:
      inputs:
        - ExecutionPlan geometry (entry / SL / TP) for a proposed trade.
        - Active production ultron_risk_gate / exposure constraints.
      outputs:
        - Structured capital APPROVE/REJECT with machine-readable reason.
      guarantees:
        - Economic reward:risk authority is sole and terminal (post-planner).
        - Cost model is applied before the RR comparison.
      non_guarantees:
        - Does NOT guarantee positive expectancy of approved trades.
        - Does NOT guarantee backtest approval equals live (F-010 OPEN).
      enforced_by_tests:
        - tests/test_execution_contract_v1.py
        - tests/test_backtest_declared_constants.py

    concepts:

      - src/runtime/unified_replay_harness.py
    members_exclude: []
    consumers:
      - BD-001
      - BD-007

    invariant_protected: >-
      Closed bars are consumed causally (stream/generator discipline). No-lookahead integrity is
      the conjunction of L1/L2/L3 + feature PIT, not a single flag.
    invariant_violation_symptom: >-
      A path scores bar t using information from bars after t, or assumes L3 preflight ran when only
      L1/L2 did (F-039 class).

    contract_ids:
      - CT-005
    contract:
      inputs:
        - Configured instrument data path or live feed adapter.
        - Active production / backtest sections for the runner.
      outputs:
        - Chronological Candle stream (backtest) or live bar hook invocations.
        - Trade ledger / metrics artifacts under declared exit models.
      guarantees:
        - Stream consumption is chronological; schema/time backstops fire on corrupt input.
        - Live and backtest share EngineRunner join when engine_gate is enabled.
      non_guarantees:
        - Does NOT guarantee L3 dataset preflight on every research stream (F-039).
        - Does NOT guarantee live PnL matches backtest (F-010 OPEN).
      enforced_by_tests:
        - tests/runtime/test_replay_determinism.py
        - tests/test_backtest_declared_constants.py

    concepts:

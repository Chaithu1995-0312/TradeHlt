        symbol: null
        line: null
        type: config
      - path: src/features/formula_registry.py
        symbol: FORMULA_REGISTRY
        line: 19
        type: code
    findings:
      - F-047
      - F-046
      - F-054
    why_this_boundary: >-
      Meaning (WHAT) must be enforceable separately from emission (BD-001). Collapsing them hid
      divergent definitions until the GD ledger forced unification.


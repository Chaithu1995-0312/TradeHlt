  - id: CN-006
    kind: concept
    name: Fusion Decision and Geometry
    aliases:
      - fusion and decision
      - execution plan
      - semantic approval
    status: ACTIVE
    supersedes: null
    superseded_by: null
    authority: advisory

    why_it_exists: >-
      Independent scores must become one semantic go/pass/reject, and an accepted signal must
      become concrete entry/SL/TP geometry before any capital check (order forced by F-048 lesson).
    problem_it_solves: >-
      Separates semantic approval (DecisionEngine) from economic RR (Ultron) and from structural
      scoring; ensures planning happens before capital math.
    explicit_non_goals:
      - Does not own cost-taxed min RR (Ultron / CN-002).
      - Does not redefine CRT structure (CN-004).
      - Does not invent SL/TP outside CRT/planner geometry contracts.

    miar_stage: decision
    miar_entry: null
    closure_surface_id: null
    ontology_ids: []
    owner_boundary: BD-008
    related_boundaries:
      - BD-002
      - BD-007
    canonical_source: src/core/fusion_engine.py

    invariants:
      - Fusion completeness respects expected engines when the gate is enabled.
      - DecisionEngine is semantic-only after F-048 (no economic RR threshold).
      - ExecutionPlanner runs only after semantic GO and before Ultron.
    preconditions:
      - Per-engine scores available.
      - Production fusion/decision/planner config present.
    postconditions:
      - DecisionResult and, on GO, an ExecutionPlan with concrete levels.
    assumptions:
      - assumption: >-
          Fusion gate materially changes the trade set on the active config.
        falsified_by: F-070
        status: UNTESTED

    behavior: >-
      Fuses engine scores, applies semantic DecisionEngine gates, and on GO derives entry/SL/TP/TTL
      intent geometry for the risk gate.
    failure_modes:
      - mode: FUSION_INCOMPLETE
        symptom: Missing engine weights/scores under completeness rules.
        detection: FusionEngine completeness check / fail-fast weight sum.
        finding: null
      - mode: SEMANTIC_REJECT
        symptom: DecisionEngine REJECT (score/zone/weak component) without capital evaluation.
        detection: RejectReason ledger.
        finding: null
      - mode: INVALID_GEOMETRY
        symptom: Planner cannot form valid SL/TP for intent (or ATR unit defect).
        detection: Planner rejects; geometry audits (Ch.13 ATR mismatch).

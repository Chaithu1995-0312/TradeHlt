        symptom: Feature at t changes when future bars are appended.
        detection: Prefix-invariance probes.
        finding: F-051
      - mode: INTEGRITY_LAYER_GAP
        symptom: Path assumes L3 but only L1/L2 ran (or vice versa).
        detection: Call-site census (F-039).
        finding: F-039
      - mode: TEMPORAL_VIOLATION
        symptom: Out-of-order bars admitted to scoring.
        detection: L2 stream checks.
        finding: null


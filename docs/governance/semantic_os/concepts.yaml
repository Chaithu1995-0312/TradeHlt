    assumptions:
      - assumption: >-
          Centered swings in production were point-in-time.
        falsified_by: F-051
        status: FALSIFIED

    behavior: >-
      Enforces chronological streaming, optional dataset integrity preflight, and PIT feature
      construction rules across the spine.
    failure_modes:

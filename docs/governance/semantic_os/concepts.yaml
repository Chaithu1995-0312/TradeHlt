# Semantic OS — Concept registry (HAND-AUTHORED)
#
# Charter: docs/governance/SEMANTIC_OS_CONTRACT.md
# Design:  docs/governance/SEMANTIC_OS_V1_DESIGN.md  (FM-first stack L0–L6; CN/BD/JN/CT/OBJ)
# Schema:  docs/reference/schemas.md §9.10 · validator: src/governance/semantic_os.py
# Guard:   tests/test_semantic_os.py
# Scoreboard: docs/governance/REPOSITORY_COVERAGE_DASHBOARD.md
#
# HAND-AUTHOR ONLY what code cannot answer: why it exists, what invariant must never break,
# why this design, why the alternative was rejected, which finding justifies it.
# Imports / consumers / package / ownership / tests / reachability are DERIVED — writing any of
# them here is a schema violation (see _FORBIDDEN_HAND_FIELDS + validate_no_derived_in_source).
#
# Concepts REFERENCE other authorities by validated foreign key; they never redefine them.
# A concept may CITE an FM-*/SEM-* ontology id but may NEVER carry a formula (§6.6).
#
# Append-discipline (§6.2 rule 4): never delete a record. Mark it SUPERSEDED / RETIRED and set
# superseded_by.
#
# STATUS: PR-4 wave 1 complete — CN-001..CN-015 (spine + gov/research/agent inventory).
# Target remains ~50 concepts (design §10). Remaining seed names wait for PR-5+ boundaries/journeys.

concepts:

  - id: CN-001
    kind: concept
    name: Canonical Feature Vector
    aliases:
      - canonical features
      - feature vector
      - CANONICAL_FEATURES
    status: ACTIVE
    supersedes: null
    superseded_by: null
    authority: advisory

    why_it_exists: >-
      Every scoring engine, model, and research probe needs ONE agreed numeric representation of a
      candle's market context. Without a single owned schema each consumer derives its own version
      of the same quantity, and the system silently disagrees with itself about what "the features"
      even are.
    problem_it_solves: >-
      Eliminates per-consumer re-derivation of governed market mathematics — the defect class that
      produced divergent wick_size/body_ratio definitions (F-046) and the ten pinned geometry
      divergences adjudicated into the GD-001..GD-010 ledger (F-047).
    explicit_non_goals:
      - Does not decide whether a feature is economically useful — that is the Authority Ladder (§6.5).
      - Does not own feature MATHEMATICS — the market ontology does (§6.6); this concept owns the
        vector's identity, order, and point-in-time contract.
      - Does not guarantee any consumer actually reads the vector correctly.

    miar_stage: substrate
    miar_entry: feature_pipeline
    closure_surface_id: CANONICAL_FEATURE_CODE_SURFACE
    ontology_ids:
      - FM-001
      - FM-002
    owner_boundary: BD-001
    related_boundaries:
      - BD-003
      - BD-004
      - BD-005
    canonical_source: src/features/feature_schema.py

    invariants:
      - The emitted vector is exactly the CANONICAL_FEATURES tuple, in declared order.
      - No feature may be computed from a bar later than the bar being scored (point-in-time).
      - Any change to CANONICAL_FEATURES or FEATURE_SCHEMA invalidates the baseline and requires
        a fresh baseline capture before training.
    preconditions:
      - A chronologically ordered OHLCV frame with the configured warmup rows available.
      - feature_pipeline config section present and strictly readable (no silent defaults, §6.5).
    postconditions:
      - A fixed-width numeric vector whose order hash matches FEATURE_ORDER_HASH.
      - Warmup rows are dropped, so the emitted index is not the input index.
    assumptions:
      - assumption: >-
          Every emitted feature is point-in-time — no value depends on a future bar.
        falsified_by: F-051
        status: FALSIFIED
      - assumption: >-
          Each canonical slot has exactly one registered ontology identity that owns its math.
        falsified_by: null
        status: HOLDS

    behavior: >-
      The pipeline consumes a raw OHLCV frame, computes rolling indicators and derived metrics
      through the registered formula authorities, drops the warmup prefix, and emits a fixed-width
      vector plus a schema hash. Consumers bind to the schema, never to positional indices they
      compute themselves.
    failure_modes:
      - mode: SCHEMA_DRIFT
        symptom: A consumer's expected width or order no longer matches the emitted vector.
        detection: FEATURE_ORDER_HASH / SCHEMA_HASH comparison against the captured baseline.
        finding: null
      - mode: LOOKAHEAD_CONTAMINATION
        symptom: A feature's value at bar t changes when bars after t are appended.
        detection: Prefix-invariance probe — recompute on a truncated frame and diff.
        finding: F-051
      - mode: DIMENSIONAL_MIX
        symptom: >-
          A slot emits a price-level quantity where a ratio is intended, so downstream thresholds
          saturate on nearly every bar.
        detection: Scale-invariance probe under a synthetic price multiplier.
        finding: F-047

    why_this_design: >-
      A single frozen tuple with an order hash makes disagreement detectable rather than silent.
      The alternative — letting each engine ask for the features it wants — is exactly what produced
      the divergence ledger, because two call sites can compute "the same" quantity differently and
      nothing compares them.
    alternatives_rejected:
      - alternative: Per-engine feature derivation (each engine computes what it needs inline).
        why_rejected: >-
          Produced genuinely divergent definitions of the same named quantity with zero mechanical
          detection; remediated by unifying behind an immutable module and an ownership lint.
        evidence: docs/current-findings.md
      - alternative: A variable-width feature dict keyed by name instead of a fixed ordered tuple.
        why_rejected: >-
          Removes the order hash, so schema drift stops being mechanically detectable and the
          baseline-invalidation invariant becomes unenforceable.
        evidence: null
    research_findings:
      - F-046
      - F-047
      - F-051
      - F-054
    hypotheses: []
    framework_ids: []

    summary_50: >-
      The one fixed-width, ordered, point-in-time numeric representation of a candle's context that
      every engine and model binds to.
    summary_200: >-
      The canonical feature vector is the substrate contract of the whole system: a fixed-width
      tuple, in a declared order, hashed so drift is detectable, computed point-in-time from an
      OHLCV frame through registered formula authorities rather than inline per-consumer math. It
      exists because the alternative — each engine deriving its own version of the same quantity —
      produced real divergent definitions that nothing could mechanically compare. It owns the
      vector's identity, order, and PIT contract; it does NOT own the mathematics (the market
      ontology does) and it does NOT claim any feature is economically useful.
    retrieval_keywords:
      - canonical features
      - feature vector
      - schema hash
      - feature order hash
      - point in time
      - lookahead
      - warmup
    semantic_tags:
      - substrate
      - feature
      - no_lookahead
      - schema_identity

    book_chapter: docs/book/07-feature-pipeline.md
    topic_doc: docs/topics/feature-schema.md
    intent_chain: docs/intent_graph.md#chain-3-deterministic-replay-the-same-inputs-same-outputs-thought
    intent_domain_doc: null
    related_concepts:
      - CN-002
    orphan_justification: null

  - id: CN-002
    kind: concept
    name: Trade Approval
    aliases:
      - trade approval
      - risk approval
      - position approval
    status: ACTIVE
    supersedes: null
    superseded_by: null
    authority: advisory

    why_it_exists: >-
      A scored signal is not a trade. Something must own the final economic yes/no — does this
      proposed position clear its reward:risk after costs, within the account's exposure limits —
      and that authority must live in exactly one place.
    problem_it_solves: >-
      Prevents a second, competing economic gate from forming upstream. When the DecisionEngine
      also carried a reward:risk threshold it silently rejected every candle, because it was fed
      candle polarity rather than economic RR (F-048).
    explicit_non_goals:
      - Does not score market structure or assign semantic approval — that is the DecisionEngine.
      - Does not compute entry/stop/target geometry — that is the ExecutionPlanner; this concept
        consumes the resulting levels.
      - Does not decide position sizing policy independently of the configured risk percent.

    miar_stage: safety
    miar_entry: null
    closure_surface_id: null
    ontology_ids: []
    owner_boundary: BD-002
    related_boundaries:
      - BD-008
    canonical_source: src/core/ultron_risk_gate.py

    invariants:
      - Economic reward:risk is evaluated in exactly ONE place, after entry/stop/target are planned.
      - No position is opened without an explicit APPROVE result.
      - The cost model is applied before the reward:risk comparison, never after.
    preconditions:
      - An ExecutionPlan carrying concrete entry, stop, and target levels.
      - ultron_risk_gate config section present and strictly readable.
    postconditions:
      - A structured APPROVE/REJECT with a machine-readable reject reason.
      - A rejected signal never reaches order placement on any path.
    assumptions:
      - assumption: >-
          Only one component applies an economic reward:risk threshold on the decision path.
        falsified_by: F-048
        status: HOLDS
      - assumption: >-
          Backtest approval behaviour is representative of live approval behaviour.
        falsified_by: F-010
        status: UNTESTED

    behavior: >-
      Receives a planned position with concrete levels, taxes it with the configured cost model,
      compares the resulting reward:risk against the configured minimum, checks exposure and
      account-level limits, and returns a structured approve/reject. A reject is terminal for that
      candle.
    failure_modes:
      - mode: DOUBLE_AUTHORITY
        symptom: >-
          A second component upstream also applies an economic threshold, so approvals depend on
          which gate happens to be stricter.
        detection: Grep the decision path for reward:risk comparisons outside the gate.
        finding: F-048
      - mode: STRUCTURALLY_INERT
        symptom: A gate that never rejects, or rejects everything, regardless of input.
        detection: Ledger differential with the gate forced on and off.
        finding: F-070

    why_this_design: >-
      Economic approval was made a single, terminal, post-planning authority because reward:risk is
      only meaningful once entry, stop, and target are concrete. Evaluating it earlier means
      comparing a threshold against something that is not economic RR at all — which is exactly the
      defect that made the upstream gate reject every candle.
    alternatives_rejected:
      - alternative: Keep a reward:risk threshold inside the DecisionEngine as a pre-filter.
        why_rejected: >-
          The DecisionEngine sees no economic RR (levels are not planned yet); it was fed candle
          polarity against an RR threshold and rejected 100% of candles. The gate was removed and
          the economics left solely to the risk gate.
        evidence: docs/current-findings.md
      - alternative: Let the ExecutionPlanner self-approve since it already computes the levels.
        why_rejected: >-
          Collapses planning and approval into one component, so there is no independent authority
          able to veto a plan, and account-level exposure limits would have no owner.
        evidence: null
    research_findings:
      - F-048
      - F-070
    hypotheses: []
    framework_ids: []

    summary_50: >-
      The single, terminal economic authority that decides whether a planned position clears
      reward:risk after costs and within exposure limits.
    summary_200: >-
      Trade approval is the last gate before an order exists. It takes a planned position with
      concrete entry, stop, and target levels, applies the configured cost model, and checks the
      resulting reward:risk plus account exposure limits, returning a structured approve/reject
      with a machine-readable reason. It is deliberately the ONLY economic authority on the path:
      an earlier reward:risk threshold in the DecisionEngine was removed after it was found to be
      comparing candle polarity against an economic threshold and rejecting every candle. It owns
      economics, not semantics and not geometry.
    retrieval_keywords:
      - trade approval
      - risk gate
      - reward risk
      - min_rr_ratio
      - reject reason
      - exposure limit
    semantic_tags:
      - safety
      - decision
      - economic_authority

    book_chapter: docs/book/14-ultron-risk-gate.md
    topic_doc: docs/topics/ultron-risk-gate.md
    intent_chain: docs/intent_graph.md#chain-1-capital-preservation-the-dont-blow-up-thought
    intent_domain_doc: docs/intent/200_risk.md
    related_concepts:
      - CN-001
      - CN-005
      - CN-006
    orphan_justification: null


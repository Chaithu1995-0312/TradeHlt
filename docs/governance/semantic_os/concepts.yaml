  - id: CN-003
    kind: concept
    name: Candle Ingest
    aliases:
      - data ingest
      - candle stream
      - OHLCV load
    status: ACTIVE
    supersedes: null
    superseded_by: null
    authority: advisory

    why_it_exists: >-
      Every downstream decision assumes a closed, ordered M15 candle. Without a single ingest
      contract, streams can admit duplicates, out-of-order bars, or schema-broken rows that make
      every later "edge" uninterpretable.
    problem_it_solves: >-
      Establishes L1/L2 stream integrity (headers, chronology, value sanity) as the universal
      backstop for all consumers — including research paths that never run L3 (F-039).
    explicit_non_goals:
      - Does not score or trade — only produces Candle units.
      - Does not replace L3 dataset preflight on every path (only backtest MultiInstrumentRunner).
      - Does not own MT5/broker clock semantics (feature session basis is separate, F-066).

    miar_stage: substrate
    miar_entry: null
    closure_surface_id: null
    ontology_ids: []
    owner_boundary: BD-005
    related_boundaries:
      - BD-001
    canonical_source: src/runtime/backtest_v2.py

    invariants:
      - Streamed candles are strictly chronological (no duplicates / no out-of-order timestamps).
      - Required OHLCV columns are present and parseable before any engine runs.
      - No-lookahead is the conjunction of L1/L2/L3 + generator consumption order (F-039).
    preconditions:
      - Configured instrument CSV path or live feed adapter.
      - Warmup policy understood by the consumer frame builder.
    postconditions:
      - A Candle (or enriched bar) available for the feature pipeline.
    assumptions:
      - assumption: >-
          Inline L1/L2 backstop is sufficient integrity for research streams that skip L3.
        falsified_by: F-039
        status: HOLDS

    behavior: >-
      Loads or streams closed M15 bars, rejects malformed schema/time, and yields Candle units
      to the spine generator without peeking at future bars.
    failure_modes:
      - mode: DATA_CORRUPT
        symptom: Missing CSV, bad headers, NaN OHLC, high < low.
        detection: stream() raises; schema validators fire.
        finding: null
      - mode: TEMPORAL_VIOLATION
        symptom: Duplicate or out-of-order timestamps in the stream.
        detection: L2 inline checks in CandleLoader.stream().
        finding: null
      - mode: LOOKAHEAD_STREAM
        symptom: Consumer can access bar N+1 before N is fully processed.
        detection: Generator discipline / audit of non-stream access patterns.
        finding: F-039

    why_this_design: >-
      A generator stream forces causal consumption. Optional L3 adds confidence without being the
      sole integrity net for every research caller.
    alternatives_rejected:
      - alternative: Load full frames with random-access indexing as the only path.
        why_rejected: Makes accidental lookahead easy and removes a structural no-peek force.
        evidence: docs/current-findings.md
    research_findings:
      - F-039
    hypotheses: []
    framework_ids: []

    summary_50: >-
      Closed, chronological M15 candle stream with L1/L2 integrity before any scoring runs.
    summary_200: >-
      Candle ingest is the first hop of the synchronous spine: raw OHLCV becomes Candle units
      under strict chronology and schema checks. Research may skip L3 preflight, so L1/L2 remain
      the universal backstop. It does not trade; it only guarantees the market time series is
      well-formed and causal for everything that follows.
    retrieval_keywords:
      - candle
      - OHLCV
      - stream
      - no lookahead
      - dataset integrity
    semantic_tags:
      - substrate
      - data
      - no_lookahead

    book_chapter: docs/book/05-data-ingestion-no-lookahead.md
    topic_doc: docs/topics/feature-schema.md
    intent_chain: docs/intent_graph.md#chain-3-deterministic-replay-the-same-inputs-same-outputs-thought

  - id: CN-015
    kind: concept
    name: No-Lookahead Integrity
    aliases:
      - no lookahead
      - PIT integrity
      - stream causality
    status: ACTIVE
    supersedes: null
    superseded_by: null
    authority: advisory

    why_it_exists: >-
      Deterministic replay and honest research require that bar-t features and decisions never
      depend on bar>t information — integrity is a conjunction of layers, not a single flag.
    problem_it_solves: >-
      Makes lookahead a named, multi-layer integrity contract (L1/L2/L3 + generator + feature PIT)
      so "we streamed CSV" is never mistaken for full integrity (F-039).
    explicit_non_goals:
      - Does not by itself create edge.
      - Does not claim all historical features were PIT-clean (F-051).
      - Does not force L3 on every research caller without migration.


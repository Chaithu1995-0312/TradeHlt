  - id: CN-005
    kind: concept
    name: Four Engine Scoring
    aliases:
      - EXPECTED_ENGINES
      - multi-engine scores
      - CRT Gaussian Zone RR
    status: ACTIVE
    supersedes: null
    superseded_by: null
    authority: advisory

    why_it_exists: >-
      Independent scoring channels (CRT, Gaussian, Zone Gate, RR) keep structural, statistical,
      geometric, and polarity signals from collapsing into a single opaque score before fusion.
    problem_it_solves: >-
      Forces completeness of the four EXPECTED_ENGINES and makes channel-level defects diagnosable
      (e.g. Gaussian near-constant F-060) instead of silent fusion mystery.
    explicit_non_goals:
      - Does not fuse or approve trades.
      - Does not require every channel to be informative (inert channels are findings, not silent success).
      - Does not enable BitNet/TradeNet by mere presence (config authority).

    miar_stage: decision
    miar_entry: null
    closure_surface_id: null
    ontology_ids: []
    owner_boundary: BD-007
    related_boundaries:
      - BD-001
      - BD-006
      - BD-008
    canonical_source: src/core/engine_runner.py

    invariants:
      - EXPECTED_ENGINES = {crt, gaussian, zone_gate, rr} must all produce results or fail-fast on missing keys.
      - Each engine score is in a declared numeric range consumed by fusion.
    preconditions:
      - Features and CRT structure available for the bar.
      - Engine configs and model artifacts loadable under fail policies.
    postconditions:
      - Per-engine score map for fusion.
    assumptions:
      - assumption: >-
          All four channels carry decision-relevant information under the active config.
        falsified_by: F-060
        status: FALSIFIED

    behavior: >-
      EngineRunner invokes each expected engine and collects scores; missing engines are hard errors
      when completeness is required.
    failure_modes:
      - mode: MISSING_ENGINE
        symptom: expected engine key absent from results.
        detection: EXPECTED_ENGINES - results.keys() non-empty.
        finding: null
      - mode: CHANNEL_COLLAPSE
        symptom: Engine output near-constant or OOD (e.g. Gaussian ~0.88).
        detection: Ablation / distribution audit.
        finding: F-060
      - mode: OPTIONAL_DEP_DEGRADE
        symptom: BitNet/LLM optional path fails open or disables.
        detection: fail_count_disable / import guards.
        finding: F-004

    why_this_design: >-
      Independent engines preserve diagnosability. Completeness is structural; informativeness is
      evidence-driven per channel.
    alternatives_rejected:
      - alternative: Single monolithic scorer.
        why_rejected: Hides channel-level collapse and blocks lineage audits per model family.
        evidence: docs/governance/*_lineage_audit.md
    research_findings:
      - F-060
      - F-036
      - F-038
      - F-004
    hypotheses: []
    framework_ids: []

    summary_50: >-

  - id: CN-004
    kind: concept
    name: CRT Market Structure
    aliases:
      - CRT state machine
      - structural language
      - CRT spine structure
    status: ACTIVE
    supersedes: null
    superseded_by: null
    authority: advisory

    why_it_exists: >-
      The market needs a shared structural language — range, sweep, displacement, expansion,
      retest, execution — so fusion, research, and execution consume ONE narrative per candle,
      not consumer-specific reinterpretations (Semantic OS CRT philosophy).
    problem_it_solves: >-
      Separates structural interpretation (what the market is doing) from consumer decisions
      (whether to trade it). Prevents strategy-branded forks of the same geometry.
    explicit_non_goals:
      - Does not own fusion weights or risk economics.
      - Does not claim economic edge (CRT mechanism CLOSED ≠ expectancy proven).
      - Does not replace the feature vector (structure uses features; it is not the vector).

    miar_stage: opportunity_understanding
    miar_entry: crt
    closure_surface_id: CRT
    ontology_ids:
      - SEM-011
    owner_boundary: BD-006
    related_boundaries:
      - BD-001
      - BD-007
    canonical_source: src/config_layer/crt_engine_v2.py

    invariants:
      - Only VALID_TRANSITIONS among the 12 CRT states are legal (9 execution-timeframe + 3 disjoint parent-timeframe, F-075).
      - The 3 parent-timeframe states (RANGE_C1/MANIPULATION_C2/DISTRIBUTION_C3) form a self-contained sub-graph that never intersects the 9 execution-timeframe states — see PARENT_TIMEFRAME_STATES / EXECUTION_TIMEFRAME_STATES.
      - M15-SLR, HTFBuilder, and ParentRange are distinct objects (CT-009 / crt_object_relations.yaml); detect_sweep reads only M15-SLR.
      - Structural config defines the narrative; consumer config must not rewrite state meaning.
      - Resolver parity with the engine may be incomplete by construction (F-069) — engine is authority for trades.
    preconditions:
      - Canonical features available for the bar.
      - CRTConfig resolved for the instrument path.
    postconditions:
      - A CRT state (and optional TRADE_OPENED commitment) consistent with the engine topology.
    assumptions:
      - assumption: >-
          Structural detection is economically informative under realistic costs.
        falsified_by: F-019
        status: FALSIFIED

    behavior: >-
      Advances the CRT state machine on each closed bar using registered geometry and config
      thresholds; may emit a structural setup that later steps score and plan.
    failure_modes:
      - mode: INVALID_TRANSITION
        symptom: State jump outside VALID_TRANSITIONS.
        detection: State topology tests / engine asserts.
        finding: null
      - mode: STRUCTURAL_CONFIG_SPLIT
        symptom: Programmatic CRTConfig path diverges from production JSON (F-057 class).
        detection: Config construction census / fingerprint.
        finding: F-057
      - mode: NO_SETUP
        symptom: Bar stays RANGE or never reaches EXECUTION — no trade path.
        detection: Funnel counters / state occupancy.
        finding: null

    why_this_design: >-
      One structural language for many consumers. Mechanism can be CLOSED while economics remain
      open — that distinction is intentional (crt_closure_report).
    alternatives_rejected:
      - alternative: Let each strategy redefine sweep/disp geometry.
        why_rejected: Produces incompatible narratives for the same candle; research becomes non-comparable.
        evidence: docs/governance/SEMANTIC_OS_V1_DESIGN.md
    research_findings:
      - F-019
      - F-057
      - F-069
      - F-075
    hypotheses: []
    framework_ids: []

    summary_50: >-
      Shared CRT structural narrative of the market — not a strategy, not an economic claim.
    summary_200: >-
      CRT market structure is the structural language used by the spine: twelve states (nine
      execution-timeframe + three disjoint parent-timeframe, F-075) and legal transitions
      describing accumulation, sweep, displacement, and execution setup. Consumers (fusion,
      research, risk) may score or gate differently but must not invent alternate structural
      meanings for the same candle. Economic nulls under research do not reopen the mechanism
      boundary without new evidence.
    retrieval_keywords:
      - CRT
      - state machine
      - sweep
      - displacement
      - retest
      - structural language
    semantic_tags:
      - structure
      - crt
      - domain


    findings: []
    primary_source: docs/current-findings.md

  - id: STR-HYPOTHESIS-REGISTRY
    path: "data/hypothesis_registry.jsonl"
    family: generated_registry
    layer: null
    catalog_stream_status: IDENTIFIED
    allowed_cc: [CC-HYPOTHESIS-REGISTRY]
    forbidden_cc: [CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG]
    meaning_authority: INVENTORY_NOT_MARKET
    identity_notes: >-
      Seeded registry carrying research authority only. An H-id existing is not an H-id

  - id: STR-SEMANTIC-OS-FILE-IDENTITIES
    path: "data/semantic_os/file_identities.jsonl"
    family: generated_registry
    layer: null
    catalog_stream_status: IDENTIFIED
    allowed_cc: [CC-SEMANTIC-OS]
    forbidden_cc: [CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG]
    meaning_authority: [CN-012]
    identity_notes: >-
      Projection of the hand-authored Semantic OS YAML; the YAML is the authority.
    findings: []
    primary_source: docs/governance/semantic_os/file_identities.yaml

  - id: STR-JSONL-CLAIM-CATALOG
    path: "data/jsonl_claim_catalog.jsonl"
    family: generated_registry
    layer: null
    catalog_stream_status: IDENTIFIED
    allowed_cc: [CC-SEMANTIC-OS]
    forbidden_cc: [CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG]

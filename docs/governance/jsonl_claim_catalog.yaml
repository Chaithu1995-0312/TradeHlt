  - id: STR-PARQUET-PROJECTION
    path: "**/*.parquet"
    family: parquet_projection
    layer: null
    catalog_stream_status: N_A
    allowed_cc: []
    forbidden_cc: [CC-PARQUET-PROJECTION, CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG]
    meaning_authority: INVENTORY_NOT_MARKET
    identity_notes: >-
      Derived projection of a JSONL system of record; a stale sidecar is ignored by the reader.
      Never a second authority - it cannot corroborate the JSONL it was made from.
    findings: []
    primary_source: null

  - id: STR-BAR-STRUCTURE-SNAPSHOT
    path: "logs/**/*_bar_structure.jsonl"
    family: runtime_untracked
    layer: L3
    catalog_stream_status: IDENTIFIED
    allowed_cc: [CC-CTX-RUN-SCOPED-OBSERVATION]
    forbidden_cc: [CC-CTX-NOT-DECISION, CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG]
    meaning_authority: [SEM-035]
    identity_notes: >-
      Run-scoped and fold-complete. Carries instrument, corpus_sha256 and run_id, and a GAPLESS
      bar_index over every bar including warmup, so folding it yields a correct occupancy series.
      That is precisely what logs/crt_transitions.jsonl lacks (empty instrument, no RESET record)
      and is why that stream is CC-L3-GLOBAL-UNIDENTIFIED while this one is not. The CRT state is
      the ENGINE state, not the resolver - joining the two on bar index remains CC-L3-FORBIDDEN-JOIN.
    findings: []
    primary_source: null

# ---------------------------------------------------------------------------------------------
# CLAIM CLASSES — the closed CC-* vocabulary. polarity CANNOT is always REFUSED.
# ---------------------------------------------------------------------------------------------
claim_classes:
  # ---- CANNOT --------------------------------------------------------------------------------
  - id: CC-F022-CONTAMINATED
    polarity: CANNOT
    llm_claim: "This trade was profitable"
    against: "opportunities.jsonl outcome / rr_achieved"
    why: "F-022 CONTAMINATED - a detection stream, not L5 of engine_trade"
    catalog_stream_status: CONTAMINATED
    findings: [F-022]
    meaning_authority: []

  - id: CC-L3-GLOBAL-UNIDENTIFIED
    polarity: CANNOT
    llm_claim: "CRT was in state X at this bar"
    against: "global logs/crt_transitions.jsonl"
    why: "No RESET record and an empty instrument - not an occupancy series (identity 7.3, 11)"
    catalog_stream_status: UNIDENTIFIED
    findings: []
    meaning_authority: [SEM-011]

  - id: CC-CTX-NOT-DECISION
    polarity: CANNOT
    llm_claim: "This context feature influenced a trading decision"
    against: "logs/**/*_bar_structure.jsonl"
    why: "Emitted AFTER process_candle returns, default-off, promoted_families empty - observation is not authority (6.5)"
    catalog_stream_status: IDENTIFIED
    findings: []
    meaning_authority: [SEM-035]

  - id: CC-L1-UNIDENTIFIED
    polarity: CANNOT
    llm_claim: "These features are the bar"
    against: "logs/feature_snapshots.jsonl"
    why: "UNIDENTIFIED - no instrument, no corpus, no run (identity 11)"
    catalog_stream_status: UNIDENTIFIED
    findings: []
    meaning_authority: [FM-041]

  - id: CC-L3-FORBIDDEN-JOIN
    polarity: CANNOT
    llm_claim: "Engine state equals resolver state"
    against: "two L3 producers joined on bar index"
    why: "Forbidden join - divergent construction, 88.16% agreement (F-069, contract 7.2)"
    catalog_stream_status: UNJOINABLE
    findings: [F-069]
    meaning_authority: [SEM-011]

  - id: CC-PARQUET-PROJECTION
    polarity: CANNOT
    llm_claim: "Parquet says so, therefore the JSONL agrees"
    against: "any *.parquet next to its source JSONL"
    why: "Projection, not a second authority - derived from the thing it would corroborate"
    catalog_stream_status: N_A
    findings: []
    meaning_authority: []

  - id: CC-PRESENCE-NOT-G001
    polarity: CANNOT
    llm_claim: "This is positive expectancy / a G001 improvement"
    against: "any JSONL merely being present"
    why: "Presence is not expectancy. Authority is earned only by measured G001 (CLAUDE.md 6.5)"
    catalog_stream_status: N_A
    findings: [F-001]
    meaning_authority: []

  - id: CC-TV-NOT-IN-STREAM
    polarity: CANNOT
    llm_claim: "The chart matches TradingView"
    against: "any JSONL"
    why: "Screenshots are not in the stream; TV forensic coverage is month-scoped (P-FLOW-03)"
    catalog_stream_status: N_A
    findings: [F-080]
    meaning_authority: []

  - id: CC-ULTRON-NOT-IN-BACKTEST
    polarity: CANNOT
    llm_claim: "UltronRiskGate approved this backtest trade"
    against: "backtest trade / event JSONL"
    why: "P-FLOW-13: EngineRunner.run() ends at DecisionEngine; backtest_v2 never calls the gate"
    catalog_stream_status: N_A
    findings: []
    meaning_authority: []

  - id: CC-MEANING-NOT-LOG
    polarity: CANNOT
    llm_claim: "What RANGE (or any market state) means"
    against: "any JSONL"
    why: "Meaning is the ontology (CLAUDE.md 6.6). A log line is occupancy or an event, never a definition"
    catalog_stream_status: N_A
    findings: []
    meaning_authority: [SEM-011]

  - id: CC-ILLEGAL-JOIN
    polarity: CANNOT
    llm_claim: "Two true lines, therefore one object"
    against: "any join not declared legal"
    why: "Valid lines plus an illegal join is still a hallucination"
    catalog_stream_status: UNJOINABLE
    findings: []
    meaning_authority: []

  - id: CC-MC-DECLARED-UNEXECUTED
    polarity: CANNOT
    llm_claim: "The contract ran / mt00 is PASS"
    against: "an MC-* instance with no matching result line"
    why: "F-083 silent gap - declared-but-unexecuted was indistinguishable from executed"
    catalog_stream_status: N_A
    findings: [F-083]
    meaning_authority: []

  - id: CC-L5-UNIDENTIFIED
    polarity: CANNOT
    llm_claim: "This is the realized R of production's trade"
    against: "a result line whose l5_basis fails the five-key token classifier"
    why: "A run-level basis is not an L5 object; an incomplete basis cannot close an outcome claim"
    catalog_stream_status: UNIDENTIFIED
    findings: [F-088]
    meaning_authority: []

  # ---- CAN -----------------------------------------------------------------------------------
  - id: CC-FINDING-EXPORT
    polarity: CAN
    llm_claim: "Finding F-NNN exists and the export is a faithful view of it"
    against: "docs/current-findings.md (PRIMARY); data/findings.jsonl is the derived view"
    why: "Existence of a registered conclusion. NOT that the conclusion is true or economic"
    catalog_stream_status: IDENTIFIED
    findings: []
    meaning_authority: []

  - id: CC-CTX-RUN-SCOPED-OBSERVATION
    polarity: CAN
    llm_claim: "The engine CRT state at this identified bar of this identified run was X"
    against: "logs/**/*_bar_structure.jsonl"
    why: "Run + instrument + corpus identity present and bar coverage gapless. Observation only, never value"
    catalog_stream_status: IDENTIFIED
    findings: []
    meaning_authority: [SEM-035]

  - id: CC-HYPOTHESIS-REGISTRY
    polarity: CAN
    llm_claim: "Hypothesis H-NNN is registered"
    against: "data/hypothesis_registry.jsonl"
    why: "Registration only, research authority. Registered is not validated"
    catalog_stream_status: IDENTIFIED
    findings: []
    meaning_authority: []

  - id: CC-SEMANTIC-OS
    polarity: CAN
    llm_claim: "This CN / BD / JN / CT / FileIdentity id exists"
    against: "Semantic OS YAML via the existing CT-008 NOUN path"
    why: "Closed-vocabulary membership. Does not grant the node any production authority"
    catalog_stream_status: IDENTIFIED
    findings: []
    meaning_authority: [CN-012]

  - id: CC-SCRIPT-REGISTRY
    polarity: CAN
    llm_claim: "This script path carries an SCR-id"
    against: "data/script_registry.jsonl"
    why: "Inventory coverage only. Registered is not correct"
    catalog_stream_status: IDENTIFIED
    findings: []
    meaning_authority: []

  - id: CC-PROMOTION-LOG
    polarity: CAN
    llm_claim: "Version V was promoted / rejected / rolled back at hash H"
    against: "configs/promotion_log.jsonl"
    why: "An audited governance event happened. NOT that the promoted config is profitable"
    catalog_stream_status: IDENTIFIED
    findings: []
    meaning_authority: []

  - id: CC-ENVELOPE-SHAPE
    polarity: CAN
    llm_claim: "This stream's SCHEMA carries the event-fabric envelope keys"
    against: "docs/reference/schemas.md 9.4 + make_event_envelope"
    why: >-
      Shape of the contract, proved from committed sources. Does NOT require the gitignored
      stream file to exist and does NOT prove any occupancy.
    catalog_stream_status: N_A
    findings: []
    meaning_authority: []

  - id: CC-AGENT-AUDIT-RAN
    polarity: CAN
    llm_claim: "Tool T ran in this session"
    against: "logs/agent_audit.jsonl (source = the tool name)"
    why: >-
      A local invocation record. Never GROUNDED from the catalog row alone; a missing file is
      UNKNOWN (not clone-visible), never REFUSED.
    catalog_stream_status: UNIDENTIFIED
    findings: [F-071]
    meaning_authority: []

  - id: CC-MC-SCHEMA-SHAPE
    polarity: CAN
    llm_claim: "This MC-* document validates against the frozen measurement-contract schema"
    against: "configs/research/measurement_contracts/instances/MC-*.json"
    why: "Shape only. UNRUN is legal and still GROUNDS - shape is not execution"
    catalog_stream_status: IDENTIFIED
    findings: [F-083]
    meaning_authority: []

  - id: CC-MC-RESULT-BINDING
    polarity: CAN
    llm_claim: "This measurement actually executed and its artifacts are bound"
    against: "an MC-* instance joined to configs/research/measurement_result_log.jsonl"
    why: >-
      Executed, not passed - FAIL and PARTIAL with an honest result line GROUND. Requires
      non-UNRUN plus a result line plus matching artifact hashes plus N_A or BASIS_DECLARED.
    catalog_stream_status: IDENTIFIED
    findings: [F-083]
    meaning_authority: []

# ---------------------------------------------------------------------------------------------
# FORBIDDEN JOINS — evaluated BEFORE any CAN can ground. Endpoint grammar (closed):
#   STR-* | producer:engine | producer:resolver | family:<family>
# Matching is order-insensitive. Do not overlap the specialized row with the generic one.
# ---------------------------------------------------------------------------------------------
  - id: CC-SEM034-PROXY-RANK
    polarity: CAN
    llm_claim: "The SEM-034 proxy ranked bar B top-N by candle_range (or by body_size) over corpus C"
    against: "docs/research-readiness/sujan_manipulation/candidates/candidates_*.jsonl"
    why: >-
      A deterministic, recomputable ordering over FM-002 / FM-001 magnitudes. NOT that the bar
      is visually dominant, NOT that it is a bulk candle, NOT that it is a parent.
    catalog_stream_status: IDENTIFIED
    findings: []
    meaning_authority: [SEM-034]

  - id: CC-SEM034-NOT-A-PARENT
    polarity: CANNOT
    llm_claim: "Therefore this bar is a bulk candle / a parent / what Sujan means by visually dominant"
    against: "any SEM-034 candidate stream"
    why: >-
      SEM-034 is an APPROVED but UNVALIDATED mechanical proxy for a VISUAL concept, and
      UNK-007 remains open. It has never been agreement-checked against a chart reading. A
      candidate becomes a parent only by human-bridge confirmation. Absence from the shortlist
      is likewise not evidence: top-N over the whole corpus left 20 of 25 XAUUSD months empty.
    catalog_stream_status: N_A
    findings: []
    meaning_authority: [UNK-007, SEM-034]

  - id: CC-SEM033-DETECTION
    polarity: CAN
    llm_claim: "The frozen SEM-033 predicate fired at bar B against supplied parent P"
    against: "docs/research-readiness/sujan_manipulation/phase1/alerts.jsonl"
    why: >-
      A recomputable geometric fact over OHLC and two supplied levels. NOT that the bar was
      tradable, profitable, or that P is a bulk candle by any approved rule (UNK-007).
    catalog_stream_status: IDENTIFIED
    findings: []
    meaning_authority: [SEM-033]

  - id: CC-SEM033-NOT-SUJAN
    polarity: CANNOT
    llm_claim: "Therefore Sujan CRT manipulation occurred / Sujan CRT works or does not work"
    against: "any SEM-033 stream"
    why: >-
      Measurement firewall. SEM-033 is an object the human bridge specified; its identity as
      Sujan's manipulation is NOT CERTIFIED and its founding is UNRESOLVED (UNK-007). A
      detection result never propagates upward to Sujan CRT, and never sideways to ParentCRT
      MANIPULATION_C2 (F-077) or to SEM-031 / F-095.
    catalog_stream_status: N_A
    findings: [F-077, F-095]
    meaning_authority: [SEM-033]

  - id: CC-PV-CHAIN-BINDING
    polarity: CAN
    llm_claim: "The origin of this decision is recoverable: its evidence, hypothesis, measurement contract and measurement execution all resolve"
    against: "a provenance record in configs/research/provenance_ledger.jsonl"
    why: >-
      Requires chain_complete true AND every binding resolves. RECOVERABLE, not correct - a
      binding proves a target exists and was named, never that it supports the claim. The
      weakest binding class sets chain_class, so an ATTESTED slot makes an ATTESTED chain.
    catalog_stream_status: IDENTIFIED
    findings: []
    meaning_authority: []

  - id: CC-PV-NOT-VALIDITY
    polarity: CANNOT
    llm_claim: "This decision has a complete provenance chain, therefore its claim is true / economic / authorised"
    against: "configs/research/provenance_ledger.jsonl joined to any outcome or promotion surface"
    why: >-
      The misreading this architecture most invites. Provenance completeness is not validity, is
      not economic value and is not authority (CLAUDE.md 6.5). grants_authority is const false on
      every record and pinned by a test. A complete chain over a FALSIFIED finding is normal and
      expected - it means the falsification is well documented.
    catalog_stream_status: IDENTIFIED
    findings: []
    meaning_authority: []



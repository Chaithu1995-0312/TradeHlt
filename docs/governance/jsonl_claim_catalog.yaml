    findings: []
    primary_source: scripts/governance/seed_hypothesis_registry.py

  - id: STR-SCRIPT-REGISTRY
    path: "data/script_registry.jsonl"
    family: generated_registry
    layer: null
    catalog_stream_status: IDENTIFIED
    allowed_cc: [CC-SCRIPT-REGISTRY]
    forbidden_cc: [CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG]
    meaning_authority: INVENTORY_NOT_MARKET
    identity_notes: >-
      SITS inventory. An SCR-id proves the path is registered, not that the script is correct.

# JSONL Claim Catalog — PRIMARY, hand-authored, living.
#
# The closed vocabulary behind SemanticGrounder's `kind=JSONL` claim kind (CT-008 extension).
# Encodes P-FLOW-15's CAN / CANNOT table as data so an LLM receives a NAMED refusal instead of
# a plausible-looking GROUNDED. Spec: docs/governance/JSONL_CLAIM_SURFACE.md.
#
# GENERATED projection: data/jsonl_claim_catalog.jsonl — never hand-edit it; the floor
# (tests/test_jsonl_claim_catalog.py) asserts on-disk == a fresh deterministic render.
#
# SCOPE / AUTHORITY (CLAUDE.md §6.5): advisory only. Cataloguing a stream does NOT identify it,
# does NOT grant it economic authority, and does NOT stamp the frozen L0–L5 primary keys onto it
# (CANONICAL_LAYER_IDENTITY_CONTRACT.md §12.3 forbids treating existing JSONL as if it already
# carried them). `catalog_stream_status` below is a §11 census label, NEVER an
# identity.check.CheckResult.status.
#
# v1 = the P-FLOW-15 seed. The completeness oracle is this file's own tables, not a writer-site
# census. An uncatalogued stream path grounds UNKNOWN (fail closed). Adding a stream is a later
# JSONL_CLAIM_SURFACE_CHANGE PR, not a v1 gap.
#
# Glob rules: `generated_registry` and `committed_audit` paths are EXACT (a registry is one file);
# `runtime_untracked` and `parquet_projection` may glob (they are per-run trees).

schema_version: jsonl_claim_catalog/1
authority: advisory

# ---------------------------------------------------------------------------------------------
# STREAMS — what a JSONL file on disk is, and which claim classes it can close.
# ---------------------------------------------------------------------------------------------
streams:
  - id: STR-F022-OPPORTUNITIES
    path: "**/opportunities.jsonl"
    family: runtime_untracked
    layer: L5
    catalog_stream_status: CONTAMINATED
    allowed_cc: [CC-ENVELOPE-SHAPE]
    forbidden_cc: [CC-F022-CONTAMINATED, CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG]
    meaning_authority: INVENTORY_NOT_MARKET
    identity_notes: >-
      F-022 DETECTION stream, not a trade ledger: outcome / rr_achieved are only 36.8%
      self-consistent (SL_HIT on paths that never touched the stop) and are not L5 of
      engine_trade. 139,942 detections is not 13 spine trades (frequency illusion).
    findings: [F-022]
    primary_source: null

  - id: STR-CRT-TRANSITIONS-GLOBAL
    path: "logs/crt_transitions.jsonl"
    family: runtime_untracked
    layer: L3
    catalog_stream_status: UNIDENTIFIED
    allowed_cc: [CC-ENVELOPE-SHAPE]
    forbidden_cc: [CC-L3-GLOBAL-UNIDENTIFIED, CC-L3-FORBIDDEN-JOIN, CC-MEANING-NOT-LOG]
    meaning_authority: [SEM-011]
    identity_notes: >-
      Global append stream with an empty instrument field and no RESET record, so folding it
      yields a WRONG state series - it is not an occupancy series (identity contract 7.3, 11).
      Only a run-scoped event stream is fold-complete.
    findings: []
    primary_source: null

  - id: STR-FEATURE-SNAPSHOTS
    path: "logs/feature_snapshots.jsonl"
    family: runtime_untracked
    layer: L1
    catalog_stream_status: UNIDENTIFIED
    allowed_cc: [CC-ENVELOPE-SHAPE]
    forbidden_cc: [CC-L1-UNIDENTIFIED, CC-MEANING-NOT-LOG]
    meaning_authority: [FM-041]
    identity_notes: >-
      No instrument, no corpus, no run - UNIDENTIFIED under identity contract 11. A row cannot
      be bound back to the bar that produced it.
    findings: []
    primary_source: null

  - id: STR-BACKTEST-TRADES
    path: "results/**/trades.jsonl"
    family: runtime_untracked
    layer: L5
    catalog_stream_status: UNIDENTIFIED
    allowed_cc: [CC-ENVELOPE-SHAPE]
    forbidden_cc: [CC-ULTRON-NOT-IN-BACKTEST, CC-PRESENCE-NOT-G001, CC-TV-NOT-IN-STREAM]
    meaning_authority: INVENTORY_NOT_MARKET
    identity_notes: >-
      Backtest ledger. EngineRunner.run() ends at DecisionEngine and backtest_v2 never enters
      ExecutionPlanner or UltronRiskGate (P-FLOW-13), so no row here records a risk-gate
      approval.
    findings: []
    primary_source: null

  - id: STR-AGENT-AUDIT
    path: "logs/agent_audit.jsonl"
    family: runtime_untracked
    layer: null
    catalog_stream_status: UNIDENTIFIED
    allowed_cc: [CC-AGENT-AUDIT-RAN, CC-ENVELOPE-SHAPE]
    forbidden_cc: [CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG]
    meaning_authority: INVENTORY_NOT_MARKET
    identity_notes: >-
      Session-local tool-invocation log. Proves a tool RAN in this checkout; a fresh clone has
      no such file (gitignored), so absence grounds UNKNOWN, never REFUSED.
    findings: [F-071]
    primary_source: null

  - id: STR-PROMOTION-LOG
    path: "configs/promotion_log.jsonl"
    family: committed_audit
    layer: null
    catalog_stream_status: IDENTIFIED
    allowed_cc: [CC-PROMOTION-LOG, CC-ENVELOPE-SHAPE]
    forbidden_cc: [CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG]
    meaning_authority: INVENTORY_NOT_MARKET
    identity_notes: >-
      Append-only committed promotion audit. Proves a version was PROMOTED / REJECTED / ROLLED
      BACK at a config hash - never that the config is profitable.
    findings: []
    primary_source: null

  - id: STR-MEASUREMENT-RESULT-LOG
    path: "configs/research/measurement_result_log.jsonl"
    family: committed_audit
    layer: null
    catalog_stream_status: IDENTIFIED
    allowed_cc: [CC-MC-RESULT-BINDING, CC-ENVELOPE-SHAPE]
    forbidden_cc: [CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG, CC-L5-UNIDENTIFIED]
    meaning_authority: INVENTORY_NOT_MARKET
    identity_notes: >-
      Committed append-only record that a sealed MC-* instance actually EXECUTED. A run-level
      basis declaration is not an L5 object and is never PRESERVED. Ships in PR-3.
    findings: [F-083]
    primary_source: null

  - id: STR-SEM034-BULK-CANDIDATES
    path: "docs/research-readiness/sujan_manipulation/candidates/candidates_candle_range.jsonl"
    family: committed_audit
    layer: null
    catalog_stream_status: IDENTIFIED
    allowed_cc: [CC-SEM034-PROXY-RANK, CC-ENVELOPE-SHAPE]
    forbidden_cc: [CC-SEM034-NOT-A-PARENT, CC-SEM033-NOT-SUJAN, CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG]
    meaning_authority: [SEM-034]
    identity_notes: >-
      SEM-034 proxy shortlist. A line proves only that this bar was ranked top-N by one
      registered magnitude over this corpus. It does NOT prove the bar is a bulk candle: the
      proxy is UNVALIDATED, UNK-007 is open, and a candidate becomes a parent only on human
      confirmation. The body_size sibling list is a SEPARATE stream by the same rules; the two
      are never merged, and their overlap is a fact about the proxy, not about the market.
    findings: []
    primary_source: null

  - id: STR-SEM033-MANIPULATION-ALERTS
    path: "docs/research-readiness/sujan_manipulation/phase1/alerts.jsonl"
    family: committed_audit
    layer: null
    catalog_stream_status: IDENTIFIED
    allowed_cc: [CC-SEM033-DETECTION, CC-ENVELOPE-SHAPE]
    forbidden_cc: [CC-SEM033-NOT-SUJAN, CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG, CC-L5-UNIDENTIFIED]
    meaning_authority: [SEM-033]
    identity_notes: >-
      SEM-033 Phase-1 DETECTION stream. Each line proves the frozen purge-and-close-back-inside
      predicate fired at that bar against an EXTERNALLY SUPPLIED parent whose selection rule is
      UNRESOLVED (UNK-007). It is not a trade, carries no outcome, and its COUNT is an
      observation, never a result. It also does not establish that the detected object is the
      manipulation the trader means - that is an uncertified identity question.
    findings: []
    primary_source: null

  - id: STR-PROVENANCE-LEDGER
    path: "configs/research/provenance_ledger.jsonl"
    family: committed_audit
    layer: null
    catalog_stream_status: IDENTIFIED
    allowed_cc: [CC-PV-CHAIN-BINDING, CC-ENVELOPE-SHAPE]
    forbidden_cc: [CC-PV-NOT-VALIDITY, CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG, CC-L5-UNIDENTIFIED]
    meaning_authority: INVENTORY_NOT_MARKET
    identity_notes: >-
      Committed append-only record binding a claim-bearing decision (FINDING / DECISION /
      PROMOTION / CLOSURE) to four typed origin slots. Proves the ORIGIN of a claim is
      recoverable - never that the claim is true. grants_authority is const false.
      MPA v1, CH-measurement-provenance-architecture.
    findings: []
    primary_source: null

  - id: STR-FINDINGS-EXPORT
    path: "data/findings.jsonl"
    family: generated_registry
    layer: null
    catalog_stream_status: IDENTIFIED
    allowed_cc: [CC-FINDING-EXPORT]
    forbidden_cc: [CC-PRESENCE-NOT-G001, CC-MEANING-NOT-LOG]
    meaning_authority: INVENTORY_NOT_MARKET
    identity_notes: >-
      Derived view of the living conclusions doc. The PRIMARY markdown is the authority and is

## Bridge to Feature Authority (L4) and Semantic Authority (L5) vocabulary

The Semantic Trace vocabulary is already drafted in market_language_schema.json (v1,
DRAFT_DETERMINISTIC_FIRST, PROPOSAL_AWAITING_ENGINE_CONSUMER):

  trace_id:
    purpose: contiguous CRT-machine residence episode
    value_domain: crt_machine canonical state (one of 12) + feature_enum gate fingerprint
    grounded_in: [crt_machine, feature_enum]

  can_join:
    purpose: predicate-level joinability - do observed gates satisfy the target state?
    value_domain: predicate over the activation_condition gate keys for the specific crt_machine
      state being traced (14 distinct gate keys exist across all 12 states; each state's fingerprint
      uses the subset that state checks)
    grounded_in: [feature_enum, crt_to_predicate_gating_edge]

The full gate vocabulary across all crt_machine states (14 keys from market_crt_states.yaml
`states[].when` blocks across the 9 predicate-bearing states; RANGE checks exactly the 10 below):
  liquidity_sweep, break_of_structure, sweep_detected, displacement_flag,
  double_sweep, higher_high, lower_low, retest_flag, swing_high, swing_low,
  change_of_character, session, rsi_state, trend_bias

Example gate fingerprint (RANGE state, from market_crt_states.yaml:235-251 - states.RANGE.when):
  liquidity_sweep: [NoSweep]
  break_of_structure: [NoBreak]
  sweep_detected: [NoSweep]
  displacement_flag: [NoDisplacement]
  double_sweep: [NoDoubleSweep]
  higher_high: [NoHigherHigh]
  lower_low: [NoLowerLow]
  retest_flag: [NoRetest]
  swing_high: [NoSwingHigh]
  swing_low: [NoSwingLow]

So a semantic_trace_id instance would read, e.g.:
  semantic_trace_id:
    crt::RANGE
    gates::NoSweep|NoBreak|NoSweep|NoDisplacement|NoDoubleSweep|NoHigherHigh|NoLowerLow|NoRetest|NoSwingHigh|NoSwingLow

Note: the gate fingerprint must use the EXACT enum values from market_crt_states.yaml
`states[].when` blocks (the detection predicates for each CRT state), not a reworded shorthand,
so the trace remains authority-grounded.


Authority notes for the Semantic Trace bridge (from the two CRT YAML files):

  - 12 crt_machine states are declared in crt_state_identity.yaml identity.states (Tier 1 semantic
    core). 9 of them carry detection predicates in market_crt_states.yaml states[].when; the other 3
    (RANGE_C1, DISTRIBUTION_C3, MANIPULATION_C2) are identity/classification metadata only with no
    when-block - a Semantic Trace instance for those states would carry an empty gate fingerprint.
  - EXECUTION has a 4-gate predicate in market_crt_states.yaml (retest_flag, trend_bias, rsi_state,
    session) but crt_state_identity.yaml marks it reachable: false (structurally unreachable). The
    predicate exists; the identity declares the state not currently reachable by the constructor.
  - RANGE is the ground state with the largest fingerprint (10 gates). It is the default/ground: bars
    that fail every predicate set still fall through to RANGE (resolver default, market_crt_states.yaml).
  - 3 crt_machine states carry empty when-blocks (SHADOW_PENDING, EXPIRED, RESOLUTION): they are either
    temporal (EXPIRED/RESOLUTION, require TTL or trade-state memory) or memory-only (SHADOW_PENDING).

This is why the Semantic Trace contract says each state's fingerprint is the subset that state checks -
not every state has the same gates, and the completeness of a state's fingerprint is itself an
authority-grounded quantity.




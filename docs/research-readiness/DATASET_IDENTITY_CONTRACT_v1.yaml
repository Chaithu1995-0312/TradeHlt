## Orphan classification (Sept-19 test case)

A dataset identity + integrity layer classifies orphans before any strategy conclusions are allowed.
Example: the config-only run with no paired output.

  run_id: run_20260919_175341

  dataset_identity_status: MISSING      # no dataset_trace_id was frozen
  dataset_integrity_status: UNKNOWN     # no dataset_hash was recorded
  admissibility: REJECTED              # no admissible dataset -> no strategy conclusions

This is why the layer matters: a config dump exists, but the system cannot answer:
  - which dataset was consumed?
  - was the dataset admissible?
  - did semantic traces ever exist?

Under this contract, the run is classified MISSING/UNKNOWN/REJECTED before any strategy reasoning is
allowed, rather than silently orphaned.


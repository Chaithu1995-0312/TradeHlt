# DATASET_IDENTITY_CONTRACT_v1
#
# Single authority document for the Dataset Identity layer (L2).
# Status: DRAFT - frozen contract fields only; implementation pending.
# See: market_language_schema.json (L4/L5 Semantic Trace vocabulary, already drafted).
#
# Architecture ladder (authority order, top = closest to storage/preservation):
#   L0 Storage Preservation
#       |
#   L1 Run Identity        - which execution produced this artifact?
#       |
#   L2 Dataset Identity    - which market dataset was consumed?   <- THIS CONTRACT
#       |
#   L3 Dataset Integrity  - can this dataset be trusted?
#       |
#   L4 Feature Authority
#       |
#   L5 Semantic Authority
#
# Hidden distinction (within L2):
#   Dataset Identity
#       |
#   Dataset Trace        <- lineage, assigned, meaning-carrying
#       |
#   Dataset Integrity    <- content, derived, re-verifiable
#
# dataset_trace_id and dataset_hash are NOT the same thing.
#   - same trace / different hash : content changed, lineage preserved
#   - same hash  / different trace : re-released under a new lineage label
# The contract permits both; it does NOT collapse them.

version: 1
status: DRAFT
name: DATASET_IDENTITY_CONTRACT
domain: market-data identity and lineage

purpose: |
  Define the authoritative Dataset Identity layer contract: the canonical record fields, the
  three load-bearing governance decisions (minting authority, hash scope, run-dataset cardinality),
  and the bridge between Dataset Trace (lineage) and Semantic Trace state-machine reasoning (L4/L5).

  This contract is load-bearing: everything downstream (Parquet storage, FeaturePipeline execution,
  Semantic Trace instances, CRT lineage, research provenance) builds on top of it. The contract is
  intentionally minimal - it contains ONLY the canonical record plus the three decisions the entire
  layer rests on.

---

## Canonical record (single dataset identity)

The authoritative fields of one dataset identity. A dataset identity is frozen when it is consumed
by a run and recorded in a run artifact, OR registered as a standalone lineage entry.

dataset_trace_id:               # ASSIGNED authority (see Contract 1)
  description: "Human-meaning-carrying lineage label for the dataset instance."
  example: "TRACE-XAUUSD-M15-ICM-20260521-001"
  rule: "Assigned, not hash-derived. Communicates symbol, timeframe, broker, lineage ordinal."
  mutable: false   # lineage label is stable once assigned

dataset_hash:                   # DERIVED authority (see Contract 1 + Contract 2)
  description: "Content proof - SHA of the dataset AS CONSUMED by FeaturePipeline."
  example: "sha256(...)"
  rule: "Computed, not assigned. Re-verifiable by any consumer holding the same dataset."
  mutable: false   # content hash is stable for a given consumed dataset

symbol:
  description: "Symbol of the market dataset (e.g. XAUUSD)."
  example: "XAUUSD"

timeframe:
  description: "Candle timeframe of the dataset (e.g. M15)."
  example: "M15"

broker:
  description: "Broker / feed identity the dataset originated from."
  example: "ICMarketsSC-Demo"

timezone:
  description: "Timezone the dataset bars are normalized/expressed in."
  example: "UTC+3"

schema:
  description: "Schema of the dataset (e.g. OHLCV)."
  example: "OHLCV"

row_count:
  description: "Number of rows (candles) in the consumed dataset."
  example: 47275

start_time:
  description: "Start time of the dataset contents (normalized TZ)."
  example: "2024-11-12T00:00:00"

end_time:
  description: "End time of the dataset contents (normalized TZ)."
  example: "2026-05-21T23:45:00"

identity_status:
  description: "Lifecycle status of the dataset identity."
  allowed: ["UNFROZEN", "FROZEN", "VERIFIED", "MISSING", "UNKNOWN", "REJECTED"]
  rule: "FROZEN = recorded in a run artifact; VERIFIED = admitted by L3 Integrity; MISSING/REJECTED = no admissible dataset."
  example: "VERIFIED"

---

## Contract 1 - Minting Authority

dataset_trace_id = ASSIGNED authority      (meaning-carrying: TRACE-XAUUSD-M15-ICM-001)
dataset_hash     = DERIVED authority       (sha256 of consumed dataset)

Rationale:
  - dataset_trace_id is readable across the research lineage (symbol, timeframe, broker,
    lineage ordinal). A SHA-derived trace id would not communicate meaning.
  - dataset_hash is a re-verifiable content proof; it is derived from the dataset, not assigned
    by a human.
  - This asymmetry mirrors the Run Identity design: assigned run ids (meaning-carrying) +
    derived content proofs.

Consequence:
  - Two runs consuming the same dataset instance share the same dataset_trace_id and the same
    dataset_hash (same lineage, same content).
  - A regenerated dataset file may keep the same dataset_trace_id with a different dataset_hash
    if content changed, or keep the same dataset_hash under a new dataset_trace_id if lineage was
    re-issued - both are legal under this contract.

---

## Contract 2 - Hash Scope

dataset_hash = hash(normalized OHLCV dataset CONSUMED BY FeaturePipeline)

What the hash covers:
  - The normalized OHLCV dataset as FeaturePipeline actually consumes it.
  - NOT raw CSV bytes.
  - NOT parquet bytes.
  - NOT a filename.

Rationale:
  - FeaturePipeline is the consumer. Dataset Identity should represent what the engine actually
    sees. A CSV->parquet conversion that does not change the consumed data must not change the
    hash; a conversion that changes the consumed data (normalization, alignment, NaN handling,
    bar boundaries, timezone) must change the hash - because the engine sees different data.

Load-bearing requirement (pin the normalization recipe):
  - "normalized OHLCV consumed by FeaturePipeline" is only well-defined if the normalization
    recipe itself is governed and pinned. If normalization is underspecified, then:
      - two pipelines normalizing "the same dataset" differently get different hashes for
        arguably-the-same lineage (legal under the contract, but ambiguous without a pinned recipe),
        and
      - L3 Dataset Integrity re-verification cannot be deterministic.
  - Therefore the hash scope MUST reference the authority that defines the normalization recipe
    (or the recipe must be inlined here in a future contract revision). Until then, hash scope is
    "normalized OHLCV as defined by the FeaturePipeline normalization authority."

---

## Contract 3 - Run-Dataset Cardinality

A run does NOT assume a 1:1 relationship to a dataset.

  run_id:
    run_20260916_225925_XAUUSD

  datasets:
    - dataset_trace_id: TRACE-XAUUSD-M15-ICM-001
      dataset_hash: sha256(...)
      identity_status: VERIFIED
    - dataset_trace_id: TRACE-XAUUSD-H1-ICM-002        # HTF context dataset
      dataset_hash: sha256(...)
      identity_status: VERIFIED

Rationale:
  - Future research already hints at multiple datasets per run (M15 price, H1, HTF context).
  - The canonical record for a run carries a datasets[] list, not a single dataset_trace_id.
  - Each dataset instance in the list is independently identified (trace + hash + status).

Consequence for the bridge:
  - Dataset Trace -> Semantic Trace is per-dataset. Each dataset instance a run consumes can produce
    its own set of semantic trace instances from the state-machine execution over that dataset.

---

## Bridge to Semantic Trace (L4/L5)

The bridge between Dataset Identity (L2) and Semantic Trace (L5) separates two relations that must
NOT be collapsed:

capability_link (static):
  dataset_trace_id -- enables vocabulary --> semantic vocabulary

  - The dataset (schema, timeframe, symbol, normalization) is what makes a given semantic
    vocabulary applicable. E.g. an M15 OHLCV dataset enables the M15 feature pipeline, which enables
    the CRT states and feature enums.
  - This is a CAPABILITY claim: "this dataset can feed this vocabulary." It is NOT an instance claim.

instance_link (dynamic):
  run over dataset -- produces --> semantic trace instances

  - A specific run over a specific dataset instance produces specific semantic trace instances
    (e.g. crt::SWEEP residence episodes with specific gate fingerprints during that run).
  - This is an INSTANCE claim: "this run over this dataset trace produced these semantic traces."

Therefore:
  - "produces" is really  run-over-dataset -> semantic-trace-instances,  NOT  dataset -> semantic trace.
  - Dataset Identity (L2) is the capability+lineage anchor.
  - Run Identity (L1) is the execution anchor.
  - Semantic Trace (L5) is the instance anchor.
  - A dataset trace does NOT by itself imply a semantic trace exists - only a completed run over it
    can produce semantic traces.


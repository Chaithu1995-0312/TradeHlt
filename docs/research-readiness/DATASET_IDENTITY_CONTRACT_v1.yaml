## Scope boundary (what this contract does NOT contain)

Everything below is intentionally deferred - it builds on top of this contract later:

  - Parquet / storage format decisions (L0/L3 implementation detail)
  - FeaturePipeline execution mechanics (L4 implementation detail)
  - Semantic Trace instance records and CRT lineage (L5 - vocabulary is drafted, instances come later)
  - Research provenance chains (L5 reasoning/retrieval; authority remains codebase/implementation)
  - Normalization recipe inlining (deferred to a future contract revision that pins it)

This contract contains ONLY:
  - the canonical dataset identity record fields,
  - the three load-bearing decisions (minting authority, hash scope, run-dataset cardinality),
  - the bridge-contract note (capability vs instance),
  - and the orphan-classification example.

